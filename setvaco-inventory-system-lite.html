// Core-sample mark: the signature element. A drill-core cylinder with
// layered strata, recolored per item to represent stock health depth.
function CoreSample({ layers, size = 40 }) {
  const h = size;
  const w = size * 0.42;
  const segH = h / layers.length;
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ flexShrink: 0 }}>
      <defs>
        <clipPath id={`clip-${w}-${h}`}>
          <rect x="1" y="1" width={w - 2} height={h - 2} rx={w * 0.28} />
        </clipPath>
      </defs>
      <g clipPath={`url(#clip-${w}-${h})`}>
        {layers.map((l, i) => (
          <rect key={i} className="mis-strata-seg" x="0" y={i * segH} width={w} height={segH + 0.5} fill={l} />
        ))}
      </g>
      <rect x="1" y="1" width={w - 2} height={h - 2} rx={w * 0.28} fill="none" stroke="var(--border)" strokeWidth="1" />
    </svg>
  );
}

function stockLayers(item) {
  const ratio = item.qty / Math.max(item.reorder, 1);
  const filled = Math.min(4, Math.max(1, Math.round(ratio * 4)));
  const base = ratio < 0.5 ? "var(--vital)" : ratio < 1 ? "var(--caution)" : "var(--safe)";
  return Array.from({ length: 4 }, (_, i) => (i < filled ? base : "var(--border)"));
}

function statusColor(status) {
  const map = {
    Quoted: ["var(--info)", "var(--info-soft)"],
    Confirmed: ["var(--caution)", "var(--caution-soft)"],
    Fulfilled: ["var(--safe)", "var(--safe-soft)"],
    Ordered: ["var(--info)", "var(--info-soft)"],
    "In Transit": ["var(--caution)", "var(--caution-soft)"],
    Received: ["var(--safe)", "var(--safe-soft)"],
    "In Progress": ["var(--caution)", "var(--caution-soft)"],
    Completed: ["var(--safe)", "var(--safe-soft)"],
  };
  return map[status] || ["var(--text-secondary)", "var(--panel-alt)"];
}

function SetvacoInventorySystem() {
  const [role, setRole] = useState("admin");
  const [nav, setNav] = useState("dashboard");
  const [items, setItems] = useState(initialItems);
  const [sales, setSales] = useState(initialSales);
  const [pos, setPOs] = useState(initialPOs);
  const [jobs, setJobs] = useState(initialJobs);
  const [customers] = useState(initialCustomers);
  const [saleForm, setSaleForm] = useState({ customer: "", itemId: "", qty: 1 });
  const [poForm, setPoForm] = useState({ supplier: "", itemId: "", qty: 1 });
  const [toast, setToast] = useState(null);
  const [search, setSearch] = useState("");
  const [branchFilter, setBranchFilter] = useState("All");

  const allowedNav = NAV.filter((n) => n.roles.includes(role));
  React.useEffect(() => {
    if (!allowedNav.find((n) => n.key === nav)) setNav(allowedNav[0]?.key || "dashboard");
    // eslint-disable-next-line
  }, [role]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2400); };

  const stockValue = useMemo(() => items.reduce((s, i) => s + i.qty * i.cost, 0), [items]);
  const lowStock = useMemo(() => items.filter((i) => i.qty < i.reorder), [items]);
  const openQuotes = sales.filter((s) => s.status === "Quoted").length;
  const inTransitPOs = pos.filter((p) => p.status === "In Transit" || p.status === "Ordered").length;
  const atRiskCustomers = customers.filter((c) => c.outstanding / c.creditLimit > 0.75);

  function confirmSale(id) {
    setSales((ss) => ss.map((s) => (s.id === id ? { ...s, status: "Confirmed" } : s)));
    showToast(`${id} confirmed`);
  }
  function fulfillSale(id) {
    setSales((ss) => {
      const s = ss.find((x) => x.id === id);
      if (s) setItems((its) => its.map((it) => (it.id === s.itemId ? { ...it, qty: Math.max(0, it.qty - s.qty) } : it)));
      return ss.map((x) => (x.id === id ? { ...x, status: "Fulfilled" } : x));
    });
    showToast(`${id} fulfilled & invoiced — stock updated`);
  }
  function submitSale(e) {
    e.preventDefault();
    const item = items.find((i) => i.id === saleForm.itemId);
    if (!item || !saleForm.customer) return;
    const newSO = {
      id: `SO-${String(3301 + sales.length + 1)}`,
      customer: saleForm.customer, itemId: item.id, itemName: item.name,
      qty: Number(saleForm.qty), status: "Quoted", date: "2026-08-06",
    };
    setSales((ss) => [newSO, ...ss]);
    setSaleForm({ customer: "", itemId: "", qty: 1 });
    showToast(`${newSO.id} quotation created`);
  }
  function receivePO(id) {
    setPOs((ps) => {
      const p = ps.find((x) => x.id === id);
      if (p) setItems((its) => its.map((it) => (it.id === p.itemId ? { ...it, qty: it.qty + p.qty } : it)));
      return ps.map((x) => (x.id === id ? { ...x, status: "Received" } : x));
    });
    showToast(`${id} received — stock updated`);
  }
  function submitPO(e) {
    e.preventDefault();
    const item = items.find((i) => i.id === poForm.itemId);
    if (!item || !poForm.supplier) return;
    const newPO = {
      id: `PO-${String(7710 + pos.length + 1)}`,
      supplier: poForm.supplier, itemId: item.id, itemName: item.name,
      qty: Number(poForm.qty), status: "Ordered", date: "2026-08-06",
    };
    setPOs((ps) => [newPO, ...ps]);
    setPoForm({ supplier: "", itemId: "", qty: 1 });
    showToast(`${newPO.id} raised to ${newPO.supplier}`);
  }
  function completeJob(id) {
    setJobs((js) => {
      const j = js.find((x) => x.id === id);
      if (j && j.status !== "Completed") {
        setItems((its) => its.map((it) => (it.id === j.itemId ? { ...it, qty: Math.max(0, it.qty - j.qty) } : it)));
      }
      return js.map((x) => (x.id === id ? { ...x, status: "Completed" } : x));
    });
    showToast(`${id} completed — parts consumed from stock`);
  }

  const filteredItems = items
    .filter((i) => branchFilter === "All" || i.branch === branchFilter)
    .filter((i) => i.name.toLowerCase().includes(search.toLowerCase()) || i.id.toLowerCase().includes(search.toLowerCase()) || i.brand.toLowerCase().includes(search.toLowerCase()));

  return (
    <div className="mis-root min-h-screen w-full flex" style={{ minHeight: "700px" }}>
      <Style />

      {/* SIDEBAR */}
      <aside className="mis-panel flex flex-col" style={{ width: "230px", flexShrink: 0 }}>
        <div className="flex items-center gap-3 px-4 py-5" style={{ borderBottom: "1px solid var(--border-soft)" }}>
          <CoreSample layers={["var(--ore)", "var(--caution)", "var(--info)", "var(--safe)"]} size={34} />
          <div>
            <div className="mis-display text-sm leading-tight" style={{ color: "var(--text-primary)" }}>SETVACO</div>
            <div className="text-[10px] mis-mono" style={{ color: "var(--text-tertiary)" }}>INVENTORY SYSTEM</div>
          </div>
        </div>
        <nav className="flex-1 py-2">
          {allowedNav.map((n) => {
            const Icon = n.icon;
            const active = nav === n.key;
            return (
              <button
                key={n.key}
                onClick={() => setNav(n.key)}
                className={`mis-nav-item mis-focus w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left ${active ? "active" : ""}`}
                style={{ color: active ? "var(--ore)" : "var(--text-secondary)", borderLeft: active ? undefined : "2px solid transparent" }}
              >
                <Icon size={16} />
                {n.label}
              </button>
            );
          })}
        </nav>
        <div className="px-4 py-4 text-[10px] mis-mono" style={{ color: "var(--text-tertiary)", borderTop: "1px solid var(--border-soft)" }}>
          SETVACO HOLDING LTD · PROTOTYPE · DEMO DATA
        </div>
      </aside>

      {/* MAIN */}
      <div className="flex-1 flex flex-col min-w-0">
        <header className="flex items-center justify-between px-6 py-4" style={{ borderBottom: "1px solid var(--border-soft)" }}>
          <div>
            <h1 className="mis-display text-lg" style={{ color: "var(--text-primary)" }}>
              {allowedNav.find((n) => n.key === nav)?.label || "Dashboard"}
            </h1>
            <p className="text-xs" style={{ color: "var(--text-tertiary)" }}>Viewing as {ROLES[role].label} · demo access simulation</p>
          </div>
          <div className="flex items-center gap-2">
            <span className="text-xs" style={{ color: "var(--text-tertiary)" }}>Role:</span>
            <div className="relative">
              <select
                value={role}
                onChange={(e) => setRole(e.target.value)}
                className="mis-panel-alt mis-focus text-sm rounded px-3 py-1.5 pr-8 appearance-none"
                style={{ color: "var(--text-primary)" }}
              >
                {Object.entries(ROLES).map(([key, r]) => (
                  <option key={key} value={key}>{r.label}</option>
                ))}
              </select>
              <ChevronDown size={14} style={{ position: "absolute", right: 8, top: 8, color: "var(--text-tertiary)", pointerEvents: "none" }} />
            </div>
          </div>
        </header>

        <main className="flex-1 overflow-auto mis-scroll p-6">
          {nav === "dashboard" && (
            <div className="flex flex-col gap-6">
              <div className="grid grid-cols-4 gap-4">
                <StatCard label="Total Stock Value" value={fmtGHS(stockValue)} sub="Across 3 branches" icon={Package} tint="var(--ore)" />
                <StatCard label="Below Reorder Point" value={lowStock.length} sub="Parts needing replenishment" icon={AlertTriangle} tint="var(--vital)" />
                <StatCard label="Open Quotations" value={openQuotes} sub="Awaiting customer confirmation" icon={ShoppingCart} tint="var(--caution)" />
                <StatCard label="POs In Progress" value={inTransitPOs} sub="Ordered or in transit" icon={Truck} tint="var(--info)" />
              </div>

              <div className="grid grid-cols-3 gap-4">
                <div className="mis-panel rounded-lg p-4 col-span-2">
                  <h3 className="text-sm mb-3" style={{ color: "var(--text-secondary)" }}>Parts nearest depletion</h3>
                  <div className="flex flex-col">
                    {lowStock.map((it) => (
                      <div key={it.id} className="mis-row flex items-center justify-between py-2.5 px-2 rounded" style={{ borderBottom: "1px solid var(--border-soft)" }}>
                        <div className="flex items-center gap-3">
                          <CoreSample layers={stockLayers(it)} size={30} />
                          <div>
                            <div className="text-sm" style={{ color: "var(--text-primary)" }}>{it.name}</div>
                            <div className="text-xs mis-mono" style={{ color: "var(--text-tertiary)" }}>{it.brand} · {it.branch}</div>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="mis-mono text-sm" style={{ color: "var(--vital)" }}>{it.qty} / {it.reorder}</div>
                          <div className="text-xs" style={{ color: "var(--text-tertiary)" }}>on hand / reorder</div>
                        </div>
                      </div>
                    ))}
                    {lowStock.length === 0 && <p className="text-sm" style={{ color: "var(--text-tertiary)" }}>All parts above reorder level.</p>}
                  </div>
                </div>

                <div className="mis-panel rounded-lg p-4">
                  <h3 className="text-sm mb-3" style={{ color: "var(--text-secondary)" }}>Customer credit risk</h3>
                  <div className="flex flex-col gap-3">
                    {customers.map((c) => {
                      const pct = Math.round((c.outstanding / c.creditLimit) * 100);
                      const risky = pct > 75;
                      return (
                        <div key={c.id}>
                          <div className="flex justify-between text-xs mb-1" style={{ color: risky ? "var(--vital)" : "var(--text-secondary)" }}>
                            <span>{c.name}</span>
                            <span className="mis-mono">{pct}%</span>
                          </div>
                          <div className="w-full rounded-full h-1.5" style={{ background: "var(--panel-alt)" }}>
                            <div className="h-1.5 rounded-full" style={{ width: `${Math.min(pct, 100)}%`, background: risky ? "var(--vital)" : "var(--ore)" }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {nav === "inventory" && (
            <div className="flex flex-col gap-4">
              <div className="flex items-center gap-3 flex-wrap">
                <div className="flex items-center gap-2 mis-panel-alt rounded px-3 py-2 w-80">
                  <Search size={14} style={{ color: "var(--text-tertiary)" }} />
                  <input
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Search name, code, or brand"
                    className="bg-transparent text-sm outline-none w-full mis-focus"
                    style={{ color: "var(--text-primary)" }}
                  />
                </div>
                <div className="flex items-center gap-2">
                  <MapPin size={14} style={{ color: "var(--text-tertiary)" }} />
                  <select
                    value={branchFilter}
                    onChange={(e) => setBranchFilter(e.target.value)}
                    className="mis-panel-alt mis-focus text-sm rounded px-3 py-2"
                    style={{ color: "var(--text-primary)" }}
                  >
                    <option>All</option>
                    {BRANCHES.map((b) => <option key={b}>{b}</option>)}
                  </select>
                </div>
              </div>
              <div className="mis-panel rounded-lg overflow-hidden">
                <table className="w-full text-sm">
                  <thead>
                    <tr style={{ borderBottom: "1px solid var(--border)" }}>
                      {["", "Part", "Code", "Brand", "Branch", "On Hand", "Reorder At", "Cost", "Sell Price"].map((h) => (
                        <th key={h} className="text-left px-4 py-3 text-xs uppercase tracking-wide" style={{ color: "var(--text-tertiary)" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {filteredItems.map((it) => (
                      <tr key={it.id} className="mis-row" style={{ borderBottom: "1px solid var(--border-soft)" }}>
                        <td className="pl-4 py-2.5"><CoreSample layers={stockLayers(it)} size={26} /></td>
                        <td className="px-2 py-2.5" style={{ color: "var(--text-primary)" }}>{it.name}</td>
                        <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: "var(--text-tertiary)" }}>{it.id}</td>
                        <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-secondary)" }}>{it.brand}</td>
                        <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-secondary)" }}>{it.branch}</td>
                        <td className="px-4 py-2.5 mis-mono" style={{ color: it.qty < it.reorder ? "var(--vital)" : "var(--text-primary)" }}>{it.qty}</td>
                        <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: "var(--text-tertiary)" }}>{it.reorder}</td>
                        <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: "var(--text-secondary)" }}>{fmtGHS(it.cost)}</td>
                        <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: "var(--text-secondary)" }}>{fmtGHS(it.sell)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {nav === "sales" && (
            <div className="flex flex-col gap-6">
              {(role === "sales" || role === "admin") && (
                <form onSubmit={submitSale} className="mis-panel rounded-lg p-4 flex items-end gap-3 flex-wrap">
                  <div className="flex flex-col gap-1">
                    <label className="text-xs" style={{ color: "var(--text-tertiary)" }}>Customer</label>
                    <select required value={saleForm.customer} onChange={(e) => setSaleForm((f) => ({ ...f, customer: e.target.value }))}
                      className="mis-panel-alt mis-focus text-sm rounded px-3 py-2" style={{ color: "var(--text-primary)", minWidth: "200px" }}>
                      <option value="">Select customer…</option>
                      {customers.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
                    </select>
                  </div>
                  <div className="flex flex-col gap-1">
                    <label className="text-xs" style={{ color: "var(--text-tertiary)" }}>Part</label>
                    <select required value={saleForm.itemId} onChange={(e) => setSaleForm((f) => ({ ...f, itemId: e.target.value }))}
                      className="mis-panel-alt mis-focus text-sm rounded px-3 py-2" style={{ color: "var(--text-primary)", minWidth: "220px" }}>
                      <option value="">Select part…</option>
                      {items.map((i) => <option key={i.id} value={i.id}>{i.name} ({i.id})</option>)}
                    </select>
                  </div>
                  <div className="flex flex-col gap-1">
                    <label className="text-xs" style={{ color: "var(--text-tertiary)" }}>Quantity</label>
                    <input type="number" min="1" required value={saleForm.qty} onChange={(e) => setSaleForm((f) => ({ ...f, qty: e.target.value }))}
                      className="mis-panel-alt mis-focus text-sm rounded px-3 py-2 w-24" style={{ color: "var(--text-primary)" }} />
                  </div>
                  <button type="submit" className="mis-btn-primary mis-focus rounded px-4 py-2 text-sm flex items-center gap-2">
                    <Plus size={14} /> Create quotation
                  </button>
                </form>
              )}

              <div className="mis-panel rounded-lg overflow-hidden">
                <table className="w-full text-sm">
                  <thead>
                    <tr style={{ borderBottom: "1px solid var(--border)" }}>
                      {["Order", "Customer", "Part", "Qty", "Status", "Action"].map((h) => (
                        <th key={h} className="text-left px-4 py-3 text-xs uppercase tracking-wide" style={{ color: "var(--text-tertiary)" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {sales.map((s) => {
                      const [c, soft] = statusColor(s.status);
                      return (
                        <tr key={s.id} className="mis-row" style={{ borderBottom: "1px solid var(--border-soft)" }}>
                          <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: "var(--text-tertiary)" }}>{s.id}</td>
                          <td className="px-4 py-2.5" style={{ color: "var(--text-primary)" }}>{s.customer}</td>
                          <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-secondary)" }}>{s.itemName}</td>
                          <td className="px-4 py-2.5 mis-mono">{s.qty}</td>
                          <td className="px-4 py-2.5"><Badge color={c} soft={soft}>{s.status}</Badge></td>
                          <td className="px-4 py-2.5">
                            {s.status === "Quoted" && (role === "sales" || role === "admin") && (
                              <button onClick={() => confirmSale(s.id)} className="mis-btn-ghost mis-focus rounded px-2 py-1 text-xs">Confirm order</button>
                            )}
                            {s.status === "Confirmed" && (role === "warehouse" || role === "admin") && (
                              <button onClick={() => fulfillSale(s.id)} className="mis-btn-ghost mis-focus rounded px-2 py-1 text-xs">Fulfil & invoice</button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {nav === "purchasing" && (
            <div className="flex flex-col gap-6">
              {(role === "procurement" || role === "admin") && (
                <form onSubmit={submitPO} className="mis-panel rounded-lg p-4 flex items-end gap-3 flex-wrap">
                  <div className="flex flex-col gap-1">
                    <label className="text-xs" style={{ color: "var(--text-tertiary)" }}>Supplier</label>
                    <input required value={poForm.supplier} onChange={(e) => setPoForm((f) => ({ ...f, supplier: e.target.value }))}
                      placeholder="e.g. AUROX Composites and Compounds Oy"
                      className="mis-panel-alt mis-focus text-sm rounded px-3 py-2" style={{ color: "var(--text-primary)", minWidth: "240px" }} />
                  </div>
                  <div className="flex flex-col gap-1">
                    <label className="text-xs" style={{ color: "var(--text-tertiary)" }}>Part</label>
                    <select required value={poForm.itemId} onChange={(e) => setPoForm((f) => ({ ...f, itemId: e.target.value }))}
                      className="mis-panel-alt mis-focus text-sm rounded px-3 py-2" style={{ color: "var(--text-primary)", minWidth: "220px" }}>
                      <option value="">Select part…</option>
                      {items.map((i) => <option key={i.id} value={i.id}>{i.name} ({i.id})</option>)}
                    </select>
                  </div>
                  <div className="flex flex-col gap-1">
                    <label className="text-xs" style={{ color: "var(--text-tertiary)" }}>Quantity</label>
                    <input type="number" min="1" required value={poForm.qty} onChange={(e) => setPoForm((f) => ({ ...f, qty: e.target.value }))}
                      className="mis-panel-alt mis-focus text-sm rounded px-3 py-2 w-24" style={{ color: "var(--text-primary)" }} />
                  </div>
                  <button type="submit" className="mis-btn-primary mis-focus rounded px-4 py-2 text-sm flex items-center gap-2">
                    <Plus size={14} /> Raise purchase order
                  </button>
                </form>
              )}

              <div className="mis-panel rounded-lg overflow-hidden">
                <table className="w-full text-sm">
                  <thead>
                    <tr style={{ borderBottom: "1px solid var(--border)" }}>
                      {["PO", "Supplier", "Part", "Qty", "Status", "Action"].map((h) => (
                        <th key={h} className="text-left px-4 py-3 text-xs uppercase tracking-wide" style={{ color: "var(--text-tertiary)" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {pos.map((p) => {
                      const [c, soft] = statusColor(p.status);
                      return (
                        <tr key={p.id} className="mis-row" style={{ borderBottom: "1px solid var(--border-soft)" }}>
                          <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: "var(--text-tertiary)" }}>{p.id}</td>
                          <td className="px-4 py-2.5" style={{ color: "var(--text-primary)" }}>{p.supplier}</td>
                          <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-secondary)" }}>{p.itemName}</td>
                          <td className="px-4 py-2.5 mis-mono">{p.qty}</td>
                          <td className="px-4 py-2.5"><Badge color={c} soft={soft}>{p.status}</Badge></td>
                          <td className="px-4 py-2.5">
                            {p.status !== "Received" && (role === "procurement" || role === "admin") && (
                              <button onClick={() => receivePO(p.id)} className="mis-btn-ghost mis-focus rounded px-2 py-1 text-xs">Mark received</button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {nav === "servicejobs" && (
            <div className="mis-panel rounded-lg overflow-hidden">
              <table className="w-full text-sm">
                <thead>
                  <tr style={{ borderBottom: "1px solid var(--border)" }}>
                    {["Job", "Customer", "Job Type", "Technician", "Part Used", "Qty", "Status", "Action"].map((h) => (
                      <th key={h} className="text-left px-4 py-3 text-xs uppercase tracking-wide" style={{ color: "var(--text-tertiary)" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {jobs.map((j) => {
                    const [c, soft] = statusColor(j.status);
                    return (
                      <tr key={j.id} className="mis-row" style={{ borderBottom: "1px solid var(--border-soft)" }}>
                        <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: "var(--text-tertiary)" }}>{j.id}</td>
                        <td className="px-4 py-2.5" style={{ color: "var(--text-primary)" }}>{j.customer}</td>
                        <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-secondary)" }}>{j.type}</td>
                        <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-secondary)" }}>{j.technician}</td>
                        <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-secondary)" }}>{j.itemName}</td>
                        <td className="px-4 py-2.5 mis-mono">{j.qty}</td>
                        <td className="px-4 py-2.5"><Badge color={c} soft={soft}>{j.status}</Badge></td>
                        <td className="px-4 py-2.5">
                          {j.status !== "Completed" && (role === "service" || role === "admin") && (
                            <button onClick={() => completeJob(j.id)} className="mis-btn-ghost mis-focus rounded px-2 py-1 text-xs">Complete & consume parts</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {nav === "customers" && (
            <div className="mis-panel rounded-lg overflow-hidden">
              <table className="w-full text-sm">
                <thead>
                  <tr style={{ borderBottom: "1px solid var(--border)" }}>
                    {["Customer", "Country", "Tier", "Credit Limit", "Outstanding", "Utilization"].map((h) => (
                      <th key={h} className="text-left px-4 py-3 text-xs uppercase tracking-wide" style={{ color: "var(--text-tertiary)" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {customers.map((c) => {
                    const pct = Math.round((c.outstanding / c.creditLimit) * 100);
                    const risky = pct > 75;
                    return (
                      <tr key={c.id} className="mis-row" style={{ borderBottom: "1px solid var(--border-soft)" }}>
                        <td className="px-4 py-2.5" style={{ color: "var(--text-primary)" }}>{c.name}</td>
                        <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-secondary)" }}>{c.country}</td>
                        <td className="px-4 py-2.5">
                          <Badge
                            color={c.tier === "Gold" ? "var(--ore)" : c.tier === "Silver" ? "var(--info)" : "var(--text-secondary)"}
                            soft={c.tier === "Gold" ? "var(--ore-soft)" : c.tier === "Silver" ? "var(--info-soft)" : "var(--panel-alt)"}
                          >{c.tier}</Badge>
                        </td>
                        <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: "var(--text-secondary)" }}>{fmtGHS(c.creditLimit)}</td>
                        <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: risky ? "var(--vital)" : "var(--text-secondary)" }}>{fmtGHS(c.outstanding)}</td>
                        <td className="px-4 py-2.5">
                          <div className="flex items-center gap-2">
                            <div className="w-24 rounded-full h-1.5" style={{ background: "var(--panel-alt)" }}>
                              <div className="h-1.5 rounded-full" style={{ width: `${Math.min(pct, 100)}%`, background: risky ? "var(--vital)" : "var(--ore)" }} />
                            </div>
                            <span className="mis-mono text-xs" style={{ color: risky ? "var(--vital)" : "var(--text-tertiary)" }}>{pct}%</span>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {nav === "variance" && (
            <div className="flex flex-col gap-4">
              <div className="mis-panel rounded-lg p-4 flex items-center gap-3">
                <TrendingDown size={18} style={{ color: "var(--vital)" }} />
                <p className="text-sm" style={{ color: "var(--text-secondary)" }}>
                  Variance entries are raised automatically when a branch stock count doesn't reconcile with sales, purchasing, and service-job transactions for that part.
                </p>
              </div>
              <div className="mis-panel rounded-lg overflow-hidden">
                <table className="w-full text-sm">
                  <thead>
                    <tr style={{ borderBottom: "1px solid var(--border)" }}>
                      {["ID", "Part", "Branch", "Expected", "Counted", "Delta", "Severity", "Note"].map((h) => (
                        <th key={h} className="text-left px-4 py-3 text-xs uppercase tracking-wide" style={{ color: "var(--text-tertiary)" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {varianceLog.map((v) => (
                      <tr key={v.id} className="mis-row" style={{ borderBottom: "1px solid var(--border-soft)" }}>
                        <td className="px-4 py-2.5 mis-mono text-xs" style={{ color: "var(--text-tertiary)" }}>{v.id}</td>
                        <td className="px-4 py-2.5" style={{ color: "var(--text-primary)" }}>{v.item}</td>
                        <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-secondary)" }}>{v.branch}</td>
                        <td className="px-4 py-2.5 mis-mono">{v.expected}</td>
                        <td className="px-4 py-2.5 mis-mono">{v.counted}</td>
                        <td className="px-4 py-2.5 mis-mono flex items-center gap-1" style={{ color: "var(--vital)" }}>
                          <ArrowDownRight size={12} />{v.delta}
                        </td>
                        <td className="px-4 py-2.5">
                          <Badge
                            color={v.severity === "High" ? "var(--vital)" : v.severity === "Medium" ? "var(--caution)" : "var(--info)"}
                            soft={v.severity === "High" ? "var(--vital-soft)" : v.severity === "Medium" ? "var(--caution-soft)" : "var(--info-soft)"}
                          >{v.severity}</Badge>
                        </td>
                        <td className="px-4 py-2.5 text-xs" style={{ color: "var(--text-tertiary)" }}>{v.note}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {nav === "access" && (
            <div className="mis-panel rounded-lg overflow-hidden">
              <table className="w-full text-sm">
                <thead>
                  <tr style={{ borderBottom: "1px solid var(--border)" }}>
                    <th className="text-left px-4 py-3 text-xs uppercase tracking-wide" style={{ color: "var(--text-tertiary)" }}>Role</th>
                    {NAV.map((n) => (
                      <th key={n.key} className="px-3 py-3 text-xs uppercase tracking-wide text-center" style={{ color: "var(--text-tertiary)" }}>{n.label}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {Object.entries(ROLES).map(([key, r]) => (
                    <tr key={key} className="mis-row" style={{ borderBottom: "1px solid var(--border-soft)" }}>
                      <td className="px-4 py-2.5" style={{ color: "var(--text-primary)" }}>{r.label}</td>
                      {NAV.map((n) => (
                        <td key={n.key} className="px-3 py-2.5 text-center">
                          {n.roles.includes(key)
                            ? <Check size={14} style={{ color: "var(--safe)", margin: "0 auto" }} />
                            : <span style={{ color: "var(--text-tertiary)" }}>—</span>}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </main>
      </div>

      {toast && (
        <div className="mis-panel-alt mis-focus fixed bottom-6 right-6 px-4 py-3 rounded-lg text-sm flex items-center gap-2 shadow-lg" style={{ color: "var(--text-primary)", border: "1px solid var(--border)" }}>
          <Check size={14} style={{ color: "var(--safe)" }} /> {toast}
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SetvacoInventorySystem />);


</script>
</body>
</html>
