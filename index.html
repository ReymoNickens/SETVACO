// Safe to expose client-side: the anon key only grants what Row-Level
// Security on the database allows, nothing more. Real access control lives
// in Postgres (see supabase/migrations/), not in keeping this key secret.
window.SUPABASE_URL = "https://wemcdhkivyyflrapqkpp.supabase.co";
window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlbWNkaGtpdnl5ZmxyYXBxa3BwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDQ5NDEsImV4cCI6MjEwMTc4MDk0MX0.HvfpMk2BxmvBhXw81MXTY4hUJlTop_Yp9-iXqcv0dJY";
// Captured here, synchronously, before supabase-js's own background
// processing of this URL has a chance to clear it (createClient() below
// kicks off async session-detection-from-URL immediately, which strips
// the #access_token=...&type=recovery hash — racing against React's own
// later check of window.location.hash and sometimes winning). Reading it
// into a plain global first, before the client exists at all, means the
// recovery flow is never missed regardless of how that race resolves.
window.__RECOVERY_MODE__ = window.location.hash.includes("type=recovery");
window.sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
</script>

#gate-box p { font-size: 12px; color: #565E85; margin: 0 0 16px; }

const Style = () => <style>{`

  .mis-display { font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }

  .mis-btn-primary { background: linear-gradient(135deg, var(--brand) 0%, #3A4EC0 100%); color: #FFFFFF; font-weight: 600; transition: filter 0.14s ease, transform 0.08s ease, box-shadow 0.14s ease; border-radius:3px; padding:9px 16px; font-size:13px; display:inline-flex; align-items:center; gap:6px; border:none; white-space:nowrap; box-shadow: var(--shadow-sm); }
  .mis-btn-primary:hover { filter: brightness(1.1); box-shadow: 0 6px 16px rgba(42,59,148,0.32); transform: translateY(-1px); }
  .mis-btn-primary:active { transform: translateY(0); }
  .mis-btn-primary:disabled { opacity:0.45; cursor:not-allowed; transform:none; box-shadow:var(--shadow-sm); }
  .mis-btn-accent { background: var(--teal); color: #FFFFFF; font-weight: 600; transition: filter 0.14s ease, transform 0.08s ease; border-radius:3px; padding:9px 16px; font-size:13px; display:inline-flex; align-items:center; gap:6px; border:none; white-space:nowrap; box-shadow: var(--shadow-sm); }

  .mis-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; padding:3px 8px; border-radius:2px; display:inline-block; }
  .mis-focus:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .mis-strata-seg { transition: opacity 0.15s ease; }

  .mis-card-hover:hover { box-shadow: var(--shadow-glow); transform: translateY(-3px); border-color: rgba(42,59,148,0.18); }
  .mis-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; }
  .mis-strata-rule { height: 4px; width: 64px; border-radius: 2px; background: linear-gradient(90deg, var(--brand) 0%, var(--brand) 30%, var(--teal) 30%, var(--teal) 60%, var(--coral) 60%, var(--coral) 100%); }
  .mis-seal { border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.06); }
  .mis-gear-spin { animation: mis-spin 14s linear infinite; transform-origin: center; }
  .mis-gear-spin-fast { animation: mis-spin 1.1s linear infinite; transform-origin: center; }
  @keyframes mis-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes mis-fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .mis-view-enter { animation: mis-fade-up 0.28s cubic-bezier(.2,.7,.3,1) both; }

  .mis-cmdk-overlay { position: fixed; inset: 0; background: rgba(15,19,48,0.55); backdrop-filter: blur(2px); display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 95; }

  .mis-kbd { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-faint); background: var(--panel-alt); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }

  .mis-textarea { resize: vertical; min-height: 64px; font-family: inherit; }
  .mis-table { width: 100%; font-size: 13px; border-collapse: collapse; }

  .mis-table td { padding: 9px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }

function useCountUp(value, duration = 700) {
  const [display, setDisplay] = useState(value);
  const fromRef = useRef(value);
  useEffect(() => {
    const from = fromRef.current;
    const to = typeof value === "number" ? value : 0;
    if (typeof value !== "number" || from === to) { setDisplay(value); fromRef.current = to; return; }
    const start = performance.now();
    let raf;
    const tick = now => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(Math.round(from + (to - from) * eased));
      if (t < 1) raf = requestAnimationFrame(tick); else fromRef.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => raf && cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [value]);
  return display;
}

function t(lang, key) {
  return (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.en[key] || key;
}
// Template variant: t(lang, key) with {placeholder} tokens replaced from vars.
function tf(lang, key, vars) {
  var s = t(lang, key);
  return s.replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null) ? vars[k] : m);
}
// Fills an admin-authored email template (not a translation key) with {{placeholder}} tokens.
function fillEmailTemplate(str, vars) {
  return (str || "").replace(/\{\{(\w+)\}\}/g, (m, k) => (vars && vars[k] != null) ? vars[k] : m);
}

const uid = (prefix, list, pad = 4) => {
  const nums = list.map(x => parseInt(String(x.id).split("-").pop(), 10)).filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `${prefix}-${String(next).padStart(pad, "0")}`;
};
const fmtGHS = n => `GH₵ ${Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
const todayISO = () => new Date().toISOString().slice(0, 10);
const nowISO = () => new Date().toISOString();
const fmtDateTime = iso => { try { return new Date(iso).toLocaleString(); } catch (e) { return iso; } };
function isUnderWarranty(asset) { return !!asset.warrantyExpiry && asset.warrantyExpiry >= todayISO(); }
function isContractExpiringSoon(contract) { const days = (new Date(contract.endDate) - new Date(todayISO())) / 86400000; return days >= 0 && days <= 60; }
function isContractExpired(contract) { return contract.endDate < todayISO(); }
function contractDisplayStatus(contract) {
  if (contract.status === "Cancelled") return "Cancelled";
  if (isContractExpired(contract)) return "Expired";
  if (isContractExpiringSoon(contract)) return "Expiring Soon";
  return "Active";
}

function exportRowsToExcel(filename, rows, sheetName) {
  if (!window.XLSX || !rows || !rows.length) return false;
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || "Sheet1");
  XLSX.writeFile(wb, filename);
  return true;
}
function parseExcelFile(file) {
  return new Promise((resolve, reject) => {
    if (!window.XLSX) return reject(new Error("Excel engine not loaded"));
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(sheet, { defval: "" }));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(reader.error || new Error("File read failed"));
    reader.readAsArrayBuffer(file);
  });
}
function buildMailto(to, cc, subject, body) {
  const parts = [];

function mergeInventoryRows(rows, type, items, stockRooms, branchFallback) {
  let newItems = items.slice();
  let newRooms = stockRooms.slice();
  let created = 0, updated = 0;
  rows.forEach(r => {
    const id = String(r.Code || r.ID || r.SKU || r.id || "").trim();
    const name = String(r.Name || r.Part || r.Description || r.name || "").trim();
    if (!id && !name) return;
    const branch = String(r.Branch || branchFallback || "").trim();
    const roomName = String(r["Stock Room"] || r.StockRoom || r.Room || "Main Store").trim();
    let room = newRooms.find(sr => sr.name === roomName && sr.branch === branch);
    if (!room) { room = { id: uid("SR", newRooms, 2), name: roomName, branch, isNewRoom: true }; newRooms = [...newRooms, room]; }
    const qty = Number(r.Qty ?? r.Quantity ?? r["On Hand"] ?? 0) || 0;
    const reorder = Number(r.Reorder ?? r["Reorder At"] ?? r.ReorderPoint ?? 0) || 0;
    const cost = Number(r.Cost ?? r["Unit Cost"] ?? 0) || 0;
    const sell = Number(r.Sell ?? r["Sell Price"] ?? r.Price ?? 0) || 0;
    const brand = String(r.Brand || "").trim();
    const category = String(r.Category || "").trim();
    // Match against displayCode (real data's human-readable code, e.g.
    // "WP-1001") when present, falling back to id for demo-shaped rows.
    const existingIdx = newItems.findIndex(it => id && (it.displayCode || it.id) === id);
    if (existingIdx >= 0) {
      const prevQty = newItems[existingIdx].qty;
      newItems[existingIdx] = { ...newItems[existingIdx], name: name || newItems[existingIdx].name, brand: brand || newItems[existingIdx].brand, category: category || newItems[existingIdx].category, branch, stockRoom: room.id, qty, reorder: reorder || newItems[existingIdx].reorder, cost: cost || newItems[existingIdx].cost, sell: sell || newItems[existingIdx].sell, __prevQty: prevQty };
      updated++;
    } else {
      const newId = id || uid(type === "equipment" ? "EQ" : "PT", newItems, 4);
      newItems = [...newItems, { id: newId, displayCode: id || null, type, name: name || newId, brand, category, branch, stockRoom: room.id, qty, reorder, cost, sell, __isNew: true }];
      created++;
    }
  });
  return { items: newItems, stockRooms: newRooms, created, updated };
}
function groupPORows(rows) {
  const groups = {};
  rows.forEach(r => {
    const poNum = String(r["PO Number"] || r.PONumber || r.PO || "").trim();
    if (!poNum) return;
    if (!groups[poNum]) groups[poNum] = { poNumber: poNum, vendor: String(r.Vendor || r.Supplier || "").trim(), expected: String(r["Expected Date"] || r.Expected || "").trim(), lines: [] };
    groups[poNum].lines.push({
      itemId: String(r["Item Code"] || r.ItemId || r.Code || "").trim(),
      itemName: String(r["Item Name"] || r.Item || r.Description || "").trim(),
      qty: Number(r.Qty || r.Quantity || 0) || 0
    });
  });
  return Object.values(groups);
}

function LineItemsEditor({ lines, setLines, inventoryItems, resolvePrice, lang }) {
  function updateLine(idx, patch) { setLines(ls => ls.map((l, i) => i === idx ? { ...l, ...patch } : l)); }
  function removeLine(idx) { setLines(ls => ls.filter((_, i) => i !== idx)); }
  function addInventoryLine() { setLines(ls => [...ls, { itemId: "", desc: "", qty: 1, unitPrice: 0, newPart: false }]); }
  function addCustomLine() { setLines(ls => [...ls, { itemId: "", desc: "", qty: 1, unitPrice: 0, newPart: true }]); }
  const total = lines.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.unitPrice) || 0), 0);
  return <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
    {lines.map((line, idx) => <div key={idx} className="mis-panel-alt" style={{ borderRadius: 2, padding: 10, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
      {!line.newPart ? <Field label={t(lang, "po.itemLabel")}><TSelect value={line.itemId} onChange={e => {
        const it = inventoryItems.find(x => x.id === e.target.value);
        updateLine(idx, { itemId: e.target.value, desc: it ? it.name : "", unitPrice: it ? (resolvePrice ? resolvePrice(it) : it.sell) : 0 });
      }} style={{ minWidth: 220 }}>
        <option value="">{t(lang, "lq.selectFromInventory")}</option>
        {inventoryItems.map(it => <option key={it.id} value={it.id}>{it.name} ({it.id}) — {it.qty} in stock</option>)}
      </TSelect></Field>
        : <Field label={t(lang, "lq.descriptionNotInInventory")}><TInput value={line.desc} onChange={e => updateLine(idx, { desc: e.target.value })} placeholder={t(lang, "lq.describeItemPlaceholder")} style={{ minWidth: 220 }} /></Field>}
      <Field label={t(lang, "po.qty")}><TInput type="number" min="1" value={line.qty} onChange={e => updateLine(idx, { qty: e.target.value })} style={{ width: 80 }} /></Field>
      <Field label={t(lang, "lq.unitPrice")}><TInput type="number" min="0" step="0.01" value={line.unitPrice} onChange={e => updateLine(idx, { unitPrice: e.target.value })} style={{ width: 130 }} /></Field>
      <div style={{ fontSize: 12, color: "var(--text-tertiary)", minWidth: 100 }}>{fmtGHS((Number(line.qty) || 0) * (Number(line.unitPrice) || 0))}</div>
      {line.newPart && <Badge color="var(--caution)" soft="var(--caution-soft)">{t(lang, "lq.toBeSourced")}</Badge>}
      <button type="button" className="mis-btn-danger" onClick={() => removeLine(idx)}><Trash2 size={12} /></button>
    </div>)}
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={addInventoryLine}><Plus size={14} /> {t(lang, "lq.addFromInventory")}</button>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={addCustomLine}><Plus size={14} /> {t(lang, "lq.addItemNotInInventory")}</button>
    </div>
    <div style={{ textAlign: "right", fontSize: 14, color: "var(--text-primary)" }}>{t(lang, "lq.totalLabel")} <b className="mis-mono">{fmtGHS(total)}</b></div>
  </div>;
}

// customers is a live mirror of the real `customers` table everywhere else
// in the app (see reloadCustomers) — this used to append a client-only,
// never-persisted row here instead, which then vanished the moment
// anything reloaded customers, and could hand a fake id into
// create_quotation's real p_customer_id (a FK violation server-side).
// Inserts for real now, same as CreateCustomerModal.
async function resolveOrCreateCustomer({ isNew, newFields, customerId, customers, reloadCustomers, logAction, currentUser }) {
  if (!isNew) return customers.find(c => c.id === customerId) || null;
  if (!newFields.name.trim()) return null;
  const { data, error } = await window.sb.from("customers")
    .insert({ name: newFields.name.trim(), tier: "Standard", is_walk_in: true })
    .select()
    .single();
  if (error) throw error;
  await reloadCustomers();
  logAction(currentUser, `Created walk-in customer record for ${data.name}`, "Customers");
  // country is free-text here (no country picker in this quick-add flow,
  // unlike CreateCustomerModal) so it isn't a real country_code — the
  // customer row is inserted without one; create_quotation already
  // defaults currency/tax sensibly when country_code is null.
  return { id: data.id, name: data.name, country: newFields.country.trim() || "—", countryCode: null, tier: "Standard", creditLimit: 0, outstanding: 0, taxExempt: false, contacts: [] };
}

function CreateQuotationModal({ type, customers, inventoryItems, taxProfiles, reloadSales, currentUser, logAction, pushNotification, onClose, onCreated, defaultCustomerId, defaultLines, lang }) {
  const [customerId, setCustomerId] = useState(defaultCustomerId || "");
  const [lines, setLines] = useState(defaultLines && defaultLines.length ? defaultLines : [{ itemId: "", desc: "", qty: 1, unitPrice: 0, newPart: false }]);
  const [leadTimeDays, setLeadTimeDays] = useState(7);
  const [eta, setEta] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const existingCustomer = customers.find(c => c.id === customerId);
  const typeLabel = type === "equipment" ? "equipment" : "parts";
  const subtotal = lines.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.unitPrice) || 0), 0);
  // Preview only — the real tax rate/currency are looked up server-side
  // from the customer's own country when the quotation is actually
  // created, exactly like this, so a client that lied about the rate
  // couldn't change what gets charged.
  const previewTaxExempt = existingCustomer ? existingCustomer.taxExempt : false;
  const previewTaxRate = (!existingCustomer || previewTaxExempt) ? 0 : (() => {
    const tp = taxProfiles.find(x => x.country_code === existingCustomer.countryCode);
    return tp ? Number(tp.rate_pct) : 0;
  })();
  const previewTax = Math.round(subtotal * previewTaxRate) / 100;

  async function submit(e) {
    e.preventDefault();
    if (busy) return;
    const validLines = lines.filter(l => (l.itemId || l.desc) && Number(l.qty) > 0);
    if (!customerId || !validLines.length) return;
    setBusy(true);
    setError("");
    try {
      const { data: newId, error: rpcError } = await window.sb.rpc("create_quotation", {
        p_customer_id: customerId,
        p_type: type,
        p_lines: validLines.map(l => ({
          item_id: l.itemId || null,
          description: l.desc || ((inventoryItems.find(i => i.id === l.itemId) || {}).name || ""),
          qty: Number(l.qty), unit_price: Number(l.unitPrice) || 0
        })),
        p_lead_time_days: Number(leadTimeDays) || null,
        p_eta: eta || null
      });
      if (rpcError) throw rpcError;
      const fresh = await reloadSales();
      logAction(currentUser, `Created ${typeLabel} quotation for ${existingCustomer.name}`, "Sales");
      pushNotification("quote", `New quotation created for ${existingCustomer.name}`);
      onClose();
      const created = fresh.quotations.find(q => q.realId === newId);
      onCreated && created && onCreated(created);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  }

  const typeLabelTranslated = type === "equipment" ? t(lang, "cq.typeEquipment") : t(lang, "cq.typeParts");
  return <Modal title={tf(lang, "cq.createQuotationTitle", { type: typeLabelTranslated })} wide onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>{t(lang, "common.cancel")}</button>
    <button type="button" disabled={busy} className="mis-btn-primary mis-focus" onClick={submit}><Plus size={14} /> {busy ? t(lang, "login.loading") : t(lang, "cq.createQuotationBtn")}</button>
  </React.Fragment>}>
    <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {error && <p style={{ fontSize: 12, color: "var(--vital)" }}>{error}</p>}
      <div className="mis-grid-2">
        <Field label={t(lang, "cq.customerLabel")}><TSelect required value={customerId} onChange={e => setCustomerId(e.target.value)}>
          <option value="">{t(lang, "cq.selectCustomer")}</option>
          {customers.map(c => <option key={c.id} value={c.id}>{c.name} — {c.country}</option>)}
        </TSelect></Field>
        {existingCustomer && <div className="mis-panel-alt" style={{ borderRadius: 2, padding: 10, fontSize: 12, color: "var(--text-secondary)" }}>
          <div>{existingCustomer.contactPerson} · {existingCustomer.email}</div>
          <div>{existingCustomer.phone}</div>
          <div>{existingCustomer.address}</div>
          {existingCustomer.taxExempt && <Badge color="var(--safe)" soft="var(--safe-soft)">{t(lang, "cq.taxExemptBadge")}</Badge>}
        </div>}
      </div>
      <LineItemsEditor lines={lines} setLines={setLines} inventoryItems={inventoryItems} lang={lang} />
      <div className="mis-grid-3">
        <Field label={t(lang, "cq.leadTimeDays")}><TInput type="number" min="0" value={leadTimeDays} onChange={e => setLeadTimeDays(e.target.value)} /></Field>
        <Field label={t(lang, "cq.eta")}><TInput type="date" value={eta} onChange={e => setEta(e.target.value)} /></Field>
        <Field label={t(lang, "cq.preparedBy")}><TInput value={currentUser} disabled /></Field>
      </div>
      <div className="mis-panel-alt" style={{ borderRadius: 2, padding: 12, display: "flex", flexDirection: "column", gap: 8 }}>
        <div className="mis-kv"><span>{t(lang, "cq.subtotal")}</span><b>{fmtGHS(subtotal)}</b></div>
        <div className="mis-kv"><span>{t(lang, "cq.taxLabel")} ({previewTaxRate}%){previewTaxExempt ? t(lang, "cq.taxWaivedSuffix") : ""}</span><b>{fmtGHS(previewTax)}</b></div>
        <div className="mis-kv" style={{ fontSize: 13 }}><span>{t(lang, "cq.total")}</span><b>{fmtGHS(subtotal + previewTax)}</b></div>
        {!existingCustomer && <p style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{t(lang, "cq.selectCustomer")} — {t(lang, "cq.taxLabel").toLowerCase()}/currency are set from the customer's country.</p>}
      </div>
      <p style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{t(lang, "cq.notListedHint")}</p>
    </form>
  </Modal>;
}

function printDocument(doc, customer, kind, lang) {
  const w = window.open("", "_blank", "width=800,height=900");
  if (!w) { window.alert("Please allow pop-ups to print or export this document."); return; }
  const total = doc.lines.reduce((s, l) => s + l.qty * l.unitPrice, 0);
  const kindLabel = kind === "invoice" ? t(lang, "doc.invoice") : t(lang, "doc.quotation");
  const rowsHtml = doc.lines.map(l => `<tr><td>${l.desc}${l.newPart ? ` (${t(lang, "doc.toBeSourced")})` : ""}</td><td>${l.qty}</td><td>${fmtGHS(l.unitPrice)}</td><td>${fmtGHS(l.qty * l.unitPrice)}</td></tr>`).join("");
  w.document.write(`<html><head><title>${doc.id}</title><style>
    body{font-family:Arial,sans-serif;padding:32px;color:#1a1c1e;}
    h1{font-size:20px;margin-bottom:4px;}
    table{width:100%;border-collapse:collapse;margin-top:16px;}
    th,td{border:1px solid #ccc;padding:8px;font-size:13px;text-align:left;}
    .tot{text-align:right;font-weight:bold;margin-top:12px;}
    .muted{color:#666;font-size:12px;}
  </style></head><body>
    <h1>SETVACO Holding Limited</h1>
    <div class="muted">${kindLabel} ${doc.id} · ${doc.date}</div>
    <hr/>
    <p><b>${customer ? customer.name : ""}</b><br/>${customer ? customer.address : ""}<br/>${customer ? customer.email : ""} · ${customer ? customer.phone : ""}</p>
    <table><thead><tr><th>${t(lang, "doc.description")}</th><th>${t(lang, "doc.qty")}</th><th>${t(lang, "doc.unitPrice")}</th><th>${t(lang, "doc.lineTotal")}</th></tr></thead><tbody>${rowsHtml}</tbody></table>
    <div class="tot">${t(lang, "doc.total")}: ${fmtGHS(total)}</div>
    ${doc.notes ? `<p class="muted">${doc.notes}</p>` : ""}
  </body></html>`);
  w.document.close();
  w.focus();
  w.print();
}

function SendDocumentModal({ doc, kind, customer, users, currentUser, logAction, emailTemplates, onClose, onSent, lang }) {
  const officials = users.filter(u => ["director", "admin", "finance"].includes(u.role)).map(u => u.email);
  const [ccSelected, setCcSelected] = useState(officials);
  const total = doc.lines.reduce((s, l) => s + l.qty * l.unitPrice, 0);
  const kindLabel = kind === "invoice" ? t(lang, "doc.invoice") : t(lang, "doc.quotation");
  const tpl = (emailTemplates && emailTemplates[kind]) || initialEmailTemplates[kind] || initialEmailTemplates.quotation;
  const vars = {
    customer: customer ? customer.contactPerson : t(lang, "email.customer"),
    orderId: doc.id,
    total: fmtGHS(total),
    lines: doc.lines.map(l => `- ${l.desc} x${l.qty} @ ${fmtGHS(l.unitPrice)}`).join("\n"),
    sender: currentUser
  };
  const subject = fillEmailTemplate(tpl.subject, vars);
  const body = fillEmailTemplate(tpl.body, vars);
  const cc = ccSelected.join(",");
  const href = customer ? buildMailto(customer.email, cc, subject, body) : undefined;
  function toggle(email) { setCcSelected(s => s.includes(email) ? s.filter(x => x !== email) : [...s, email]); }
  function handleSend() {
    logAction(currentUser, `Sent ${doc.id} to ${customer ? customer.email : "customer"} (cc: ${cc || "none"})`, "Communications");
    onSent && onSent();
  }
  return <Modal title={`${t(lang, "email.send")} ${kindLabel.toLowerCase()} ${t(lang, "email.toCustomer")}`} onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>{t(lang, "email.close")}</button>
    {customer ? <a className="mis-btn-primary mis-focus" href={href} onClick={handleSend}><Mail size={14} /> {t(lang, "email.openEmailClient")}</a>
      : <button type="button" className="mis-btn-primary mis-focus" disabled><Mail size={14} /> {t(lang, "email.noEmailOnFile")}</button>}
  </React.Fragment>}>
    <div className="mis-kv"><span>{t(lang, "email.to")}</span><b>{customer ? `${customer.name} <${customer.email}>` : "—"}</b></div>
    <Field label={t(lang, "email.ccOfficials")}>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {users.map(u => <label key={u.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
          <input type="checkbox" checked={ccSelected.includes(u.email)} onChange={() => toggle(u.email)} /> {u.name} <span style={{ color: "var(--text-tertiary)" }}>({t(lang, "role." + u.role)})</span>
        </label>)}
      </div>
    </Field>
    <Field label={t(lang, "email.subject")}><TInput value={subject} readOnly /></Field>
    <Field label={t(lang, "email.messagePreview")}><TArea value={body} readOnly rows={8} /></Field>
    <p style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{t(lang, "email.hint")}</p>
  </Modal>;
}

function DocumentsTable({ docs, customers, kind, onSend, onConvert, onPrint, onDetails, onMarkPaid, busyDocId, lang }) {
  function custName(id) { const c = customers.find(x => x.id === id); return c ? c.name : "—"; }
  function total(doc) { return typeof doc.total === "number" ? doc.total : doc.lines.reduce((s, l) => s + l.qty * l.unitPrice, 0); }
  return <DataTable
    columns={[
      { header: kind === "invoice" ? t(lang, "doc.invoice") : t(lang, "doc.quotation"), render: d => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{d.id}</span> },
      { header: t(lang, "cust.customerCol"), render: d => <span style={{ color: "var(--text-primary)" }}>{custName(d.customerId)}</span> },
      { header: t(lang, "po.lines"), render: d => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{tf(lang, "dt.itemsCount", { n: d.lines.length })}{d.lines.some(l => l.newPart) ? t(lang, "dt.inclToSource") : ""}</span> },
      { header: t(lang, "doc.total"), render: d => <span className="mis-mono">{fmtGHS(total(d))}</span> },
      { header: t(lang, "cq.preparedBy"), render: d => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{d.preparedBy || "—"}</span> },
      { header: t(lang, "cq.eta"), render: d => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{d.eta || "—"}</span> },
      { header: t(lang, "common.status"), render: d => { const cs = statusColor(d.status); return <Badge color={cs[0]} soft={cs[1]}>{d.status}</Badge>; } },
      { header: t(lang, "common.actions"), render: d => <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        {onDetails && <button type="button" className="mis-link-btn" onClick={() => onDetails(d)}>{t(lang, "dt.details")}</button>}
        <button type="button" className="mis-link-btn" onClick={() => onPrint(d)}>{t(lang, "dt.print")}</button>
        {d.status !== "Pending Approval" && d.status !== "Rejected" && <button type="button" className="mis-link-btn" onClick={() => onSend(d)}>{t(lang, "dt.send")}</button>}
        {kind === "quotation" && d.status !== "Invoiced" && d.status !== "Pending Approval" && d.status !== "Rejected" && <button type="button" disabled={!!busyDocId} className="mis-link-btn" onClick={() => onConvert(d)}>{t(lang, "dt.convertToInvoice")}</button>}
        {kind === "invoice" && d.status === "Issued" && onMarkPaid && <button type="button" disabled={!!busyDocId} className="mis-link-btn" onClick={() => onMarkPaid(d)}>{t(lang, "dt.markPaid")}</button>}
      </div> }
    ]}
    rows={docs}
    rowKey={d => d.id}
    empty={kind === "invoice" ? t(lang, "dt.noInvoicesYet") : t(lang, "salesov.noQuotationsYet")}
  />;
}

function ServiceJobsTab({ serviceJobs, setServiceJobs, customers, setCustomers, reloadCustomers, items, quotations, setQuotations, approvalSettings, priceBooks, priceBookEntries, users, assets, role, currentUser, logAction, pushNotification, emailTemplates, lang }) {
  const canManage = ["director", "admin", "service"].includes(role);
  const [form, setForm] = useState({ customerId: "", jobType: "", country: "", description: "", eta: "", preparedBy: currentUser, assetId: "" });
  const [isNewCustomer, setIsNewCustomer] = useState(false);
  const [newCustomerFields, setNewCustomerFields] = useState({ name: "", country: "" });
  const [managerDraft, setManagerDraft] = useState({});
  const [detailJob, setDetailJob] = useState(null);
  const [feedbackDraft, setFeedbackDraft] = useState({});
  const [showCreate, setShowCreate] = useState(null);
  const [sendDoc, setSendDoc] = useState(null);
  const [submitBusy, setSubmitBusy] = useState(false);
  const [submitError, setSubmitError] = useState("");

  async function submit(e) {
    e.preventDefault();
    if (!form.jobType || submitBusy) return;
    setSubmitBusy(true);
    setSubmitError("");
    try {
      const customer = await resolveOrCreateCustomer({ isNew: isNewCustomer, newFields: newCustomerFields, customerId: form.customerId, customers, reloadCustomers, logAction, currentUser });
      if (!customer) return;
      const jobNumber = uid("SJ", serviceJobs, 3);
      const job = { id: jobNumber, jobNumber, customer: customer.name, customerId: customer.id, type: form.jobType, country: form.country || customer.country, description: form.description, technician: "Unassigned", itemId: "", itemName: "", qty: 0, eta: form.eta, preparedBy: form.preparedBy || currentUser, feedbackLog: [], status: "Open", date: todayISO(), assetId: form.assetId || "" };
      setServiceJobs(js => [job, ...js]);
      logAction(currentUser, `Logged service job ${job.id} (${job.type}) for ${customer.name}`, "Service");
      setForm({ customerId: "", jobType: "", country: "", description: "", eta: "", preparedBy: currentUser, assetId: "" });
      setIsNewCustomer(false);
      setNewCustomerFields({ name: "", country: "" });
    } catch (err) {
      setSubmitError(err.message);
    } finally {
      setSubmitBusy(false);
    }
  }
  function complete(id) {
    setServiceJobs(js => js.map(j => j.id === id ? { ...j, status: "Completed" } : j));
    logAction(currentUser, `Completed service job ${id}`, "Service");
  }
  function openQuoteFor(job) {
    setShowCreate({ defaultCustomerId: job.customerId, defaultLines: [{ itemId: "", desc: `${job.type} — ${job.description || "service job"}`, qty: 1, unitPrice: 0, newPart: true }] });
  }

  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    {canManage && <form onSubmit={submit} className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
      <div className="mis-grid-2">
        <CustomerPickerField customerId={form.customerId} setCustomerId={id => setForm(f => ({ ...f, customerId: id }))} isNew={isNewCustomer} setIsNew={setIsNewCustomer} newFields={newCustomerFields} setNewFields={setNewCustomerFields} customers={customers} lang={lang} />
        <Field label={t(lang, "sj.jobType")}><TInput required value={form.jobType} onChange={e => setForm(f => ({ ...f, jobType: e.target.value }))} placeholder={t(lang, "sj.jobTypePlaceholder")} /></Field>
      </div>
      <div className="mis-grid-3">
        <Field label={t(lang, "common.country")}><TInput value={form.country} onChange={e => setForm(f => ({ ...f, country: e.target.value }))} placeholder={t(lang, "sj.countryPlaceholder")} /></Field>
        <Field label={t(lang, "cq.eta")}><TInput type="date" value={form.eta} onChange={e => setForm(f => ({ ...f, eta: e.target.value }))} /></Field>
        <Field label={t(lang, "cq.preparedBy")}><TInput value={form.preparedBy} onChange={e => setForm(f => ({ ...f, preparedBy: e.target.value }))} placeholder={currentUser} /></Field>
      </div>
      <Field label={t(lang, "sj.description")}><TArea value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} placeholder={t(lang, "sj.scopeOfWork")} /></Field>
      {!isNewCustomer && form.customerId && assets.some(a => a.customerId === form.customerId) && <Field label={t(lang, "sj.relatedAssetOptional")}>
        <TSelect value={form.assetId} onChange={e => setForm(f => ({ ...f, assetId: e.target.value }))}>
          <option value="">{t(lang, "sj.noAssetSelected")}</option>
          {assets.filter(a => a.customerId === form.customerId).map(a => <option key={a.id} value={a.id}>{a.itemName} — {a.serialNumber}</option>)}
        </TSelect>
      </Field>}
      {submitError && <p style={{ fontSize: 12, color: "var(--vital)" }}>{submitError}</p>}
      <button type="submit" disabled={submitBusy} className="mis-btn-primary mis-focus" style={{ alignSelf: "flex-start" }}><Plus size={14} /> {submitBusy ? t(lang, "login.loading") : t(lang, "sj.logServiceJobBtn")}</button>
    </form>}
    <DataTable
      columns={[
        { header: t(lang, "sj.jobNumberCol"), render: j => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{j.jobNumber}</span> },
        { header: t(lang, "cust.customerCol"), render: j => <span style={{ color: "var(--text-primary)" }}>{j.customer}</span> },
        { header: t(lang, "sj.jobTypeCol"), render: j => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{j.type}</span> },
        { header: t(lang, "common.country"), render: j => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{j.country}</span> },
        { header: t(lang, "common.status"), render: j => { const cs = statusColor(j.status); return <Badge color={cs[0]} soft={cs[1]}>{j.status}</Badge>; } },
        { header: t(lang, "cq.preparedBy"), render: j => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{j.preparedBy || "—"}</span> },
        { header: t(lang, "cq.eta"), render: j => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{j.eta || "—"}</span> },
        { header: "", render: j => <button type="button" className="mis-link-btn" onClick={() => setDetailJob(j)}>{t(lang, "dt.details")}</button> }
      ]}
      rows={serviceJobs}
      rowKey={j => j.id}
      empty={t(lang, "sj.noServiceJobsYet")}
    />
    {detailJob && <JobDetailDrawer job={detailJob} customer={customers.find(c => c.id === detailJob.customerId)} assets={assets} role={role} currentUser={currentUser} logAction={logAction} setServiceJobs={setServiceJobs} feedbackDraft={feedbackDraft} setFeedbackDraft={setFeedbackDraft} managerDraft={managerDraft} setManagerDraft={setManagerDraft} onComplete={complete} onCreateQuote={openQuoteFor} onClose={() => setDetailJob(null)} lang={lang} />}
    {showCreate && <CreateQuotationModal
      type="part"
      customers={customers} setCustomers={setCustomers}
      inventoryItems={items.filter(i => i.type === "part")}
      quotations={quotations} setQuotations={setQuotations}
      currentUser={currentUser} logAction={logAction} pushNotification={pushNotification}
      approvalSettings={approvalSettings} priceBooks={priceBooks} priceBookEntries={priceBookEntries}
      onClose={() => setShowCreate(null)}
      defaultCustomerId={showCreate.defaultCustomerId}
      defaultLines={showCreate.defaultLines}
      onCreated={q => setSendDoc({ doc: q, kind: "quotation" })}
      lang={lang}
    />}
    {sendDoc && <SendDocumentModal doc={sendDoc.doc} kind={sendDoc.kind} customer={customers.find(c => c.id === sendDoc.doc.customerId)} users={users} currentUser={currentUser} logAction={logAction} emailTemplates={emailTemplates} onClose={() => setSendDoc(null)} lang={lang} onSent={() => {
      setQuotations(qs => qs.map(x => x.id === sendDoc.doc.id && x.status === "Quoted" ? { ...x, status: "Sent" } : x));
      setSendDoc(null);
    }} />}
  </div>;
}

function BackOrderReport({ quotations, invoices, items, purchaseOrders, role, typeFilter, lang }) {
  const canSeeSupplyChain = ["director", "admin", "procurement", "warehouse"].includes(role);
  const rows = [];
  [...quotations, ...invoices].forEach(d => {
    if (typeFilter !== "all" && d.type !== typeFilter) return;
    d.lines.forEach(l => {
      if (!l.itemId) return;
      const item = items.find(i => i.id === l.itemId);
      if (!item || item.qty >= l.qty) return;
      const relatedPOs = purchaseOrders.filter(po => po.lines.some(pl => pl.itemId === l.itemId) && po.status !== "Received");
      rows.push({ key: d.id + l.itemId, docId: d.id, itemName: item.name, needed: l.qty, onHand: item.qty, shortfall: l.qty - item.qty, pos: relatedPOs });
    });
  });
  const columns = [
    { header: t(lang, "bo.order"), render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{r.docId}</span> },
    { header: t(lang, "bo.item"), render: r => <span>{r.itemName}</span> },
    { header: t(lang, "bo.needed"), render: r => <span className="mis-mono">{r.needed}</span> },
    { header: t(lang, "bo.onHand"), render: r => <span className="mis-mono" style={{ color: "var(--vital)" }}>{r.onHand}</span> },
    { header: t(lang, "bo.shortfall"), render: r => <span className="mis-mono" style={{ color: "var(--vital)" }}>{r.shortfall}</span> }
  ];
  if (canSeeSupplyChain) columns.push({ header: t(lang, "bo.supplyStatus"), render: r => r.pos.length
    ? r.pos.map(po => { const cs = statusColor(po.status); return <div key={po.id} style={{ fontSize: 11, marginBottom: 2 }}><Badge color={cs[0]} soft={cs[1]}>{po.status}</Badge> {po.id}{po.expected ? ` · ${t(lang, "bo.eta")} ${po.expected}` : ""}</div>; })
    : <span style={{ fontSize: 12, color: "var(--vital)" }}>{t(lang, "bo.notYetOrdered")}</span> });
  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{t(lang, "bo.description")}{!canSeeSupplyChain ? t(lang, "bo.descriptionLimited") : ""}</p>
    <DataTable columns={columns} rows={rows} rowKey={r => r.key} empty={t(lang, "bo.empty")} />
  </div>;
}

function SalesOverview({ quotations, invoices, serviceJobs, customers, items, purchaseOrders, role, lang }) {
  const [overviewFilter, setOverviewFilter] = useState("all");
  const openPartQuotes = quotations.filter(q => q.type === "part" && q.status !== "Invoiced" && q.status !== "Rejected").length;
  const openEquipQuotes = quotations.filter(q => q.type === "equipment" && q.status !== "Invoiced" && q.status !== "Rejected").length;
  const activeJobs = serviceJobs.filter(j => j.status !== "Completed").length;
  const backOrderLines = [...quotations, ...invoices].reduce((n, d) => n + d.lines.filter(l => { if (!l.itemId) return true; const it = items.find(i => i.id === l.itemId); return it && it.qty < l.qty; }).length, 0);
  const recent = quotations.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
  function custName(id) { const c = customers.find(x => x.id === id); return c ? c.name : "—"; }
  const showStats = ["all", "parts", "equipment", "service"].includes(overviewFilter);
  const showForecast = ["all", "parts", "equipment"].includes(overviewFilter);
  const forecastPool = quotations.filter(q => q.status !== "Rejected");
  const forecastValue = forecastPool.reduce((sum, q) => sum + (q.total ?? q.subtotal ?? 0) * (FORECAST_WEIGHTS[q.status] ?? 0), 0);
  function stageValue(status) { return forecastPool.filter(q => q.status === status).reduce((s, q) => s + (q.total ?? q.subtotal ?? 0), 0); }
  return <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{t(lang, "salesov.show")}</span>
      <TSelect value={overviewFilter} onChange={e => setOverviewFilter(e.target.value)} style={{ width: 200 }}>
        <option value="all">{t(lang, "salesov.everything")}</option>
        <option value="parts">{t(lang, "salesov.partsOnly")}</option>
        <option value="equipment">{t(lang, "salesov.equipmentOnly")}</option>
        <option value="service">{t(lang, "salesov.serviceOnly")}</option>
        <option value="backorder">{t(lang, "salesov.backordersOnly")}</option>
      </TSelect>
    </div>
    {showForecast && <div className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", alignItems: "center", gap: 28, flexWrap: "wrap" }}>
      <div>
        <div className="mis-eyebrow">{t(lang, "salesov.forecastValue")}</div>
        <div className="mis-display" style={{ fontSize: 30, color: "var(--ink)" }}>{fmtGHS(forecastValue)}</div>
        <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 4 }}>{t(lang, "salesov.forecastHint")}</div>
      </div>
      <div style={{ display: "flex", gap: 16, fontSize: 12, color: "var(--text-secondary)", flexWrap: "wrap" }}>
        <div><span style={{ color: "var(--caution)" }}>●</span> {t(lang, "salesov.forecastPending")}: {fmtGHS(stageValue("Pending Approval"))}</div>
        <div><span style={{ color: "var(--info)" }}>●</span> {t(lang, "salesov.forecastQuoted")}: {fmtGHS(stageValue("Quoted"))}</div>
        <div><span style={{ color: "var(--ore)" }}>●</span> {t(lang, "salesov.forecastSent")}: {fmtGHS(stageValue("Sent"))}</div>
        <div><span style={{ color: "var(--safe)" }}>●</span> {t(lang, "salesov.forecastInvoiced")}: {fmtGHS(stageValue("Invoiced"))}</div>
      </div>
    </div>}
    {showStats && <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16 }}>
      {(overviewFilter === "all" || overviewFilter === "parts") && <StatCard label={t(lang, "salesov.openPartQuotes")} value={openPartQuotes} sub={t(lang, "salesov.awaitingConfirmation")} icon={ShoppingCart} tint="var(--caution)" soft="var(--caution-soft)" />}
      {(overviewFilter === "all" || overviewFilter === "equipment") && <StatCard label={t(lang, "salesov.openEquipmentQuotes")} value={openEquipQuotes} sub={t(lang, "salesov.awaitingConfirmation")} icon={Truck} tint="var(--info)" soft="var(--info-soft)" />}
      {(overviewFilter === "all" || overviewFilter === "service") && <StatCard label={t(lang, "salesov.activeServiceJobs")} value={activeJobs} sub={t(lang, "salesov.inProgress")} icon={Wrench} tint="var(--ore)" soft="var(--ore-soft)" />}
      {overviewFilter === "all" && <StatCard label={t(lang, "salesov.backOrderedLines")} value={backOrderLines} sub={t(lang, "salesov.qtyExceedsStock")} icon={AlertTriangle} tint="var(--vital)" soft="var(--vital-soft)" />}
    </div>}
    {(overviewFilter === "all" || overviewFilter === "backorder") && <BackOrderReport quotations={quotations} invoices={invoices} items={items} purchaseOrders={purchaseOrders} role={role} typeFilter="all" lang={lang} />}
    {overviewFilter === "all" && <div className="mis-panel" style={{ borderRadius: 2, padding: 16 }}>
      <h3 className="mis-eyebrow" style={{ marginBottom: 14 }}>{t(lang, "salesov.recentQuotations")}</h3>
      {recent.length === 0 && <div className="mis-empty">{t(lang, "salesov.noQuotationsYet")}</div>}
      {recent.map(q => { const cs = statusColor(q.status); return <div key={q.id} className="mis-row" style={{ display: "flex", justifyContent: "space-between", padding: "8px 4px", borderBottom: "1px solid var(--border-soft)" }}>
        <span style={{ fontSize: 13 }}>{q.id} · {custName(q.customerId)} <span style={{ color: "var(--text-tertiary)" }}>({q.type})</span></span>
        <Badge color={cs[0]} soft={cs[1]}>{q.status}</Badge>
      </div>; })}
    </div>}
  </div>;
}
// Two-stage approval: stage 1 (manager/finance) clears routine holds; stage 2
// (director/admin only) is reached automatically when a stage-1 approval is
// given on a quotation whose total is above approvalSettings.directorThreshold.
function approveOrder(setter, doc, currentUser, logAction, approvalSettings) {
  const stage = doc.approvalStage || 1;
  const total = doc.total ?? doc.subtotal ?? 0;
  const escalate = stage === 1 && total > approvalSettings.directorThreshold;
  setter(list => list.map(x => x.id === doc.id ? (escalate ? { ...x, approvalStage: 2 } : { ...x, status: "Quoted", approvalStage: 0 }) : x));
  logAction(currentUser, escalate ? `${doc.id} cleared manager review — escalated to director for final sign-off` : `${doc.id} approved by ${currentUser}`, "Sales");
}
function rejectOrder(setter, id, currentUser, logAction) {
  setter(list => list.map(x => x.id === id ? { ...x, status: "Rejected", approvalStage: 0 } : x));
  logAction(currentUser, `${id} rejected by ${currentUser}`, "Sales");
}
function appendFeedback(setter, id, note, currentUser, logAction) {
  if (!note || !note.trim()) return;
  setter(list => list.map(x => x.id === id ? { ...x, feedbackLog: [...(x.feedbackLog || []), { date: todayISO(), note: note.trim(), by: currentUser }] } : x));
  logAction(currentUser, `Logged feedback on ${id}`, "Sales");
}
function appendManagerNote(setter, id, note, currentUser, logAction) {
  if (!note || !note.trim()) return;
  setter(list => list.map(x => x.id === id ? { ...x, managerNotes: [...(x.managerNotes || []), { date: todayISO(), note: note.trim(), by: currentUser }] } : x));
  logAction(currentUser, `Added manager comment on ${id}`, "Sales");
}
function ManagerCommentsPanel({ record, role, currentUser, logAction, setter, draft, setDraft, lang }) {
  const notes = record.managerNotes || [];
  const canView = ["director", "admin", "finance"].includes(role) || notes.length > 0;
  const canComment = ["director", "admin", "finance"].includes(role);
  if (!canView) return null;
  const text = draft[record.id] || "";
  return <React.Fragment>
    <div className="mis-divider" />
    <div style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "12px 0 8px", textTransform: "uppercase" }}>{t(lang, "sj.managerComments")}</div>
    {notes.length === 0 && <div className="mis-empty">{t(lang, "sj.noManagerCommentsYet")}</div>}
    {notes.map((f, i) => <div key={i} style={{ padding: "8px 0", borderBottom: "1px solid var(--border-soft)" }}>
      <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{f.note}</div>
      <div style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{f.by} · {f.date}</div>
    </div>)}
    {canComment && <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
      <TInput value={text} onChange={e => setDraft(d => ({ ...d, [record.id]: e.target.value }))} placeholder={t(lang, "sj.commentPlaceholder")} />
      <button type="button" className="mis-btn-ghost mis-focus" onClick={() => { appendManagerNote(setter, record.id, text, currentUser, logAction); setDraft(d => ({ ...d, [record.id]: "" })); }}>{t(lang, "sj.commentBtn")}</button>
    </div>}
  </React.Fragment>;
}
function QuotationDetailDrawer({ doc, customer, role, currentUser, logAction, setQuotations, approvalSettings, feedbackDraft, setFeedbackDraft, managerDraft, setManagerDraft, onClose, lang }) {
  const stage = doc.approvalStage || 1;
  const total = doc.total ?? doc.subtotal ?? 0;
  const isTwoStage = doc.status === "Pending Approval" && total > approvalSettings.directorThreshold;
  const canApprove = doc.status === "Pending Approval" && (stage === 2 ? ["director", "admin"].includes(role) : ["director", "admin", "finance"].includes(role));
  const draft = feedbackDraft[doc.id] || "";
  return <Drawer title={tf(lang, "common.detailsTitle", { id: doc.id })} onClose={onClose}>
    {QUOTE_FLOW_STAGES.includes(doc.status) && <div style={{ marginBottom: 16 }}><PathStepper stages={QUOTE_FLOW_STAGES} current={doc.status} /></div>}
    {isTwoStage && <div style={{ marginBottom: 16 }}><PathStepper stages={APPROVAL_STAGES} current={APPROVAL_STAGES[stage - 1]} /></div>}
    <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 14 }}>
      <div className="mis-kv"><span>{t(lang, "cust.customerCol")}</span><b>{customer ? customer.name : "—"}</b></div>
      <div className="mis-kv"><span>{t(lang, "sj.customerId")}</span><b className="mis-mono">{doc.customerId}</b></div>
      <div className="mis-kv"><span>{t(lang, "qd.location")}</span><b>{doc.country || (customer && customer.country) || "—"}</b></div>
      <div className="mis-kv"><span>{t(lang, "qd.leadTime")}</span><b>{doc.leadTimeDays != null ? tf(lang, "qd.days", { n: doc.leadTimeDays }) : "—"}</b></div>
      <div className="mis-kv"><span>{t(lang, "cq.eta")}</span><b>{doc.eta || "—"}</b></div>
      <div className="mis-kv"><span>{t(lang, "cq.preparedBy")}</span><b>{doc.preparedBy || "—"}</b></div>
      <div className="mis-divider" />
      <div className="mis-kv"><span>{t(lang, "cq.subtotal")}</span><b>{fmtGHS(doc.subtotal ?? doc.lines.reduce((s, l) => s + l.qty * l.unitPrice, 0))}</b></div>
      <div className="mis-kv"><span>{t(lang, "cq.taxLabel")}</span><b>{fmtGHS(doc.taxAmount || 0)}</b></div>
      <div className="mis-kv" style={{ fontSize: 13 }}><span>{t(lang, "cq.total")}</span><b>{fmtGHS(doc.total ?? doc.subtotal ?? 0)}</b></div>
    </div>
    {doc.status === "Pending Approval" && <div className="mis-panel-alt" style={{ borderRadius: 2, padding: 12, marginBottom: 14 }}>
      <div style={{ fontSize: 12, color: "var(--caution)", marginBottom: 8 }}>{t(lang, "qd.heldForApproval")}</div>
      {canApprove ? <div style={{ display: "flex", gap: 8 }}>
        <button type="button" className="mis-btn-primary mis-focus" onClick={() => { approveOrder(setQuotations, doc, currentUser, logAction, approvalSettings); onClose(); }}><Check size={14} /> {stage === 2 ? t(lang, "qd.signOffBtn") : t(lang, "qd.approveBtn")}</button>
        <button type="button" className="mis-btn-danger" onClick={() => { rejectOrder(setQuotations, doc.id, currentUser, logAction); onClose(); }}>{t(lang, "qd.rejectBtn")}</button>
      </div> : <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{stage === 2 ? t(lang, "qd.onlyDirectorAdmin") : t(lang, "qd.onlyAdminFinance")}</p>}
    </div>}
    <div className="mis-divider" />
    <div style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "12px 0 8px", textTransform: "uppercase" }}>{t(lang, "sj.clientFeedback")}</div>
    {(doc.feedbackLog || []).length === 0 && <div className="mis-empty">{t(lang, "sj.noFeedbackYet")}</div>}
    {(doc.feedbackLog || []).map((f, i) => <div key={i} style={{ padding: "8px 0", borderBottom: "1px solid var(--border-soft)" }}>
      <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{f.note}</div>

    </div>)}
    <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
      <TInput value={draft} onChange={e => setFeedbackDraft(d => ({ ...d, [doc.id]: e.target.value }))} placeholder={t(lang, "sj.logFeedbackPlaceholder")} />
      <button type="button" className="mis-btn-ghost mis-focus" onClick={() => { appendFeedback(setQuotations, doc.id, draft, currentUser, logAction); setFeedbackDraft(d => ({ ...d, [doc.id]: "" })); }}>{t(lang, "sj.logBtn")}</button>
    </div>

}

function SalesQuotations({ page, role, currentUser, customers, items, taxProfiles, reloadSales, reloadCustomers, reloadStock, quotations, setQuotations, invoices, approvalSettings, users, logAction, pushNotification, emailTemplates, lang }) {
  const type = page === "equipmentsales" ? "equipment" : "part";
  const [showCreate, setShowCreate] = useState(false);
  const [sendDoc, setSendDoc] = useState(null);
  const [detailDoc, setDetailDoc] = useState(null);
  const [showProducts, setShowProducts] = useState(false);
  const [feedbackDraft, setFeedbackDraft] = useState({});
  const [managerDraft, setManagerDraft] = useState({});
  const [busyDocId, setBusyDocId] = useState(null);
  const [actionError, setActionError] = useState("");

  function custName(id) { const c = customers.find(x => x.id === id); return c ? c.name : "—"; }

  // Both actions below call the RPCs that do the real work (stock
  // deduction via adjust_stock, customer.outstanding) — this just re-fetches
  // afterward so every affected panel (Sales, Customers, Stock Room) shows
  // the result, instead of trying to keep three copies of local state in sync.
  async function convertQuotationToInvoice(q) {
    if (busyDocId) return;
    setBusyDocId(q.realId);
    setActionError("");
    try {
      const { error } = await window.sb.rpc("convert_quotation_to_invoice", { p_quotation_id: q.realId });
      if (error) throw error;
      await Promise.all([reloadSales(), reloadCustomers(), reloadStock()]);
      logAction(currentUser, `Converted ${q.id} to an invoice for ${custName(q.customerId)} — stock updated`, "Sales");
      pushNotification("invoice", `Invoice issued to ${custName(q.customerId)}`);
    } catch (err) {
      setActionError(err.message);
    } finally {
      setBusyDocId(null);
    }
  }
  async function markInvoicePaid(inv) {
    if (busyDocId) return;
    setBusyDocId(inv.realId);
    setActionError("");
    try {
      const { error } = await window.sb.rpc("mark_invoice_paid", { p_invoice_id: inv.realId });
      if (error) throw error;
      await Promise.all([reloadSales(), reloadCustomers()]);
      logAction(currentUser, `Marked ${inv.id} as paid for ${custName(inv.customerId)}`, "Sales");
    } catch (err) {
      setActionError(err.message);
    } finally {
      setBusyDocId(null);
    }
  }

  const partsList = items.filter(i => i.type === "part");
  const equipmentList = items.filter(i => i.type === "equipment");
  const inventoryItems = type === "equipment" ? equipmentList : partsList;
  const pageQuotations = quotations.filter(q => q.type === type);
  const pageInvoices = invoices.filter(i => i.type === type);

  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    {actionError && <p style={{ fontSize: 12, color: "var(--vital)" }}>{actionError}</p>}
    <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
      {type === "equipment" && <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setShowProducts(true)}><Boxes size={14} /> {t(lang, "sq.seeProducts")}</button>}
      {["director", "admin", "sales"].includes(role) && <button type="button" className="mis-btn-primary mis-focus" style={{ marginLeft: "auto" }} onClick={() => setShowCreate(true)}><Plus size={14} /> {t(lang, "cq.createQuotationBtn")}</button>}
    </div>
    <h4 style={{ fontSize: 12, textTransform: "uppercase", color: "var(--text-tertiary)" }}>{t(lang, "sq.transactionHistory")}</h4>
    <DocumentsTable docs={pageQuotations} customers={customers} kind="quotation" onDetails={d => setDetailDoc(d)} onPrint={d => printDocument(d, customers.find(c => c.id === d.customerId), "quotation", lang)} onSend={d => setSendDoc({ doc: d, kind: "quotation" })} onConvert={convertQuotationToInvoice} busyDocId={busyDocId} lang={lang} />
    <h4 style={{ fontSize: 12, textTransform: "uppercase", color: "var(--text-tertiary)" }}>{t(lang, "sq.invoicesHeading")}</h4>
    <DocumentsTable docs={pageInvoices} customers={customers} kind="invoice" onPrint={d => printDocument(d, customers.find(c => c.id === d.customerId), "invoice", lang)} onSend={d => setSendDoc({ doc: d, kind: "invoice" })} onConvert={() => {}} onMarkPaid={["director", "admin", "finance"].includes(role) ? markInvoicePaid : undefined} busyDocId={busyDocId} lang={lang} />

    {showCreate && <CreateQuotationModal
      type={type}
      customers={customers}
      inventoryItems={inventoryItems}
      taxProfiles={taxProfiles} reloadSales={reloadSales}
      currentUser={currentUser} logAction={logAction} pushNotification={pushNotification}
      onClose={() => setShowCreate(false)}
      onCreated={q => setSendDoc({ doc: q, kind: "quotation" })}
      lang={lang}
    />}
    {sendDoc && <SendDocumentModal doc={sendDoc.doc} kind={sendDoc.kind} customer={customers.find(c => c.id === sendDoc.doc.customerId)} users={users} currentUser={currentUser} logAction={logAction} emailTemplates={emailTemplates} onClose={() => setSendDoc(null)} lang={lang} onSent={async () => {
      if (sendDoc.kind === "quotation" && sendDoc.doc.status === "Quoted") {
        // The email itself already sent by this point (SendDocumentModal
        // only calls onSent after that succeeds) — a failure here is just
        // the follow-up status bump, so it's surfaced rather than silently
        // dropped, but doesn't block closing the modal.
        const { error } = await window.sb.rpc("mark_quotation_sent", { p_quotation_id: sendDoc.doc.realId });
        if (error) {
          setActionError(`Sent, but couldn't update quotation status: ${error.message}`);
        } else {
          await reloadSales();
        }
      }
      setSendDoc(null);
    }} />}
    {detailDoc && <QuotationDetailDrawer doc={detailDoc} customer={customers.find(c => c.id === detailDoc.customerId)} role={role} currentUser={currentUser} logAction={logAction} setQuotations={setQuotations} approvalSettings={approvalSettings} feedbackDraft={feedbackDraft} setFeedbackDraft={setFeedbackDraft} managerDraft={managerDraft} setManagerDraft={setManagerDraft} onClose={() => setDetailDoc(null)} lang={lang} />}
    {showProducts && <Modal title={t(lang, "sq.equipmentProductsTitle")} wide onClose={() => setShowProducts(false)}>
      <DataTable columns={[
        { header: t(lang, "sq.product"), render: it => <span style={{ color: "var(--text-primary)" }}>{it.name}</span> },
        { header: t(lang, "inv.brand"), render: it => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{it.brand}</span> },
        { header: t(lang, "sq.category"), render: it => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{it.category}</span> },
        { header: t(lang, "common.branch"), render: it => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}><BranchTag branch={it.branch} /></span> },
        { header: t(lang, "sq.available"), render: it => <span className="mis-mono" style={{ color: it.qty <= 0 ? "var(--vital)" : "var(--text-primary)" }}>{it.qty}</span> },
        { header: t(lang, "sq.price"), render: it => <span className="mis-mono">{fmtGHS(it.sell)}</span> }
      ]} rows={equipmentList} rowKey={it => it.id} empty={t(lang, "sq.noEquipmentProductsYet")} />
    </Modal>}
  </div>;
}

function POLineItemsEditor({ lines, setLines, items, lang }) {
  function updateLine(idx, patch) { setLines(ls => ls.map((l, i) => i === idx ? { ...l, ...patch } : l)); }
  function removeLine(idx) { setLines(ls => ls.filter((_, i) => i !== idx)); }
  function addLine() { setLines(ls => [...ls, { itemId: "", itemName: "", qty: 1 }]); }
  return <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
    {lines.map((line, idx) => <div key={idx} className="mis-panel-alt" style={{ borderRadius: 2, padding: 10, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
      <Field label={t(lang, "po.itemLabel")}><TSelect value={line.itemId} onChange={e => { const it = items.find(x => x.id === e.target.value); updateLine(idx, { itemId: e.target.value, itemName: it ? it.name : "" }); }} style={{ minWidth: 220 }}>
        <option value="">{t(lang, "po.selectItem")}</option>
        {items.map(it => <option key={it.id} value={it.id}>{it.name} ({it.id})</option>)}
      </TSelect></Field>
      <Field label={t(lang, "po.qty")}><TInput type="number" min="1" value={line.qty} onChange={e => updateLine(idx, { qty: e.target.value })} style={{ width: 90 }} /></Field>
      <button type="button" className="mis-btn-danger" onClick={() => removeLine(idx)}><Trash2 size={12} /></button>
    </div>)}
    <button type="button" className="mis-btn-ghost mis-focus" style={{ alignSelf: "flex-start" }} onClick={addLine}><Plus size={14} /> {t(lang, "po.addLineItem")}</button>
  </div>;
}

function InternalPOsTab({ purchaseOrders, setPurchaseOrders, vendors, customers, items, setItems, role, currentUser, logAction, pushNotification, lang }) {
  const canManage = ["director", "admin", "procurement"].includes(role);
  const [form, setForm] = useState({ vendorId: "", expected: "", lines: [{ itemId: "", itemName: "", qty: 1 }] });
  function setFormLines(updater) { setForm(f => ({ ...f, lines: typeof updater === "function" ? updater(f.lines) : updater })); }
  function submit(e) {
    e.preventDefault();
    const vendor = vendors.find(v => v.id === form.vendorId);
    const validLines = form.lines.filter(l => l.itemId && Number(l.qty) > 0).map(l => ({ itemId: l.itemId, itemName: l.itemName, qty: Number(l.qty) }));
    if (!vendor || !validLines.length) return;
    const po = { id: uid("PO", purchaseOrders, 4), vendorId: vendor.id, lines: validLines, status: "Ordered", date: todayISO(), expected: form.expected, source: "manual" };
    setPurchaseOrders(ps => [po, ...ps]);
    logAction(currentUser, `Raised ${po.id} to ${vendor.name} for ${validLines.map(l => l.itemName).join(", ")}`, "Purchasing");
    pushNotification("po", `${po.id} raised to ${vendor.name}`);
    setForm({ vendorId: "", expected: "", lines: [{ itemId: "", itemName: "", qty: 1 }] });
  }
  function advance(po) {
    const next = po.status === "Ordered" ? "In Transit" : po.status === "In Transit" ? "Received" : po.status;
    if (next === po.status) return;
    setPurchaseOrders(ps => ps.map(p => p.id === po.id ? { ...p, status: next } : p));
    if (next === "Received") {
      setItems(its => its.map(it => { const line = po.lines.find(l => l.itemId === it.id); return line ? { ...it, qty: it.qty + line.qty } : it; }));
      logAction(currentUser, `Received ${po.id} — stock updated for ${po.lines.map(l => l.itemName).join(", ") || "matched order"}`, "Purchasing");
    } else {
      logAction(currentUser, `Marked ${po.id} as ${next}`, "Purchasing");
    }
  }
  function poParty(p) {
    if (p.vendorNameRaw) return p.vendorNameRaw;
    if (p.vendorId) { const v = vendors.find(x => x.id === p.vendorId); if (v) return v.name; }
    if (p.customerId) { const c = customers.find(x => x.id === p.customerId); if (c) return c.name + t(lang, "po.customerOrderSuffix"); }
    return t(lang, "inv.unspecifiedVendor");
  }
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    {canManage && <form onSubmit={submit} className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
      <div className="mis-grid-2">
        <Field label={t(lang, "po.vendor")}><TSelect required value={form.vendorId} onChange={e => setForm(f => ({ ...f, vendorId: e.target.value }))}>
          <option value="">{t(lang, "po.selectVendor")}</option>{vendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
        </TSelect></Field>
        <Field label={t(lang, "po.expectedDeliveryDate")}><TInput type="date" value={form.expected} onChange={e => setForm(f => ({ ...f, expected: e.target.value }))} /></Field>
      </div>
      <POLineItemsEditor lines={form.lines} setLines={setFormLines} items={items} lang={lang} />
      <button type="submit" className="mis-btn-primary mis-focus" style={{ alignSelf: "flex-start" }}><Plus size={14} /> {t(lang, "po.raisePO")}</button>
    </form>}
    <DataTable columns={[
      { header: t(lang, "po.poCol"), render: p => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{p.id}</span> },
      { header: t(lang, "po.vendorParty"), render: p => <span style={{ color: "var(--text-primary)" }}>{poParty(p)}</span> },
      { header: t(lang, "po.lines"), render: p => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{p.lines.length ? p.lines.map(l => `${l.itemName || l.itemId} x${l.qty}`).join(", ") : (p.externalPoNumber ? tf(lang, "po.externalPoPending", { code: p.externalPoNumber }) : "—")}</span> },
      { header: t(lang, "po.expected"), render: p => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{p.expected || "—"}</span> },
      { header: t(lang, "common.status"), render: p => { const cs = statusColor(p.status); return <Badge color={cs[0]} soft={cs[1]}>{p.status}</Badge>; } },
      { header: t(lang, "common.actions"), render: p => canManage && p.status !== "Received" ? <button type="button" className="mis-link-btn" onClick={() => advance(p)}>{p.status === "Ordered" ? t(lang, "po.markInTransit") : t(lang, "po.markReceived")}</button> : null }
    ]} rows={purchaseOrders} rowKey={p => p.id} empty={t(lang, "po.noPOsYet")} />
  </div>;
}

function VendorsTab({ vendors, setVendors, role, currentUser, logAction, lang }) {
  const canManage = ["director", "admin", "procurement"].includes(role);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ name: "", code: "", contact: "", email: "", phone: "", altContact: "", categories: "", taxExempt: false, certificateFile: null });
  const [preview, setPreview] = useState(null);
  function submit(e) {
    e.preventDefault();
    if (!form.name.trim()) return;
    const vendor = { id: uid("V", vendors, 2), ...form };
    setVendors(vs => [...vs, vendor]);
    logAction(currentUser, `Added vendor ${vendor.name} (code ${vendor.code || "—"})`, "Purchasing");
    setForm({ name: "", code: "", contact: "", email: "", phone: "", altContact: "", categories: "", taxExempt: false, certificateFile: null });
    setShowAdd(false);
  }
  function handleUpload(file) {
    parseExcelFile(file).then(rows => {
      const parsed = rows.map(r => ({ name: String(r.Name || r.Vendor || "").trim(), code: String(r.Code || r["Industry Code"] || "").trim(), contact: String(r.Contact || "").trim(), email: String(r.Email || "").trim(), phone: String(r.Phone || "").trim(), categories: String(r.Categories || "").trim() })).filter(v => v.name);
      setPreview({ rows: parsed, fileName: file.name });
    }).catch(err => window.alert("Could not read file: " + err.message));
  }
  function confirmUpload() {
    if (!preview) return;
    let list = vendors.slice();
    preview.rows.forEach(v => {
      const existingIdx = list.findIndex(x => v.code && x.code === v.code);
      if (existingIdx >= 0) list[existingIdx] = { ...list[existingIdx], ...v };
      else list = [...list, { id: uid("V", list, 2), ...v }];
    });
    setVendors(list);
    logAction(currentUser, `Uploaded vendor list "${preview.fileName}" (${preview.rows.length} records)`, "Purchasing");
    setPreview(null);
  }
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    {canManage && <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
      <button type="button" className="mis-btn-primary mis-focus" onClick={() => setShowAdd(true)}><Plus size={14} /> {t(lang, "ven.addVendor")}</button>
    </div>}
    {!canManage && <p style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{t(lang, "ven.restricted")}</p>}
    {canManage && <FileDrop label={t(lang, "ven.dropFile")} accept=".xlsx,.xls,.csv" onFile={handleUpload} hint={t(lang, "ven.expectedColumns")} />}
    {preview && <div className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      <p style={{ fontSize: 13 }}>{tf(lang, "ven.previewReady", { file: preview.fileName, n: preview.rows.length })}</p>
      <div style={{ display: "flex", gap: 8 }}>
        <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setPreview(null)}>{t(lang, "common.cancel")}</button>
        <button type="button" className="mis-btn-primary mis-focus" onClick={confirmUpload}><Check size={14} /> {t(lang, "common.import")}</button>
      </div>
    </div>}
    <DataTable columns={[
      { header: t(lang, "ven.vendor"), render: v => <span style={{ color: "var(--text-primary)" }}>{v.name}</span> },
      { header: t(lang, "ven.industryCode"), render: v => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-secondary)" }}>{v.code || "—"}</span> },
      { header: t(lang, "ven.contacts"), render: v => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{v.contact} · {v.email}<br />{v.phone}{v.altContact ? ` · ${v.altContact}` : ""}</span> },
      { header: t(lang, "ven.supplies"), render: v => <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{v.categories}</span> },
      { header: t(lang, "ven.certificate"), render: v => <Badge color={v.certificateFile ? "var(--safe)" : "var(--vital)"} soft={v.certificateFile ? "var(--safe-soft)" : "var(--vital-soft)"}>{v.certificateFile ? t(lang, "ven.onFile") : t(lang, "ven.missing")}</Badge> },
      { header: t(lang, "ven.tax"), render: v => v.taxExempt ? <Badge color="var(--safe)" soft="var(--safe-soft)">{t(lang, "ven.exempt")}</Badge> : <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{t(lang, "ven.standardTax")}</span> }
    ]} rows={vendors} rowKey={v => v.id} empty={t(lang, "ven.noVendorsYet")} />
    {showAdd && <Modal title={t(lang, "ven.addVendor")} onClose={() => setShowAdd(false)} footer={<React.Fragment>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setShowAdd(false)}>{t(lang, "common.cancel")}</button>
      <button type="button" className="mis-btn-primary mis-focus" onClick={submit}>{t(lang, "ven.addVendor")}</button>
    </React.Fragment>}>
      <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <Field label={t(lang, "ven.vendorName")}><TInput required value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></Field>
        <Field label={t(lang, "ven.industryStdCode")} hint={t(lang, "ven.industryCodeHint")}><TInput value={form.code} onChange={e => setForm(f => ({ ...f, code: e.target.value }))} /></Field>
        <div className="mis-grid-2">

          <Field label={t(lang, "common.phone")}><TInput value={form.phone} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} /></Field>
        </div>
        <div className="mis-grid-2">
          <Field label={t(lang, "common.email")}><TInput type="email" value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} /></Field>
          <Field label={t(lang, "ven.additionalContact")}><TInput value={form.altContact} onChange={e => setForm(f => ({ ...f, altContact: e.target.value }))} placeholder={t(lang, "ven.additionalContactPlaceholder")} /></Field>

function MatchPOCodeTab({ customers, vendors, purchaseOrders, setPurchaseOrders, role, currentUser, logAction, pushNotification, lang }) {
  const canManage = ["director", "admin", "procurement"].includes(role);
  const [code, setCode] = useState("");
  const [poNumber, setPoNumber] = useState("");
  const [match, setMatch] = useState(null);
  function search(e) {
    e.preventDefault();
    const needle = code.trim().toUpperCase();
    if (!needle) { setMatch(null); return; }
    const customer = customers.find(c => c.poCode && c.poCode.toUpperCase() === needle);
    if (customer) { setMatch({ kind: "customer", record: customer }); return; }
    const vendor = vendors.find(v => v.code && v.code.toUpperCase() === needle);
    if (vendor) { setMatch({ kind: "vendor", record: vendor }); return; }
    setMatch({ kind: "none" });
  }
  function submitOrder() {
    if (!match || match.kind !== "customer") return;
    const po = { id: uid("PO", purchaseOrders, 4), vendorId: null, customerId: match.record.id, externalPoNumber: poNumber || code, lines: [], status: "Ordered", date: todayISO(), expected: "", source: "matched" };
    setPurchaseOrders(ps => [po, ...ps]);
    logAction(currentUser, `Matched industry code ${code} to ${match.record.name} and submitted order ${po.id} (external PO ${poNumber || "n/a"})`, "Purchasing");
    pushNotification("po", `Order ${po.id} submitted for ${match.record.name} from matched PO code ${code}`);
    setCode(""); setPoNumber(""); setMatch(null);
  }
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    <p style={{ fontSize: 12, color: "var(--text-tertiary)", maxWidth: 640 }}>{t(lang, "match.intro")}</p>
    <form onSubmit={search} className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
      <Field label={t(lang, "ven.industryStdCode")}><TInput required value={code} onChange={e => setCode(e.target.value)} placeholder={t(lang, "match.codePlaceholder")} style={{ width: 200 }} /></Field>
      <Field label={t(lang, "match.externalPoNumber")}><TInput value={poNumber} onChange={e => setPoNumber(e.target.value)} placeholder={t(lang, "match.externalPoPlaceholder")} style={{ width: 200 }} /></Field>
      <button type="submit" className="mis-btn-primary mis-focus"><Search size={14} /> {t(lang, "match.matchCodeBtn")}</button>
    </form>
    {match && match.kind === "customer" && <div className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}><Check size={16} style={{ color: "var(--safe)" }} /><b>{tf(lang, "match.matchedCustomer", { name: match.record.name })}</b></div>
      <div className="mis-kv"><span>{t(lang, "match.country")}</span><b>{match.record.country}</b></div>
      <div className="mis-kv"><span>{t(lang, "match.contact")}</span><b>{match.record.contactPerson} · {match.record.email}</b></div>
      {canManage && <button type="button" className="mis-btn-primary mis-focus" style={{ alignSelf: "flex-start" }} onClick={submitOrder}><Plus size={14} /> {t(lang, "match.submitOrder")}</button>}
    </div>}
    {match && match.kind === "vendor" && <div className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}><Check size={16} style={{ color: "var(--safe)" }} /><b>{tf(lang, "match.belongsToVendor", { name: match.record.name })}</b></div>
      <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{t(lang, "match.raiseInternalHint")}</p>
    </div>}
    {match && match.kind === "none" && <div className="mis-panel" style={{ borderRadius: 2, padding: 16 }}><span style={{ color: "var(--vital)", fontSize: 13 }}>{t(lang, "match.notFound")}</span></div>}
  </div>;
}

function Purchasing({ role, currentUser, purchaseOrders, setPurchaseOrders, vendors, setVendors, items, setItems, customers, logAction, pushNotification, lang }) {
  const subTabsAll = [
