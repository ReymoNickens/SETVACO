  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ flexShrink: 0 }}>
    <defs><clipPath id={`clip-${w}-${h}`}><rect x="1" y="1" width={w - 2} height={h - 2} rx={w * 0.28} /></clipPath></defs>
    <g clipPath={`url(#clip-${w}-${h})`}>
      {layers.map((l, i) => <rect key={i} className="mis-strata-seg" x="0" y={i * segH} width={w} height={segH + 0.5} fill={l} />)}
    </g>
    <rect x="1" y="1" width={w - 2} height={h - 2} rx={w * 0.28} fill="none" stroke="var(--border)" strokeWidth="1" />
  </svg>;
}
function stockLayers(item) {
  const ratio = item.qty / Math.max(item.reorder, 1);
  const filled = Math.min(4, Math.max(1, Math.round(ratio * 4)));
  const base = ratio < 0.5 ? "var(--vital)" : ratio < 1 ? "var(--caution)" : "var(--safe)";
  return Array.from({ length: 4 }, (_, i) => i < filled ? base : "var(--border)");
}

function RingStat({ pct, size = 96, stroke = 10, color, label, big, sub }) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const [animated, setAnimated] = useState(0);
  useEffect(() => { const raf = requestAnimationFrame(() => setAnimated(pct)); return () => cancelAnimationFrame(raf); }, [pct]);
  const offset = c - Math.min(animated, 100) / 100 * c;
  const shown = useCountUp(pct, 800);
  return <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ flexShrink: 0 }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--panel-alt)" strokeWidth={stroke} />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)" }} />
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="central" className="mis-display" fontSize={big ? 22 : 18} fill="var(--ink)">{shown}%</text>
    </svg>
    <div><div style={{ fontSize: 13, color: "var(--ink)" }}>{label}</div>{sub && <div style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{sub}</div>}</div>
  </div>;
}

// Brand mark: a cog inspired by the SETVACO logo, with a small pixel-mosaic
// accent standing in for the digital/data motif in the real wordmark.
function GearMark({ size = 30, spin, mosaic = true }) {
  const teeth = 10;
  const cx = 12, cy = 12, rOuter = 10.4, rInner = 7.6, toothLen = 2.1;
  let path = "";
  for (let i = 0; i < teeth; i++) {
    const a0 = (i / teeth) * Math.PI * 2, a1 = a0 + (Math.PI * 2) / teeth / 2;
    const p = (a, r) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    const [x0, y0] = p(a0, rOuter + toothLen);
    const [x1, y1] = p(a1, rOuter + toothLen);
    path += `${i === 0 ? "M" : "L"}${p(a0, rOuter).join(",")} L${x0},${y0} L${x1},${y1} L${p(a1, rOuter).join(",")} `;
  }
  path += "Z";
  return <svg width={size} height={size} viewBox="0 0 24 24" className={spin ? "mis-gear-spin" : ""} style={{ flexShrink: 0 }}>
    <path d={path} fill="#FFFFFF" opacity="0.92" />
    <circle cx={cx} cy={cy} r={rInner - 1.6} fill="var(--brand-deep)" />
    {mosaic && <g opacity="0.95">
      <rect x="9" y="8.4" width="1.6" height="1.6" fill="var(--coral)" />
      <rect x="10.8" y="8.4" width="1.6" height="1.6" fill="var(--teal)" />
      <rect x="9" y="10.2" width="1.6" height="1.6" fill="var(--sky)" />
      <rect x="12.6" y="10.2" width="1.6" height="1.6" fill="var(--coral)" />
      <rect x="10.8" y="12" width="1.6" height="1.6" fill="var(--teal)" />
      <rect x="12.6" y="13.8" width="1.6" height="1.6" fill="var(--sky)" />
    </g>}
  </svg>;
}
function useCountUp(value, duration = 700) {
  const [display, setDisplay] = useState(value);
  const fromRef = useRef(value);
  useEffect(() => {
    const from = fromRef.current;
    const to = typeof value === "number" ? value : 0;
    if (typeof value !== "number" || from === to) { setDisplay(value); fromRef.current = to; return; }
    const start = performance.now();
    let raf;
    const tick = now => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(Math.round(from + (to - from) * eased));
      if (t < 1) raf = requestAnimationFrame(tick); else fromRef.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => raf && cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [value]);
  return display;
}

  return `${prefix}-${String(next).padStart(pad, "0")}`;
};

const todayISO = () => new Date().toISOString().slice(0, 10);
const nowISO = () => new Date().toISOString();
const fmtDateTime = iso => { try { return new Date(iso).toLocaleString(); } catch (e) { return iso; } };

const STORAGE_KEY = "setvaco_system_state_v1";
function loadPersisted() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function savePersisted(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}

function exportRowsToExcel(filename, rows, sheetName) {
  if (!window.XLSX || !rows || !rows.length) return false;
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || "Sheet1");
  XLSX.writeFile(wb, filename);
  return true;
}
function parseExcelFile(file) {
  return new Promise((resolve, reject) => {
    if (!window.XLSX) return reject(new Error("Excel engine not loaded"));
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(sheet, { defval: "" }));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(reader.error || new Error("File read failed"));
    reader.readAsArrayBuffer(file);
  });
}
function buildMailto(to, cc, subject, body) {
  const parts = [];
  if (cc) parts.push("cc=" + encodeURIComponent(cc));
  parts.push("subject=" + encodeURIComponent(subject));
  parts.push("body=" + encodeURIComponent(body));
  return `mailto:${encodeURIComponent(to)}?${parts.join("&")}`;
}
function statusColor(status) {
  const map = {
    Draft: ["var(--text-secondary)", "var(--panel-alt)"],
    Quoted: ["var(--info)", "var(--info-soft)"],
    Sent: ["var(--info)", "var(--info-soft)"],
    Confirmed: ["var(--caution)", "var(--caution-soft)"],
    Invoiced: ["var(--safe)", "var(--safe-soft)"],
    Fulfilled: ["var(--safe)", "var(--safe-soft)"],
    Paid: ["var(--safe)", "var(--safe-soft)"],
    "Back-Ordered": ["var(--vital)", "var(--vital-soft)"],
    Ordered: ["var(--info)", "var(--info-soft)"],
    "In Transit": ["var(--caution)", "var(--caution-soft)"],
    Received: ["var(--safe)", "var(--safe-soft)"],
    "Partially Received": ["var(--caution)", "var(--caution-soft)"],
    Cancelled: ["var(--vital)", "var(--vital-soft)"],
    "In Progress": ["var(--caution)", "var(--caution-soft)"],
    Completed: ["var(--safe)", "var(--safe-soft)"],
    Active: ["var(--safe)", "var(--safe-soft)"],
    Suspended: ["var(--vital)", "var(--vital-soft)"],
    Open: ["var(--info)", "var(--info-soft)"],
    Issued: ["var(--info)", "var(--info-soft)"],
    "Pending Approval": ["var(--caution)", "var(--caution-soft)"],
    Rejected: ["var(--vital)", "var(--vital-soft)"]
  };
  return map[status] || ["var(--text-secondary)", "var(--panel-alt)"];
}

function DataTable({ columns, rows, rowKey, empty }) {
  return <div className="mis-panel mis-table-wrap" style={{ borderRadius: 16, overflow: "hidden" }}>
    <table className="mis-table">
      <thead><tr>{columns.map((c, i) => <th key={c.key || i}>{c.header}</th>)}</tr></thead>
      <tbody>
        {rows.length === 0 && <tr><td colSpan={columns.length}><div className="mis-empty">{empty || "No records."}</div></td></tr>}
        {rows.map((row, ri) => <tr key={rowKey(row)} className="mis-row mis-row-in" style={{ animationDelay: `${Math.min(ri, 12) * 22}ms` }}>{columns.map((c, i) => <td key={c.key || i}>{c.render(row)}</td>)}</tr>)}
      </tbody>

function FileDrop({ label, accept, onFile, hint }) {
  const ref = useRef(null);
  const [dragOver, setDragOver] = useState(false);
  const handle = f => { if (f) onFile(f); };
  return <div
    className="mis-dropzone"
    style={dragOver ? { borderColor: "var(--ore)", background: "var(--panel-alt)" } : undefined}
    onClick={() => ref.current && ref.current.click()}
    onDragOver={e => { e.preventDefault(); setDragOver(true); }}
    onDragLeave={() => setDragOver(false)}
    onDrop={e => { e.preventDefault(); setDragOver(false); handle(e.dataTransfer.files[0]); }}
  >
    <input ref={ref} type="file" accept={accept} style={{ display: "none" }} onChange={e => handle(e.target.files[0])} />
    <Upload size={18} style={{ margin: "0 auto 6px" }} />
    <div>{label}</div>
    {hint && <div style={{ fontSize: 11, marginTop: 4 }}>{hint}</div>}
  </div>;
}

function mergeInventoryRows(rows, type, items, stockRooms, branchFallback) {
  let newItems = items.slice();
  let newRooms = stockRooms.slice();
  let created = 0, updated = 0;
  rows.forEach(r => {
    const id = String(r.Code || r.ID || r.SKU || r.id || "").trim();
    const name = String(r.Name || r.Part || r.Description || r.name || "").trim();
    if (!id && !name) return;
    const branch = String(r.Branch || branchFallback || BRANCHES[0]).trim();
    const roomName = String(r["Stock Room"] || r.StockRoom || r.Room || "Main Store").trim();
    let room = newRooms.find(sr => sr.name === roomName && sr.branch === branch);
    if (!room) { room = { id: uid("SR", newRooms, 2), name: roomName, branch }; newRooms = [...newRooms, room]; }
    const qty = Number(r.Qty ?? r.Quantity ?? r["On Hand"] ?? 0) || 0;
    const reorder = Number(r.Reorder ?? r["Reorder At"] ?? r.ReorderPoint ?? 0) || 0;
    const cost = Number(r.Cost ?? r["Unit Cost"] ?? 0) || 0;
    const sell = Number(r.Sell ?? r["Sell Price"] ?? r.Price ?? 0) || 0;
    const brand = String(r.Brand || "").trim();
    const category = String(r.Category || "").trim();
    const existingIdx = newItems.findIndex(it => id && it.id === id);
    if (existingIdx >= 0) {
      newItems[existingIdx] = { ...newItems[existingIdx], name: name || newItems[existingIdx].name, brand: brand || newItems[existingIdx].brand, category: category || newItems[existingIdx].category, branch, stockRoom: room.id, qty, reorder: reorder || newItems[existingIdx].reorder, cost: cost || newItems[existingIdx].cost, sell: sell || newItems[existingIdx].sell };
      updated++;
    } else {
      const newId = id || uid(type === "equipment" ? "EQ" : "PT", newItems, 4);
      newItems = [...newItems, { id: newId, type, name: name || newId, brand, category, branch, stockRoom: room.id, qty, reorder, cost, sell }];
      created++;
    }
  });
  return { items: newItems, stockRooms: newRooms, created, updated };
}
function groupPORows(rows) {
  const groups = {};
  rows.forEach(r => {
    const poNum = String(r["PO Number"] || r.PONumber || r.PO || "").trim();
    if (!poNum) return;
    if (!groups[poNum]) groups[poNum] = { poNumber: poNum, vendor: String(r.Vendor || r.Supplier || "").trim(), expected: String(r["Expected Date"] || r.Expected || "").trim(), lines: [] };
    groups[poNum].lines.push({
      itemId: String(r["Item Code"] || r.ItemId || r.Code || "").trim(),
      itemName: String(r["Item Name"] || r.Item || r.Description || "").trim(),
      qty: Number(r.Qty || r.Quantity || 0) || 0
    });
  });
  return Object.values(groups);
}

function InventoryPanel({ type, items, setItems, stockRooms, setStockRooms, role, currentUser, logAction, pushNotification, vendors, purchaseOrders, setPurchaseOrders, auditLog }) {
  const label = type === "equipment" ? "Equipment" : "Part";
  const canManage = ["admin", "warehouse", "procurement"].includes(role);
  const [search, setSearch] = useState("");
  const [branchFilter, setBranchFilter] = useState("All");
  const [roomFilter, setRoomFilter] = useState("All");
  const [showUpload, setShowUpload] = useState(false);
  const [showAddRoom, setShowAddRoom] = useState(false);
  const [showUploadPO, setShowUploadPO] = useState(false);
  const [historyItem, setHistoryItem] = useState(null);
  const [preview, setPreview] = useState(null);
  const [poPreview, setPoPreview] = useState(null);
  const [newRoomForm, setNewRoomForm] = useState({ name: "", branch: BRANCHES[0] });

  const typedItems = items.filter(i => i.type === type);
  const rooms = stockRooms.filter(r => branchFilter === "All" || r.branch === branchFilter);
  const filtered = typedItems
    .filter(i => branchFilter === "All" || i.branch === branchFilter)
    .filter(i => roomFilter === "All" || i.stockRoom === roomFilter)
    .filter(i => i.name.toLowerCase().includes(search.toLowerCase()) || i.id.toLowerCase().includes(search.toLowerCase()) || (i.brand || "").toLowerCase().includes(search.toLowerCase()));

  function roomLabel(id) { const r = stockRooms.find(x => x.id === id); return r ? `${r.name} · ${r.branch}` : "—"; }

  function handleUploadFile(file) {
    parseExcelFile(file).then(rows => {
      const result = mergeInventoryRows(rows, type, items, stockRooms, branchFilter !== "All" ? branchFilter : BRANCHES[0]);
      setPreview({ ...result, fileName: file.name });
    }).catch(err => window.alert("Could not read file: " + err.message));
  }
  function confirmUpload() {
    if (!preview) return;
    setItems(preview.items);
    setStockRooms(preview.stockRooms);
    logAction(currentUser, `Uploaded ${label.toLowerCase()} inventory sheet "${preview.fileName}" — ${preview.created} new, ${preview.updated} updated`, "Inventory");
    pushNotification("inventory", `${preview.created + preview.updated} ${label.toLowerCase()} record(s) imported from ${preview.fileName}`);
    setPreview(null);
    setShowUpload(false);
  }
  function addRoom(e) {
    e.preventDefault();
    if (!newRoomForm.name.trim()) return;
    const room = { id: uid("SR", stockRooms, 2), name: newRoomForm.name.trim(), branch: newRoomForm.branch };
    setStockRooms(rs => [...rs, room]);
    logAction(currentUser, `Created stock room "${room.name}" at ${room.branch}`, "Inventory");
    setNewRoomForm({ name: "", branch: BRANCHES[0] });
    setShowAddRoom(false);
  }
  function handleUploadPO(file) {
    parseExcelFile(file).then(rows => setPoPreview({ groups: groupPORows(rows), fileName: file.name })).catch(err => window.alert("Could not read file: " + err.message));
  }
  function confirmUploadPO() {
    if (!poPreview) return;
    const newPOs = poPreview.groups.map(g => {
      const vendor = vendors.find(v => v.name.toLowerCase() === g.vendor.toLowerCase());
      return { id: /^PO-/.test(g.poNumber) ? g.poNumber : uid("PO", purchaseOrders, 4), vendorId: vendor ? vendor.id : null, vendorNameRaw: vendor ? undefined : (g.vendor || "Unspecified vendor"), lines: g.lines, status: "Ordered", date: todayISO(), expected: g.expected || "", source: "uploaded" };
    });
    setPurchaseOrders(ps => [...newPOs, ...ps]);
    newPOs.forEach(po => pushNotification("po", `Purchase order ${po.id} uploaded — ${po.lines.length} line item(s) awaiting delivery`));
    logAction(currentUser, `Uploaded purchase order file "${poPreview.fileName}" (${newPOs.length} PO's)`, "Purchasing");
    setPoPreview(null);
    setShowUploadPO(false);
  }
  function exportReport() {
    const rows = filtered.map(i => ({ Code: i.id, Name: i.name, Brand: i.brand, Category: i.category, Branch: i.branch, "Stock Room": roomLabel(i.stockRoom), "On Hand": i.qty, "Reorder At": i.reorder, Cost: i.cost, "Sell Price": i.sell }));
    const ok = exportRowsToExcel(`setvaco-${type}-inventory-${todayISO()}.xlsx`, rows, label + " Inventory");
    if (ok) logAction(currentUser, `Exported ${label.toLowerCase()} inventory report (${rows.length} rows)`, "Inventory");
    else window.alert("Nothing to export for the current filter.");
  }

  const itemHistory = historyItem ? auditLog.filter(a => a.action.includes(historyItem.id) || a.action.includes(historyItem.name)) : [];

  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", justifyContent: "space-between" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <div className="mis-panel-alt" style={{ display: "flex", alignItems: "center", gap: 8, borderRadius: 10, padding: "8px 12px", width: 260 }}>
          <Search size={14} style={{ color: "var(--text-tertiary)" }} />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search name, code, or brand" style={{ background: "transparent", border: "none", outline: "none", color: "var(--text-primary)", fontSize: 13, width: "100%" }} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <MapPin size={14} style={{ color: "var(--text-tertiary)" }} />
          <TSelect value={branchFilter} onChange={e => { setBranchFilter(e.target.value); setRoomFilter("All"); }} style={{ width: 170 }}>
            <option>All</option>{BRANCHES.map(b => <option key={b}>{b}</option>)}
          </TSelect>
        </div>
        <TSelect value={roomFilter} onChange={e => setRoomFilter(e.target.value)} style={{ width: 190 }}>
          <option value="All">All stock rooms</option>
          {rooms.map(r => <option key={r.id} value={r.id}>{r.name} · {r.branch}</option>)}
        </TSelect>
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button type="button" className="mis-btn-ghost mis-focus" onClick={exportReport}><Download size={14} /> Export report</button>
        {canManage && <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setShowAddRoom(true)}><Plus size={14} /> Stock room</button>}
        {canManage && <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setShowUploadPO(true)}><ClipboardList size={14} /> Upload purchase order</button>}
        {canManage && <button type="button" className="mis-btn-primary mis-focus" onClick={() => setShowUpload(true)}><Upload size={14} /> Upload {label.toLowerCase()} sheet</button>}
      </div>
    </div>

    <DataTable
      columns={[
        { header: "", render: it => <CoreSample layers={stockLayers(it)} size={26} /> },
        { header: label, render: it => <span style={{ color: "var(--text-primary)" }}>{it.name}</span> },
        { header: "Code", render: it => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{it.id}</span> },
        { header: "Brand", render: it => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{it.brand}</span> },
        { header: "Branch", render: it => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}><BranchTag branch={it.branch} /></span> },
        { header: "Stock Room", render: it => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{roomLabel(it.stockRoom)}</span> },
        { header: "On Hand", render: it => <span className="mis-mono" style={{ color: it.qty < it.reorder ? "var(--vital)" : "var(--text-primary)" }}>{it.qty}</span> },
        { header: "Reorder At", render: it => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{it.reorder}</span> },
        { header: "Cost", render: it => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-secondary)" }}>{fmtGHS(it.cost)}</span> },
        { header: "Sell Price", render: it => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-secondary)" }}>{fmtGHS(it.sell)}</span> },
        { header: "", render: it => <button type="button" className="mis-link-btn" onClick={() => setHistoryItem(it)}>History</button> }
      ]}
      rows={filtered}
      rowKey={it => it.id}
      empty={`No ${label.toLowerCase()}s match this filter.`}
    />

    {showAddRoom && <Modal title="Add stock room" onClose={() => setShowAddRoom(false)} footer={<React.Fragment>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setShowAddRoom(false)}>Cancel</button>
      <button type="button" className="mis-btn-primary mis-focus" onClick={addRoom}>Create room</button>
    </React.Fragment>}>
      <form onSubmit={addRoom} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Field label="Room name"><TInput required value={newRoomForm.name} onChange={e => setNewRoomForm(f => ({ ...f, name: e.target.value }))} placeholder="e.g. Overflow Store" /></Field>
        <Field label="Branch"><TSelect value={newRoomForm.branch} onChange={e => setNewRoomForm(f => ({ ...f, branch: e.target.value }))}>{BRANCHES.map(b => <option key={b}>{b}</option>)}</TSelect></Field>
      </form>
    </Modal>}

    {showUpload && <Modal title={`Upload ${label.toLowerCase()} inventory sheet`} wide onClose={() => { setShowUpload(false); setPreview(null); }} footer={preview ? <React.Fragment>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setPreview(null)}>Choose different file</button>
      <button type="button" className="mis-btn-primary mis-focus" onClick={confirmUpload}><Check size={14} /> Import {preview.created + preview.updated} rows</button>
    </React.Fragment> : null}>
      {!preview && <React.Fragment>
        <FileDrop label="Click or drop an Excel/CSV file" accept=".xlsx,.xls,.csv" onFile={handleUploadFile} hint="Expected columns: Code, Name, Brand, Category, Branch, Stock Room, Qty, Reorder, Cost, Sell" />
        <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>Existing codes are updated in place; unmatched codes are created as new records. Stock rooms referenced by name are created automatically if they don't already exist.</p>
      </React.Fragment>}
      {preview && <p style={{ fontSize: 13, color: "var(--text-secondary)" }}>{preview.fileName}: <b style={{ color: "var(--safe)" }}>{preview.created} new</b>, <b style={{ color: "var(--caution)" }}>{preview.updated} updated</b>.</p>}
    </Modal>}

    {showUploadPO && <Modal title="Upload purchase order file" wide onClose={() => { setShowUploadPO(false); setPoPreview(null); }} footer={poPreview ? <React.Fragment>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setPoPreview(null)}>Choose different file</button>
      <button type="button" className="mis-btn-primary mis-focus" onClick={confirmUploadPO}><Check size={14} /> Import {poPreview.groups.length} PO(s)</button>
    </React.Fragment> : null}>
      {!poPreview && <React.Fragment>
        <FileDrop label="Click or drop an Excel/CSV purchase order file" accept=".xlsx,.xls,.csv" onFile={handleUploadPO} hint="Expected columns: PO Number, Vendor, Item Code, Item Name, Qty, Expected Date" />
        <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>The system reads each line, groups it by PO number, and notifies Procurement once imported.</p>
      </React.Fragment>}
      {poPreview && <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {poPreview.groups.map(g => <div key={g.poNumber} className="mis-panel-alt" style={{ borderRadius: 10, padding: 10 }}>
          <div style={{ fontSize: 13, color: "var(--text-primary)" }}>{g.poNumber} — {g.vendor || "Unspecified vendor"}</div>
          <div style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{g.lines.length} line item(s){g.expected ? `, expected ${g.expected}` : ""}</div>
        </div>)}
      </div>}
    </Modal>}

    {historyItem && <Drawer title={`${historyItem.name} — history`} onClose={() => setHistoryItem(null)}>
      <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 16 }}>
        <div className="mis-kv"><span>Code</span><b className="mis-mono">{historyItem.id}</b></div>
        <div className="mis-kv"><span>Branch</span><b>{historyItem.branch}</b></div>
        <div className="mis-kv"><span>Stock room</span><b>{roomLabel(historyItem.stockRoom)}</b></div>
        <div className="mis-kv"><span>On hand</span><b>{historyItem.qty} (reorder at {historyItem.reorder})</b></div>
      </div>
      <div className="mis-divider" style={{ marginBottom: 12 }} />
      <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginBottom: 8, textTransform: "uppercase", letterSpacing: ".04em" }}>Activity — who did what</div>
      {itemHistory.length === 0 && <div className="mis-empty">No recorded activity yet for this record.</div>}
      {itemHistory.map(a => <div key={a.id} style={{ padding: "8px 0", borderBottom: "1px solid var(--border-soft)" }}>
        <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{a.action}</div>
        <div style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{a.user} · {fmtDateTime(a.ts)}</div>
      </div>)}
    </Drawer>}
  </div>;
}

function LineItemsEditor({ lines, setLines, inventoryItems }) {
  function updateLine(idx, patch) { setLines(ls => ls.map((l, i) => i === idx ? { ...l, ...patch } : l)); }
  function removeLine(idx) { setLines(ls => ls.filter((_, i) => i !== idx)); }
  function addInventoryLine() { setLines(ls => [...ls, { itemId: "", desc: "", qty: 1, unitPrice: 0, newPart: false }]); }
  function addCustomLine() { setLines(ls => [...ls, { itemId: "", desc: "", qty: 1, unitPrice: 0, newPart: true }]); }
  const total = lines.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.unitPrice) || 0), 0);
  return <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
    {lines.map((line, idx) => <div key={idx} className="mis-panel-alt" style={{ borderRadius: 10, padding: 10, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
      {!line.newPart ? <Field label="Item"><TSelect value={line.itemId} onChange={e => {
        const it = inventoryItems.find(x => x.id === e.target.value);
        updateLine(idx, { itemId: e.target.value, desc: it ? it.name : "", unitPrice: it ? it.sell : 0 });
      }} style={{ minWidth: 220 }}>
        <option value="">Select from inventory…</option>
        {inventoryItems.map(it => <option key={it.id} value={it.id}>{it.name} ({it.id}) — {it.qty} in stock</option>)}
      </TSelect></Field>
        : <Field label="Description (not in inventory)"><TInput value={line.desc} onChange={e => updateLine(idx, { desc: e.target.value })} placeholder="Describe the item to be sourced" style={{ minWidth: 220 }} /></Field>}
      <Field label="Qty"><TInput type="number" min="1" value={line.qty} onChange={e => updateLine(idx, { qty: e.target.value })} style={{ width: 80 }} /></Field>
      <Field label="Unit price"><TInput type="number" min="0" step="0.01" value={line.unitPrice} onChange={e => updateLine(idx, { unitPrice: e.target.value })} style={{ width: 130 }} /></Field>
      <div style={{ fontSize: 12, color: "var(--text-tertiary)", minWidth: 100 }}>{fmtGHS((Number(line.qty) || 0) * (Number(line.unitPrice) || 0))}</div>
      {line.newPart && <Badge color="var(--caution)" soft="var(--caution-soft)">To be sourced</Badge>}
      <button type="button" className="mis-btn-danger" onClick={() => removeLine(idx)}><Trash2 size={12} /></button>
    </div>)}
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={addInventoryLine}><Plus size={14} /> Add from inventory</button>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={addCustomLine}><Plus size={14} /> Add item not in inventory</button>
    </div>
    <div style={{ textAlign: "right", fontSize: 14, color: "var(--text-primary)" }}>Total: <b className="mis-mono">{fmtGHS(total)}</b></div>
  </div>;
}

function CustomerPickerField({ customerId, setCustomerId, isNew, setIsNew, newFields, setNewFields, customers }) {
  return <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <label className="mis-label">Customer</label>
      <button type="button" className="mis-link-btn" onClick={() => setIsNew(v => !v)}>{isNew ? "Pick existing customer" : "+ New customer"}</button>
    </div>
    {!isNew ? <TSelect required={!isNew} value={customerId} onChange={e => setCustomerId(e.target.value)}>
      <option value="">Select customer…</option>
      {customers.map(c => <option key={c.id} value={c.id}>{c.name} — {c.country}</option>)}
    </TSelect> : <div className="mis-grid-2">
      <TInput required placeholder="Customer / company name" value={newFields.name} onChange={e => setNewFields(f => ({ ...f, name: e.target.value }))} />
      <TInput required placeholder="Country" value={newFields.country} onChange={e => setNewFields(f => ({ ...f, country: e.target.value }))} />
    </div>}
  </div>;
}
function resolveOrCreateCustomer({ isNew, newFields, customerId, customers, setCustomers, logAction, currentUser }) {
  if (!isNew) return customers.find(c => c.id === customerId) || null;
  if (!newFields.name.trim()) return null;
  const customer = { id: uid("C", customers, 2), name: newFields.name.trim(), country: newFields.country.trim() || "—", tier: "Standard", creditLimit: 0, outstanding: 0, taxExempt: false, address: "", email: "", phone: "", contactPerson: "", contactAddress: "", companyDetails: "", poCode: "", contacts: [], walkIn: true };
  setCustomers(cs => [...cs, customer]);
  logAction(currentUser, `Created walk-in customer record for ${customer.name}`, "Customers");
  return customer;
}

function CreateQuotationModal({ type, customers, setCustomers, inventoryItems, quotations, setQuotations, currentUser, logAction, pushNotification, approvalSettings, onClose, onCreated, defaultCustomerId, defaultLines }) {
  const [customerId, setCustomerId] = useState(defaultCustomerId || "");
  const [isNewCustomer, setIsNewCustomer] = useState(false);
  const [newCustomerFields, setNewCustomerFields] = useState({ name: "", country: "" });
  const [lines, setLines] = useState(defaultLines && defaultLines.length ? defaultLines : [{ itemId: "", desc: "", qty: 1, unitPrice: 0, newPart: false }]);
  const [notes, setNotes] = useState("");
  const [leadTimeDays, setLeadTimeDays] = useState(7);
  const [eta, setEta] = useState("");
  const [preparedBy, setPreparedBy] = useState(currentUser);
  const [applyTax, setApplyTax] = useState(true);
  const [taxRate, setTaxRate] = useState(15);
  const existingCustomer = !isNewCustomer ? customers.find(c => c.id === customerId) : null;
  const typeLabel = type === "part" ? "parts" : type === "equipment" ? "equipment" : "service";
  const subtotal = lines.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.unitPrice) || 0), 0);
  const previewTaxExempt = existingCustomer ? existingCustomer.taxExempt : false;
  const previewTax = applyTax && !previewTaxExempt ? Math.round(subtotal * (Number(taxRate) || 0) / 100) : 0;

  function submit(e) {
    e.preventDefault();
    const validLines = lines.filter(l => (l.itemId || l.desc) && Number(l.qty) > 0);
    if (!validLines.length) return;
    const customer = resolveOrCreateCustomer({ isNew: isNewCustomer, newFields: newCustomerFields, customerId, customers, setCustomers, logAction, currentUser });
    if (!customer) return;
    const lineSubtotal = validLines.reduce((s, l) => s + Number(l.qty) * (Number(l.unitPrice) || 0), 0);
    const effectiveApplyTax = applyTax && !customer.taxExempt;
    const taxAmount = effectiveApplyTax ? Math.round(lineSubtotal * (Number(taxRate) || 0) / 100) : 0;
    const total = lineSubtotal + taxAmount;
    const needsApproval = total > approvalSettings.valueThreshold || approvalSettings.flaggedCustomers.includes(customer.name);
    const q = {
      id: uid("QT", quotations, 4), type, customerId: customer.id, country: customer.country || "",
      lines: validLines.map(l => ({ itemId: l.itemId || "", desc: l.desc || ((inventoryItems.find(i => i.id === l.itemId) || {}).name || ""), qty: Number(l.qty), unitPrice: Number(l.unitPrice) || 0, newPart: !!l.newPart })),
      notes, subtotal: lineSubtotal, applyTax: effectiveApplyTax, taxRate: Number(taxRate) || 0, taxAmount, total,
      leadTimeDays: Number(leadTimeDays) || 0, eta, preparedBy: preparedBy || currentUser, feedbackLog: [],
      status: needsApproval ? "Pending Approval" : "Quoted", date: todayISO(), createdBy: currentUser
    };
    setQuotations(qs => [q, ...qs]);
    logAction(currentUser, `Created ${typeLabel} quotation ${q.id} for ${customer.name}${needsApproval ? " — held for management approval" : ""}`, "Sales");
    pushNotification("quote", `${q.id} created for ${customer.name}${needsApproval ? " (pending approval)" : ""}`);
    onClose();
    onCreated && onCreated(q);
  }

  return <Modal title={`Create ${typeLabel} quotation`} wide onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>Cancel</button>
    <button type="button" className="mis-btn-primary mis-focus" onClick={submit}><Plus size={14} /> Create quotation</button>
  </React.Fragment>}>
    <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div className="mis-grid-2">
        <CustomerPickerField customerId={customerId} setCustomerId={setCustomerId} isNew={isNewCustomer} setIsNew={setIsNewCustomer} newFields={newCustomerFields} setNewFields={setNewCustomerFields} customers={customers} />
        {existingCustomer && <div className="mis-panel-alt" style={{ borderRadius: 10, padding: 10, fontSize: 12, color: "var(--text-secondary)" }}>
          <div>{existingCustomer.contactPerson} · {existingCustomer.email}</div>
          <div>{existingCustomer.phone}</div>
          <div>{existingCustomer.address}</div>
          {existingCustomer.taxExempt && <Badge color="var(--safe)" soft="var(--safe-soft)">Tax-exempt</Badge>}
        </div>}
      </div>
      <LineItemsEditor lines={lines} setLines={setLines} inventoryItems={inventoryItems} />
      <div className="mis-grid-3">
        <Field label="Lead time (days)"><TInput type="number" min="0" value={leadTimeDays} onChange={e => setLeadTimeDays(e.target.value)} /></Field>
        <Field label="ETA"><TInput type="date" value={eta} onChange={e => setEta(e.target.value)} /></Field>
        <Field label="Prepared by"><TInput value={preparedBy} onChange={e => setPreparedBy(e.target.value)} placeholder={currentUser} /></Field>
      </div>
      <div className="mis-panel-alt" style={{ borderRadius: 10, padding: 12, display: "flex", flexDirection: "column", gap: 8 }}>
        <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
          <input type="checkbox" checked={applyTax} onChange={e => setApplyTax(e.target.checked)} /> Apply tax
          {applyTax && <TInput type="number" min="0" max="100" value={taxRate} onChange={e => setTaxRate(e.target.value)} style={{ width: 70 }} />}
          {applyTax && <span style={{ color: "var(--text-tertiary)" }}>%</span>}
        </label>
        <div className="mis-kv"><span>Subtotal</span><b>{fmtGHS(subtotal)}</b></div>
        <div className="mis-kv"><span>Tax{previewTaxExempt ? " (waived — customer is tax-exempt)" : ""}</span><b>{fmtGHS(previewTax)}</b></div>
        <div className="mis-kv" style={{ fontSize: 13 }}><span>Total</span><b>{fmtGHS(subtotal + previewTax)}</b></div>
        {(subtotal + previewTax) > approvalSettings.valueThreshold && <p style={{ fontSize: 11, color: "var(--caution)" }}>Above the {fmtGHS(approvalSettings.valueThreshold)} approval threshold — this quotation will be held for management sign-off.</p>}
      </div>
      <Field label="Notes (optional)"><TArea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Delivery terms, validity period, etc." /></Field>
      <p style={{ fontSize: 11, color: "var(--text-tertiary)" }}>Part not listed? Add it from Stock Room first, then quote it here. Tax-exempt customers automatically skip tax.</p>
    </form>
  </Modal>;
}

function printDocument(doc, customer, kind) {
  const w = window.open("", "_blank", "width=800,height=900");
  if (!w) { window.alert("Please allow pop-ups to print or export this document."); return; }
  const total = doc.lines.reduce((s, l) => s + l.qty * l.unitPrice, 0);
  const rowsHtml = doc.lines.map(l => `<tr><td>${l.desc}${l.newPart ? " (to be sourced)" : ""}</td><td>${l.qty}</td><td>${fmtGHS(l.unitPrice)}</td><td>${fmtGHS(l.qty * l.unitPrice)}</td></tr>`).join("");
  w.document.write(`<html><head><title>${doc.id}</title><style>
    body{font-family:Arial,sans-serif;padding:32px;color:#1a1c1e;}
    h1{font-size:20px;margin-bottom:4px;}
    table{width:100%;border-collapse:collapse;margin-top:16px;}
    th,td{border:1px solid #ccc;padding:8px;font-size:13px;text-align:left;}
    .tot{text-align:right;font-weight:bold;margin-top:12px;}
    .muted{color:#666;font-size:12px;}
  </style></head><body>
    <h1>SETVACO Holding Limited</h1>
    <div class="muted">${kind === "invoice" ? "Invoice" : "Quotation"} ${doc.id} · ${doc.date}</div>
    <hr/>
    <p><b>${customer ? customer.name : ""}</b><br/>${customer ? customer.address : ""}<br/>${customer ? customer.email : ""} · ${customer ? customer.phone : ""}</p>
    <table><thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Line Total</th></tr></thead><tbody>${rowsHtml}</tbody></table>
    <div class="tot">Total: ${fmtGHS(total)}</div>
    ${doc.notes ? `<p class="muted">${doc.notes}</p>` : ""}
  </body></html>`);
  w.document.close();
  w.focus();
  w.print();
}

function SendDocumentModal({ doc, kind, customer, users, currentUser, logAction, onClose, onSent }) {
  const officials = users.filter(u => ["admin", "finance"].includes(u.role)).map(u => u.email);
  const [ccSelected, setCcSelected] = useState(officials);
  const total = doc.lines.reduce((s, l) => s + l.qty * l.unitPrice, 0);
  const subject = `${kind === "invoice" ? "Invoice" : "Quotation"} ${doc.id} from SETVACO Holding Ltd`;
  const body = `Dear ${customer ? customer.contactPerson : "Customer"},\n\nPlease find below ${kind === "invoice" ? "invoice" : "quotation"} ${doc.id} dated ${doc.date}, total ${fmtGHS(total)}.\n\n`
    + doc.lines.map(l => `- ${l.desc} x${l.qty} @ ${fmtGHS(l.unitPrice)}`).join("\n")
    + `\n\nKind regards,\n${currentUser}\nSETVACO Holding Limited`;
  const cc = ccSelected.join(",");
  const href = customer ? buildMailto(customer.email, cc, subject, body) : undefined;
  function toggle(email) { setCcSelected(s => s.includes(email) ? s.filter(x => x !== email) : [...s, email]); }
  function handleSend() {
    logAction(currentUser, `Sent ${doc.id} to ${customer ? customer.email : "customer"} (cc: ${cc || "none"})`, "Communications");
    onSent && onSent();
  }
  return <Modal title={`Send ${kind === "invoice" ? "invoice" : "quotation"} to customer`} onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>Close</button>
    {customer ? <a className="mis-btn-primary mis-focus" href={href} onClick={handleSend}><Mail size={14} /> Open email client</a>
      : <button type="button" className="mis-btn-primary mis-focus" disabled><Mail size={14} /> No customer email on file</button>}
  </React.Fragment>}>
    <div className="mis-kv"><span>To</span><b>{customer ? `${customer.name} <${customer.email}>` : "—"}</b></div>
    <Field label="CC company officials">
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {users.map(u => <label key={u.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
          <input type="checkbox" checked={ccSelected.includes(u.email)} onChange={() => toggle(u.email)} /> {u.name} <span style={{ color: "var(--text-tertiary)" }}>({ROLES[u.role].label})</span>
        </label>)}
      </div>
    </Field>
    <Field label="Subject"><TInput value={subject} readOnly /></Field>
    <Field label="Message preview"><TArea value={body} readOnly rows={8} /></Field>
    <p style={{ fontSize: 11, color: "var(--text-tertiary)" }}>Opens your default email client with the recipient, cc, subject and message pre-filled — this prototype has no mail server of its own, so sending happens through your own mail app.</p>
  </Modal>;
}

function DocumentsTable({ docs, customers, kind, onSend, onConvert, onPrint, onDetails }) {
  function custName(id) { const c = customers.find(x => x.id === id); return c ? c.name : "—"; }
  function total(doc) { return typeof doc.total === "number" ? doc.total : doc.lines.reduce((s, l) => s + l.qty * l.unitPrice, 0); }
  return <DataTable
    columns={[
      { header: kind === "invoice" ? "Invoice" : "Quotation", render: d => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{d.id}</span> },
      { header: "Customer", render: d => <span style={{ color: "var(--text-primary)" }}>{custName(d.customerId)}</span> },
      { header: "Lines", render: d => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{d.lines.length} item(s){d.lines.some(l => l.newPart) ? " · incl. to-source" : ""}</span> },
      { header: "Total", render: d => <span className="mis-mono">{fmtGHS(total(d))}</span> },
      { header: "Prepared By", render: d => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{d.preparedBy || "—"}</span> },
      { header: "ETA", render: d => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{d.eta || "—"}</span> },
      { header: "Status", render: d => { const cs = statusColor(d.status); return <Badge color={cs[0]} soft={cs[1]}>{d.status}</Badge>; } },
      { header: "Actions", render: d => <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        {onDetails && <button type="button" className="mis-link-btn" onClick={() => onDetails(d)}>Details</button>}
        <button type="button" className="mis-link-btn" onClick={() => onPrint(d)}>Print</button>
        {d.status !== "Pending Approval" && d.status !== "Rejected" && <button type="button" className="mis-link-btn" onClick={() => onSend(d)}>Send</button>}
        {kind === "quotation" && d.status !== "Invoiced" && d.status !== "Pending Approval" && d.status !== "Rejected" && <button type="button" className="mis-link-btn" onClick={() => onConvert(d)}>Convert to invoice</button>}
      </div> }
    ]}
    rows={docs}
    rowKey={d => d.id}
    empty={`No ${kind === "invoice" ? "invoices" : "quotations"} yet.`}
  />;
}

function BackOrderReport({ quotations, invoices, items, purchaseOrders, role, typeFilter }) {
  const canSeeSupplyChain = ["admin", "procurement", "warehouse"].includes(role);
  const rows = [];
  [...quotations, ...invoices].forEach(d => {
    if (typeFilter !== "all" && d.type !== typeFilter) return;
    d.lines.forEach(l => {
      if (!l.itemId) return;
      const item = items.find(i => i.id === l.itemId);
      if (!item || item.qty >= l.qty) return;
      const relatedPOs = purchaseOrders.filter(po => po.lines.some(pl => pl.itemId === l.itemId) && po.status !== "Received");
      rows.push({ key: d.id + l.itemId, docId: d.id, itemName: item.name, needed: l.qty, onHand: item.qty, shortfall: l.qty - item.qty, pos: relatedPOs });
    });
  });
  const columns = [
    { header: "Order", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{r.docId}</span> },
    { header: "Item", render: r => <span>{r.itemName}</span> },
    { header: "Needed", render: r => <span className="mis-mono">{r.needed}</span> },
    { header: "On Hand", render: r => <span className="mis-mono" style={{ color: "var(--vital)" }}>{r.onHand}</span> },
    { header: "Shortfall", render: r => <span className="mis-mono" style={{ color: "var(--vital)" }}>{r.shortfall}</span> }
  ];
  if (canSeeSupplyChain) columns.push({ header: "Supply status", render: r => r.pos.length
    ? r.pos.map(po => { const cs = statusColor(po.status); return <div key={po.id} style={{ fontSize: 11, marginBottom: 2 }}><Badge color={cs[0]} soft={cs[1]}>{po.status}</Badge> {po.id}{po.expected ? ` · ETA ${po.expected}` : ""}</div>; })
    : <span style={{ fontSize: 12, color: "var(--vital)" }}>Not yet ordered</span> });
  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>Lines where the quoted or invoiced quantity exceeds what's currently on hand, cross-referenced against open purchase orders.{!canSeeSupplyChain ? " Full transit/vendor detail is limited to procurement, warehouse and admin access." : ""}</p>
    <DataTable columns={columns} rows={rows} rowKey={r => r.key} empty="No back-ordered lines — all quoted/invoiced quantities are covered by stock." />
  </div>;
}

function SalesQuotations({ page, role, currentUser, customers, setCustomers, items, setItems, quotations, setQuotations, invoices, setInvoices, approvalSettings, users, logAction, pushNotification }) {
  const type = page === "equipmentsales" ? "equipment" : "part";
  const [showCreate, setShowCreate] = useState(false);
  const [sendDoc, setSendDoc] = useState(null);
  const [detailDoc, setDetailDoc] = useState(null);
  const [showProducts, setShowProducts] = useState(false);
  const [feedbackDraft, setFeedbackDraft] = useState({});
  const [managerDraft, setManagerDraft] = useState({});

  function custName(id) { const c = customers.find(x => x.id === id); return c ? c.name : "—"; }

  function convertQuotationToInvoice(q) {
    const inv = { id: uid("INV", invoices, 4), quotationId: q.id, type: q.type, customerId: q.customerId, lines: q.lines, subtotal: q.subtotal, applyTax: q.applyTax, taxRate: q.taxRate, taxAmount: q.taxAmount, total: q.total, status: "Issued", date: todayISO(), createdBy: currentUser };
    setInvoices(is => [inv, ...is]);
    setQuotations(qs => qs.map(x => x.id === q.id ? { ...x, status: "Invoiced" } : x));
    setItems(its => its.map(it => {
      const line = q.lines.find(l => l.itemId === it.id);
      return line ? { ...it, qty: Math.max(0, it.qty - line.qty) } : it;
    }));
    logAction(currentUser, `Converted ${q.id} to invoice ${inv.id} for ${custName(q.customerId)} — stock updated`, "Sales");
    pushNotification("invoice", `${inv.id} issued to ${custName(q.customerId)}`);
  }

  const partsList = items.filter(i => i.type === "part");
  const equipmentList = items.filter(i => i.type === "equipment");
  const inventoryItems = type === "equipment" ? equipmentList : partsList;
  const pageQuotations = quotations.filter(q => q.type === type);
  const pageInvoices = invoices.filter(i => i.type === type);

  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
      {type === "equipment" && <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setShowProducts(true)}><Boxes size={14} /> See products</button>}
      {["admin", "sales"].includes(role) && <button type="button" className="mis-btn-primary mis-focus" style={{ marginLeft: "auto" }} onClick={() => setShowCreate(true)}><Plus size={14} /> Create quotation</button>}
    </div>
    <h4 style={{ fontSize: 12, textTransform: "uppercase", color: "var(--text-tertiary)" }}>Transaction History</h4>
    <DocumentsTable docs={pageQuotations} customers={customers} kind="quotation" onDetails={d => setDetailDoc(d)} onPrint={d => printDocument(d, customers.find(c => c.id === d.customerId), "quotation")} onSend={d => setSendDoc({ doc: d, kind: "quotation" })} onConvert={convertQuotationToInvoice} />
    <h4 style={{ fontSize: 12, textTransform: "uppercase", color: "var(--text-tertiary)" }}>Invoices</h4>
    <DocumentsTable docs={pageInvoices} customers={customers} kind="invoice" onPrint={d => printDocument(d, customers.find(c => c.id === d.customerId), "invoice")} onSend={d => setSendDoc({ doc: d, kind: "invoice" })} onConvert={() => {}} />

    {showCreate && <CreateQuotationModal
      type={type}
      customers={customers} setCustomers={setCustomers}
      inventoryItems={inventoryItems}
      quotations={quotations} setQuotations={setQuotations}
      currentUser={currentUser} logAction={logAction} pushNotification={pushNotification}
      approvalSettings={approvalSettings}
      onClose={() => setShowCreate(false)}
      onCreated={q => setSendDoc({ doc: q, kind: "quotation" })}
    />}
    {sendDoc && <SendDocumentModal doc={sendDoc.doc} kind={sendDoc.kind} customer={customers.find(c => c.id === sendDoc.doc.customerId)} users={users} currentUser={currentUser} logAction={logAction} onClose={() => setSendDoc(null)} onSent={() => {
      if (sendDoc.kind === "quotation") setQuotations(qs => qs.map(x => x.id === sendDoc.doc.id && x.status === "Quoted" ? { ...x, status: "Sent" } : x));
      setSendDoc(null);
    }} />}
    {detailDoc && <QuotationDetailDrawer doc={detailDoc} customer={customers.find(c => c.id === detailDoc.customerId)} role={role} currentUser={currentUser} logAction={logAction} setQuotations={setQuotations} feedbackDraft={feedbackDraft} setFeedbackDraft={setFeedbackDraft} managerDraft={managerDraft} setManagerDraft={setManagerDraft} onClose={() => setDetailDoc(null)} />}
    {showProducts && <Modal title="Equipment products" wide onClose={() => setShowProducts(false)}>
      <DataTable columns={[
        { header: "Product", render: it => <span style={{ color: "var(--text-primary)" }}>{it.name}</span> },
        { header: "Brand", render: it => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{it.brand}</span> },
        { header: "Category", render: it => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{it.category}</span> },
        { header: "Branch", render: it => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}><BranchTag branch={it.branch} /></span> },
        { header: "Available", render: it => <span className="mis-mono" style={{ color: it.qty <= 0 ? "var(--vital)" : "var(--text-primary)" }}>{it.qty}</span> },
        { header: "Price", render: it => <span className="mis-mono">{fmtGHS(it.sell)}</span> }
      ]} rows={equipmentList} rowKey={it => it.id} empty="No equipment products yet." />
    </Modal>}
  </div>;
}

function InternalPOsTab({ purchaseOrders, setPurchaseOrders, vendors, customers, items, setItems, role, currentUser, logAction, pushNotification }) {
  const canManage = ["admin", "procurement"].includes(role);
  const [form, setForm] = useState({ vendorId: "", expected: "", lines: [{ itemId: "", itemName: "", qty: 1 }] });
  function setFormLines(updater) { setForm(f => ({ ...f, lines: typeof updater === "function" ? updater(f.lines) : updater })); }
  function submit(e) {
    e.preventDefault();
    const vendor = vendors.find(v => v.id === form.vendorId);
    const validLines = form.lines.filter(l => l.itemId && Number(l.qty) > 0).map(l => ({ itemId: l.itemId, itemName: l.itemName, qty: Number(l.qty) }));
    if (!vendor || !validLines.length) return;
    const po = { id: uid("PO", purchaseOrders, 4), vendorId: vendor.id, lines: validLines, status: "Ordered", date: todayISO(), expected: form.expected, source: "manual" };
    setPurchaseOrders(ps => [po, ...ps]);
    logAction(currentUser, `Raised ${po.id} to ${vendor.name} for ${validLines.map(l => l.itemName).join(", ")}`, "Purchasing");
    pushNotification("po", `${po.id} raised to ${vendor.name}`);
    setForm({ vendorId: "", expected: "", lines: [{ itemId: "", itemName: "", qty: 1 }] });
  }
  function advance(po) {
    const next = po.status === "Ordered" ? "In Transit" : po.status === "In Transit" ? "Received" : po.status;
    if (next === po.status) return;
    setPurchaseOrders(ps => ps.map(p => p.id === po.id ? { ...p, status: next } : p));
    if (next === "Received") {
      setItems(its => its.map(it => { const line = po.lines.find(l => l.itemId === it.id); return line ? { ...it, qty: it.qty + line.qty } : it; }));
      logAction(currentUser, `Received ${po.id} — stock updated for ${po.lines.map(l => l.itemName).join(", ") || "matched order"}`, "Purchasing");
    } else {
      logAction(currentUser, `Marked ${po.id} as ${next}`, "Purchasing");
    }
  }
  function poParty(p) {
    if (p.vendorNameRaw) return p.vendorNameRaw;
    if (p.vendorId) { const v = vendors.find(x => x.id === p.vendorId); if (v) return v.name; }
    if (p.customerId) { const c = customers.find(x => x.id === p.customerId); if (c) return `${c.name} (customer order)`; }
    return "Unspecified vendor";
  }
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    {canManage && <form onSubmit={submit} className="mis-panel" style={{ borderRadius: 16, padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
      <div className="mis-grid-2">
        <Field label="Vendor"><TSelect required value={form.vendorId} onChange={e => setForm(f => ({ ...f, vendorId: e.target.value }))}>
          <option value="">Select vendor…</option>{vendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
        </TSelect></Field>
        <Field label="Expected delivery date"><TInput type="date" value={form.expected} onChange={e => setForm(f => ({ ...f, expected: e.target.value }))} /></Field>
      </div>
      <POLineItemsEditor lines={form.lines} setLines={setFormLines} items={items} />
      <button type="submit" className="mis-btn-primary mis-focus" style={{ alignSelf: "flex-start" }}><Plus size={14} /> Raise purchase order</button>
    </form>}
    <DataTable columns={[
      { header: "PO", render: p => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{p.id}</span> },
      { header: "Vendor / Party", render: p => <span style={{ color: "var(--text-primary)" }}>{poParty(p)}</span> },
      { header: "Lines", render: p => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{p.lines.length ? p.lines.map(l => `${l.itemName || l.itemId} x${l.qty}`).join(", ") : (p.externalPoNumber ? `External PO ${p.externalPoNumber} — pending detail` : "—")}</span> },
      { header: "Expected", render: p => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{p.expected || "—"}</span> },
      { header: "Status", render: p => { const cs = statusColor(p.status); return <Badge color={cs[0]} soft={cs[1]}>{p.status}</Badge>; } },
      { header: "Actions", render: p => canManage && p.status !== "Received" ? <button type="button" className="mis-link-btn" onClick={() => advance(p)}>Mark {p.status === "Ordered" ? "in transit" : "received"}</button> : null }
    ]} rows={purchaseOrders} rowKey={p => p.id} empty="No purchase orders yet." />
  </div>;
}

function VendorsTab({ vendors, setVendors, role, currentUser, logAction }) {
  const canManage = ["admin", "procurement"].includes(role);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ name: "", code: "", contact: "", email: "", phone: "", altContact: "", categories: "", taxExempt: false, certificateFile: null });
  const [preview, setPreview] = useState(null);
  function submit(e) {
    e.preventDefault();
    if (!form.name.trim()) return;
    const vendor = { id: uid("V", vendors, 2), ...form };
    setVendors(vs => [...vs, vendor]);
    logAction(currentUser, `Added vendor ${vendor.name} (code ${vendor.code || "—"})`, "Purchasing");
    setForm({ name: "", code: "", contact: "", email: "", phone: "", altContact: "", categories: "", taxExempt: false, certificateFile: null });
    setShowAdd(false);
  }
  function handleUpload(file) {
    parseExcelFile(file).then(rows => {
      const parsed = rows.map(r => ({ name: String(r.Name || r.Vendor || "").trim(), code: String(r.Code || r["Industry Code"] || "").trim(), contact: String(r.Contact || "").trim(), email: String(r.Email || "").trim(), phone: String(r.Phone || "").trim(), categories: String(r.Categories || "").trim() })).filter(v => v.name);
      setPreview({ rows: parsed, fileName: file.name });
    }).catch(err => window.alert("Could not read file: " + err.message));
  }
  function confirmUpload() {
    if (!preview) return;
    let list = vendors.slice();
    preview.rows.forEach(v => {
      const existingIdx = list.findIndex(x => v.code && x.code === v.code);
      if (existingIdx >= 0) list[existingIdx] = { ...list[existingIdx], ...v };
      else list = [...list, { id: uid("V", list, 2), ...v }];
    });
    setVendors(list);
    logAction(currentUser, `Uploaded vendor list "${preview.fileName}" (${preview.rows.length} records)`, "Purchasing");
    setPreview(null);
  }
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    {canManage && <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
      <button type="button" className="mis-btn-primary mis-focus" onClick={() => setShowAdd(true)}><Plus size={14} /> Add vendor</button>
    </div>}
    {!canManage && <p style={{ fontSize: 11, color: "var(--text-tertiary)" }}>Vendor creation is restricted to Procurement and Admin roles.</p>}
    {canManage && <FileDrop label="Click or drop an Excel/CSV vendor list to bulk-upload" accept=".xlsx,.xls,.csv" onFile={handleUpload} hint="Expected columns: Name, Code, Contact, Email, Phone, Categories" />}
    {preview && <div className="mis-panel" style={{ borderRadius: 16, padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
      <p style={{ fontSize: 13 }}>{preview.fileName}: {preview.rows.length} vendor record(s) ready to import.</p>
      <div style={{ display: "flex", gap: 8 }}>
        <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setPreview(null)}>Cancel</button>
        <button type="button" className="mis-btn-primary mis-focus" onClick={confirmUpload}><Check size={14} /> Import</button>
      </div>
    </div>}
    <DataTable columns={[
      { header: "Vendor", render: v => <span style={{ color: "var(--text-primary)" }}>{v.name}</span> },
      { header: "Industry Code", render: v => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-secondary)" }}>{v.code || "—"}</span> },
      { header: "Contacts", render: v => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{v.contact} · {v.email}<br />{v.phone}{v.altContact ? ` · ${v.altContact}` : ""}</span> },
      { header: "Supplies", render: v => <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{v.categories}</span> },
      { header: "Certificate", render: v => <Badge color={v.certificateFile ? "var(--safe)" : "var(--vital)"} soft={v.certificateFile ? "var(--safe-soft)" : "var(--vital-soft)"}>{v.certificateFile ? "On file" : "Missing"}</Badge> },
      { header: "Tax", render: v => v.taxExempt ? <Badge color="var(--safe)" soft="var(--safe-soft)">Exempt</Badge> : <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>Standard</span> }
    ]} rows={vendors} rowKey={v => v.id} empty="No vendors yet." />
    {showAdd && <Modal title="Add vendor" onClose={() => setShowAdd(false)} footer={<React.Fragment>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setShowAdd(false)}>Cancel</button>
      <button type="button" className="mis-btn-primary mis-focus" onClick={submit}>Add vendor</button>
    </React.Fragment>}>
      <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <Field label="Vendor name"><TInput required value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></Field>
        <Field label="Industry standard code" hint="Unique code agreed between SETVACO and this vendor"><TInput value={form.code} onChange={e => setForm(f => ({ ...f, code: e.target.value }))} /></Field>
        <div className="mis-grid-2">
          <Field label="Contact person"><TInput value={form.contact} onChange={e => setForm(f => ({ ...f, contact: e.target.value }))} /></Field>
          <Field label="Phone"><TInput value={form.phone} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} /></Field>
        </div>
        <div className="mis-grid-2">
          <Field label="Email"><TInput type="email" value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} /></Field>
          <Field label="Additional contact (name, role)"><TInput value={form.altContact} onChange={e => setForm(f => ({ ...f, altContact: e.target.value }))} placeholder="e.g. Jane Doe, Accounts" /></Field>
        </div>
        <Field label="Categories supplied"><TInput value={form.categories} onChange={e => setForm(f => ({ ...f, categories: e.target.value }))} placeholder="e.g. Wear parts, bearings" /></Field>
        <div className="mis-grid-2">
          <Field label="Business certificate"><input type="file" onChange={e => setForm(f => ({ ...f, certificateFile: e.target.files[0] ? e.target.files[0].name : null }))} style={{ fontSize: 12 }} /></Field>
          <Field label=" "><label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginTop: 8 }}><input type="checkbox" checked={form.taxExempt} onChange={e => setForm(f => ({ ...f, taxExempt: e.target.checked }))} /> Tax-exempt vendor</label></Field>
        </div>
      </form>
    </Modal>}
  </div>;
}

function MatchPOCodeTab({ customers, vendors, purchaseOrders, setPurchaseOrders, role, currentUser, logAction, pushNotification }) {
  const canManage = ["admin", "procurement"].includes(role);
  const [code, setCode] = useState("");
  const [poNumber, setPoNumber] = useState("");
  const [match, setMatch] = useState(null);
  function search(e) {
    e.preventDefault();
    const needle = code.trim().toUpperCase();
    if (!needle) { setMatch(null); return; }
    const customer = customers.find(c => c.poCode && c.poCode.toUpperCase() === needle);
    if (customer) { setMatch({ kind: "customer", record: customer }); return; }
    const vendor = vendors.find(v => v.code && v.code.toUpperCase() === needle);
    if (vendor) { setMatch({ kind: "vendor", record: vendor }); return; }
    setMatch({ kind: "none" });
  }
  function submitOrder() {
    if (!match || match.kind !== "customer") return;
    const po = { id: uid("PO", purchaseOrders, 4), vendorId: null, customerId: match.record.id, externalPoNumber: poNumber || code, lines: [], status: "Ordered", date: todayISO(), expected: "", source: "matched" };
    setPurchaseOrders(ps => [po, ...ps]);
    logAction(currentUser, `Matched industry code ${code} to ${match.record.name} and submitted order ${po.id} (external PO ${poNumber || "n/a"})`, "Purchasing");
    pushNotification("po", `Order ${po.id} submitted for ${match.record.name} from matched PO code ${code}`);
    setCode(""); setPoNumber(""); setMatch(null);
  }
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    <p style={{ fontSize: 12, color: "var(--text-tertiary)", maxWidth: 640 }}>External customers issue purchase orders bearing an industry-standard code unique between SETVACO and that client. Enter the code from the incoming PO to identify the client (or vendor) it belongs to, then submit the order.</p>
    <form onSubmit={search} className="mis-panel" style={{ borderRadius: 16, padding: 16, display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
      <Field label="Industry standard code"><TInput required value={code} onChange={e => setCode(e.target.value)} placeholder="e.g. CHK-001" style={{ width: 200 }} /></Field>
      <Field label="External PO number (optional)"><TInput value={poNumber} onChange={e => setPoNumber(e.target.value)} placeholder="Customer's own PO #" style={{ width: 200 }} /></Field>
      <button type="submit" className="mis-btn-primary mis-focus"><Search size={14} /> Match code</button>
    </form>
    {match && match.kind === "customer" && <div className="mis-panel" style={{ borderRadius: 16, padding: 16, display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}><Check size={16} style={{ color: "var(--safe)" }} /><b>Matched customer: {match.record.name}</b></div>
      <div className="mis-kv"><span>Country</span><b>{match.record.country}</b></div>
      <div className="mis-kv"><span>Contact</span><b>{match.record.contactPerson} · {match.record.email}</b></div>
      {canManage && <button type="button" className="mis-btn-primary mis-focus" style={{ alignSelf: "flex-start" }} onClick={submitOrder}><Plus size={14} /> Submit order for this customer</button>}
    </div>}
    {match && match.kind === "vendor" && <div className="mis-panel" style={{ borderRadius: 16, padding: 16, display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}><Check size={16} style={{ color: "var(--safe)" }} /><b>This code belongs to vendor: {match.record.name}</b></div>
      <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>Raise an internal purchase order to this vendor from the Internal Purchase Orders tab.</p>
    </div>}
    {match && match.kind === "none" && <div className="mis-panel" style={{ borderRadius: 16, padding: 16 }}><span style={{ color: "var(--vital)", fontSize: 13 }}>No customer or vendor found with that code.</span></div>}
  </div>;
}

function Purchasing({ role, currentUser, purchaseOrders, setPurchaseOrders, vendors, setVendors, items, setItems, customers, logAction, pushNotification }) {
  const subTabsAll = [
    { key: "pos", label: "Internal Purchase Orders" },
    { key: "vendors", label: "Vendors" },
    { key: "match", label: "Match PO Code" }
  ];
  const [sub, setSub] = useState("pos");
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    <Tabs tabs={subTabsAll} active={sub} onChange={setSub} />
    {sub === "pos" && <InternalPOsTab purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} vendors={vendors} customers={customers} items={items} setItems={setItems} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} />}
    {sub === "vendors" && <VendorsTab vendors={vendors} setVendors={setVendors} role={role} currentUser={currentUser} logAction={logAction} />}
    {sub === "match" && <MatchPOCodeTab customers={customers} vendors={vendors} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} />}
  </div>;
}

function ContactsEditor({ contacts, setContacts }) {
  function update(idx, patch) { setContacts(cs => cs.map((c, i) => i === idx ? { ...c, ...patch } : c)); }
  function remove(idx) { setContacts(cs => cs.filter((_, i) => i !== idx)); }
  function add() { setContacts(cs => [...cs, { name: "", role: "", email: "", phone: "" }]); }
  return <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
    {contacts.map((c, idx) => <div key={idx} className="mis-panel-alt" style={{ borderRadius: 10, padding: 10, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
      <Field label="Name"><TInput value={c.name} onChange={e => update(idx, { name: e.target.value })} style={{ minWidth: 150 }} /></Field>
      <Field label="Role"><TInput value={c.role} onChange={e => update(idx, { role: e.target.value })} style={{ minWidth: 130 }} /></Field>
      <Field label="Email"><TInput type="email" value={c.email} onChange={e => update(idx, { email: e.target.value })} style={{ minWidth: 170 }} /></Field>
      <Field label="Phone"><TInput value={c.phone} onChange={e => update(idx, { phone: e.target.value })} style={{ minWidth: 140 }} /></Field>
      <button type="button" className="mis-btn-danger" onClick={() => remove(idx)}><Trash2 size={12} /></button>
    </div>)}
    <button type="button" className="mis-btn-ghost mis-focus" style={{ alignSelf: "flex-start" }} onClick={add}><Plus size={14} /> Add another contact</button>
  </div>;
}

function CreateCustomerModal({ customers, setCustomers, currentUser, logAction, onClose }) {
  const [form, setForm] = useState({ name: "", country: "", address: "", email: "", phone: "", contactPerson: "", contactAddress: "", companyDetails: "", poCode: "", tier: "Standard", creditLimit: 0, taxExempt: false });
  const [contacts, setContacts] = useState([]);
  function submit(e) {
    e.preventDefault();
    if (!form.name.trim()) return;
    const customer = { id: uid("C", customers, 2), ...form, creditLimit: Number(form.creditLimit) || 0, outstanding: 0, contacts };
    setCustomers(cs => [...cs, customer]);
    logAction(currentUser, `Created customer record for ${customer.name}`, "Customers");
    onClose();
  }
  return <Modal title="Create customer" wide onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>Cancel</button>
    <button type="button" className="mis-btn-primary mis-focus" onClick={submit}><UserPlus size={14} /> Create customer</button>
  </React.Fragment>}>
    <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div className="mis-grid-2">
        <Field label="Customer / company name"><TInput required value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></Field>
        <Field label="Country"><TInput required value={form.country} onChange={e => setForm(f => ({ ...f, country: e.target.value }))} /></Field>
      </div>
      <Field label="Address"><TInput value={form.address} onChange={e => setForm(f => ({ ...f, address: e.target.value }))} /></Field>
      <div className="mis-grid-2">
        <Field label="Company email"><TInput type="email" value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} /></Field>
        <Field label="Phone number"><TInput value={form.phone} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} /></Field>
      </div>
      <div className="mis-grid-2">
        <Field label="Primary contact person" hint="Individual representing the customer"><TInput value={form.contactPerson} onChange={e => setForm(f => ({ ...f, contactPerson: e.target.value }))} /></Field>
        <Field label="Contact address"><TInput value={form.contactAddress} onChange={e => setForm(f => ({ ...f, contactAddress: e.target.value }))} /></Field>
      </div>
      <Field label="Company details" hint="Registration / TIN, business type, etc."><TArea value={form.companyDetails} onChange={e => setForm(f => ({ ...f, companyDetails: e.target.value }))} /></Field>
      <div className="mis-grid-2">
        <Field label="Industry PO code" hint="Unique code used to identify this client's purchase orders"><TInput value={form.poCode} onChange={e => setForm(f => ({ ...f, poCode: e.target.value }))} /></Field>
        <Field label="Credit limit (GH₵)"><TInput type="number" min="0" value={form.creditLimit} onChange={e => setForm(f => ({ ...f, creditLimit: e.target.value }))} /></Field>
      </div>
      <div className="mis-grid-2">
        <Field label="Tier"><TSelect value={form.tier} onChange={e => setForm(f => ({ ...f, tier: e.target.value }))}><option>Standard</option><option>Silver</option><option>Gold</option></TSelect></Field>
        <Field label=" "><label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginTop: 8 }}><input type="checkbox" checked={form.taxExempt} onChange={e => setForm(f => ({ ...f, taxExempt: e.target.checked }))} /> Tax-exempt customer</label></Field>
      </div>
      <div className="mis-divider" />
      <Field label="Additional contacts" hint="Add more people from the client's company as needed"><ContactsEditor contacts={contacts} setContacts={setContacts} /></Field>
    </form>
  </Modal>;
}

function CustomerDetailDrawer({ customer, quotations, invoices, auditLog, onClose }) {
  const related = [...quotations, ...invoices].filter(d => d.customerId === customer.id).sort((a, b) => b.date.localeCompare(a.date));
  const history = auditLog.filter(a => a.action.includes(customer.name));
  return <Drawer title={customer.name} onClose={onClose}>
    <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 12 }}>
      <div className="mis-kv"><span>Country</span><b>{customer.country}</b></div>
      <div className="mis-kv"><span>Address</span><b>{customer.address}</b></div>
      <div className="mis-kv"><span>Email</span><b>{customer.email}</b></div>
      <div className="mis-kv"><span>Phone</span><b>{customer.phone}</b></div>
      <div className="mis-kv"><span>Contact person</span><b>{customer.contactPerson}</b></div>
      <div className="mis-kv"><span>PO code</span><b className="mis-mono">{customer.poCode || "—"}</b></div>
      <div className="mis-kv"><span>Tax status</span><b>{customer.taxExempt ? "Exempt" : "Standard"}</b></div>
      <div className="mis-kv"><span>Company details</span><b>{customer.companyDetails}</b></div>
    </div>
    {customer.contacts && customer.contacts.length > 0 && <React.Fragment>
      <div className="mis-divider" />
      <div style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "12px 0 8px", textTransform: "uppercase" }}>Additional contacts</div>
      {customer.contacts.map((c, i) => <div key={i} style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 6 }}>{c.name} — {c.role}<br />{c.email} · {c.phone}</div>)}
    </React.Fragment>}
    <div className="mis-divider" />
    <div style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "12px 0 8px", textTransform: "uppercase" }}>Quotations & invoices</div>
    {related.length === 0 && <div className="mis-empty">No quotations or invoices yet.</div>}
    {related.map(d => { const cs = statusColor(d.status); return <div key={d.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "6px 0", borderBottom: "1px solid var(--border-soft)" }}>
      <span>{d.id}</span><Badge color={cs[0]} soft={cs[1]}>{d.status}</Badge>
    </div>; })}
    <div className="mis-divider" />
    <div style={{ fontSize: 11, color: "var(--text-tertiary)", margin: "12px 0 8px", textTransform: "uppercase" }}>Activity</div>
    {history.length === 0 && <div className="mis-empty">No recorded activity yet.</div>}
    {history.map(a => <div key={a.id} style={{ padding: "6px 0", borderBottom: "1px solid var(--border-soft)" }}>
      <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{a.action}</div>
      <div style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{a.user} · {fmtDateTime(a.ts)}</div>
    </div>)}
  </Drawer>;
}

function Customers({ role, currentUser, customers, setCustomers, quotations, invoices, auditLog, logAction }) {
  const canCreate = ["admin", "sales"].includes(role);
  const [showCreate, setShowCreate] = useState(false);
  const [detail, setDetail] = useState(null);
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    <div style={{ display: "flex", justifyContent: "flex-end" }}>
      {canCreate && <button type="button" className="mis-btn-primary mis-focus" onClick={() => setShowCreate(true)}><UserPlus size={14} /> Create customer</button>}
    </div>
    <DataTable columns={[
      { header: "Customer", render: c => <button type="button" className="mis-link-btn" style={{ color: "var(--text-primary)", textDecoration: "none", fontSize: 13 }} onClick={() => setDetail(c)}>{c.name}</button> },
      { header: "Country", render: c => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{c.country}</span> },
      { header: "Contact", render: c => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{c.contactPerson}</span> },
      { header: "Email", render: c => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{c.email}</span> },
      { header: "Tier", render: c => <Badge color={c.tier === "Gold" ? "var(--ore)" : c.tier === "Silver" ? "var(--info)" : "var(--text-secondary)"} soft={c.tier === "Gold" ? "var(--ore-soft)" : c.tier === "Silver" ? "var(--info-soft)" : "var(--panel-alt)"}>{c.tier}</Badge> },
      { header: "Credit Limit", render: c => <span className="mis-mono" style={{ fontSize: 12 }}>{fmtGHS(c.creditLimit)}</span> },
      { header: "Outstanding", render: c => { const pct = Math.round((c.outstanding / Math.max(c.creditLimit, 1)) * 100); const risky = pct > 75; return <span className="mis-mono" style={{ fontSize: 12, color: risky ? "var(--vital)" : "var(--text-secondary)" }}>{fmtGHS(c.outstanding)} ({pct}%)</span>; } }
    ]} rows={customers} rowKey={c => c.id} empty="No customers yet." />
    {showCreate && <CreateCustomerModal customers={customers} setCustomers={setCustomers} currentUser={currentUser} logAction={logAction} onClose={() => setShowCreate(false)} />}
    {detail && <CustomerDetailDrawer customer={detail} quotations={quotations} invoices={invoices} auditLog={auditLog} onClose={() => setDetail(null)} />}
  </div>;
}
