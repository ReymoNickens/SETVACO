function ContactsEditor({ contacts, setContacts, lang }) {
  function update(idx, patch) { setContacts(cs => cs.map((c, i) => i === idx ? { ...c, ...patch } : c)); }
  function remove(idx) { setContacts(cs => cs.filter((_, i) => i !== idx)); }
  function add() { setContacts(cs => [...cs, { name: "", role: "", email: "", phone: "" }]); }
  return <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
    {contacts.map((c, idx) => <div key={idx} className="mis-panel-alt" style={{ borderRadius: 2, padding: 10, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
      <Field label={t(lang, "common.name")}><TInput value={c.name} onChange={e => update(idx, { name: e.target.value })} style={{ minWidth: 150 }} /></Field>
      <Field label={t(lang, "cust.role")}><TInput value={c.role} onChange={e => update(idx, { role: e.target.value })} style={{ minWidth: 130 }} /></Field>
      <Field label={t(lang, "common.email")}><TInput type="email" value={c.email} onChange={e => update(idx, { email: e.target.value })} style={{ minWidth: 170 }} /></Field>
      <Field label={t(lang, "common.phone")}><TInput value={c.phone} onChange={e => update(idx, { phone: e.target.value })} style={{ minWidth: 140 }} /></Field>
      <button type="button" className="mis-btn-danger" onClick={() => remove(idx)}><Trash2 size={12} /></button>
    </div>)}
    <button type="button" className="mis-btn-ghost mis-focus" style={{ alignSelf: "flex-start" }} onClick={add}><Plus size={14} /> {t(lang, "cust.addAnotherContact")}</button>
  </div>;
}

function CreateCustomerModal({ customers, setCustomers, countries, reloadCustomers, priceBooks, currentUser, logAction, onClose, lang }) {
  const standardBook = priceBooks.find(b => b.isStandard);
  const [form, setForm] = useState({ name: "", countryCode: "", address: "", email: "", phone: "", contactPerson: "", contactAddress: "", companyDetails: "", poCode: "", tier: "Standard", creditLimit: 0, taxExempt: false, priceBookId: standardBook ? standardBook.id : "" });
  const [contacts, setContacts] = useState([]);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  async function submit(e) {
    e.preventDefault();
    if (!form.name.trim() || busy) return;
    setBusy(true);
    setError("");
    try {
      const { data: created, error: insertError } = await window.sb.from("customers")
        .insert(customerToDbFields(form))
        .select()
        .single();
      if (insertError) throw insertError;
      if (contacts.length) {
        const { error: contactsError } = await window.sb.from("customer_contacts")
          .insert(contacts.map(c => ({ customer_id: created.id, name: c.name, role: c.role || null, email: c.email || null, phone: c.phone || null })));
        if (contactsError) throw contactsError;
      }
      await reloadCustomers();
      logAction(currentUser, `Created customer record for ${form.name}`, "Customers");
      onClose();
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  }
  return <Modal title={t(lang, "cust.createCustomer")} wide onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>{t(lang, "common.cancel")}</button>
    <button type="button" disabled={busy} className="mis-btn-primary mis-focus" onClick={submit}><UserPlus size={14} /> {busy ? t(lang, "login.loading") : t(lang, "cust.createCustomer")}</button>
  </React.Fragment>}>
    <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {error && <p style={{ fontSize: 12, color: "var(--vital)" }}>{error}</p>}
      <div className="mis-grid-2">
        <Field label={t(lang, "cust.customerCompanyName")}><TInput required value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></Field>
        <Field label={t(lang, "common.country")}><TSelect required value={form.countryCode} onChange={e => setForm(f => ({ ...f, countryCode: e.target.value }))}>
          <option value="">—</option>
          {countries.map(c => <option key={c.code} value={c.code}>{c.name}</option>)}
        </TSelect></Field>
      </div>
      <Field label={t(lang, "common.address")}><TInput value={form.address} onChange={e => setForm(f => ({ ...f, address: e.target.value }))} /></Field>
      <div className="mis-grid-2">
        <Field label={t(lang, "cust.companyEmail")}><TInput type="email" value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} /></Field>
        <Field label={t(lang, "cust.phoneNumber")}><TInput value={form.phone} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} /></Field>
      </div>
      <div className="mis-grid-2">
        <Field label={t(lang, "cust.primaryContact")} hint={t(lang, "cust.primaryContactHint")}><TInput value={form.contactPerson} onChange={e => setForm(f => ({ ...f, contactPerson: e.target.value }))} /></Field>
        <Field label={t(lang, "cust.contactAddress")}><TInput value={form.contactAddress} onChange={e => setForm(f => ({ ...f, contactAddress: e.target.value }))} /></Field>
      </div>
      <Field label={t(lang, "cust.companyDetails")} hint={t(lang, "cust.companyDetailsHint")}><TArea value={form.companyDetails} onChange={e => setForm(f => ({ ...f, companyDetails: e.target.value }))} /></Field>
      <div className="mis-grid-2">
        <Field label={t(lang, "cust.industryPoCode")} hint={t(lang, "cust.industryPoCodeHint")}><TInput value={form.poCode} onChange={e => setForm(f => ({ ...f, poCode: e.target.value }))} /></Field>
        <Field label={t(lang, "cust.creditLimit")}><TInput type="number" min="0" value={form.creditLimit} onChange={e => setForm(f => ({ ...f, creditLimit: e.target.value }))} /></Field>
      </div>
      <div className="mis-grid-2">
        <Field label={t(lang, "cust.tier")}><TSelect value={form.tier} onChange={e => setForm(f => ({ ...f, tier: e.target.value }))}><option value="Standard">{t(lang, "cust.tierStandard")}</option><option value="Silver">{t(lang, "cust.tierSilver")}</option><option value="Gold">{t(lang, "cust.tierGold")}</option></TSelect></Field>
        <Field label={t(lang, "pb.priceBook")}><TSelect value={form.priceBookId} onChange={e => setForm(f => ({ ...f, priceBookId: e.target.value }))}>{priceBooks.map(b => <option key={b.id} value={b.id}>{b.name}{b.isStandard ? ` (${t(lang, "pb.standard")})` : ""}</option>)}</TSelect></Field>
      </div>
      <Field label=" "><label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}><input type="checkbox" checked={form.taxExempt} onChange={e => setForm(f => ({ ...f, taxExempt: e.target.checked }))} /> {t(lang, "cust.taxExemptCustomer")}</label></Field>
      <div className="mis-divider" />
      <Field label={t(lang, "cust.additionalContacts")} hint={t(lang, "cust.additionalContactsHint")}><ContactsEditor contacts={contacts} setContacts={setContacts} lang={lang} /></Field>
    </form>
  </Modal>;
}

// ---------------------------------------------------------------------------
// REPORTS — a lightweight, user-buildable alternative to a fixed dashboard:
// pick a source + group-by field already present on that record type +
// count/sum, no cross-object joins. Deliberately not a full report/BI
// engine — see docs/architecture.md.
// ---------------------------------------------------------------------------
const REPORT_GROUP_FIELDS = {
  quotations: ["status", "type"],
  invoices: ["status", "type"],
  serviceJobs: ["status", "type"],
  purchaseOrders: ["status", "source"],
  items: ["type", "category", "branch"],
  customers: ["tier", "country"]
};
const REPORT_METRICS = {
  quotations: ["count", "sum_total"],
  invoices: ["count", "sum_total"],
  serviceJobs: ["count"],
  purchaseOrders: ["count"],
  items: ["count", "sum_qty", "sum_stockvalue"],
  customers: ["count", "sum_outstanding", "sum_creditLimit"]
};
const REPORT_CURRENCY_METRICS = ["sum_total", "sum_stockvalue", "sum_outstanding", "sum_creditLimit"];
function computeReport(rows, groupBy, metric) {
  const buckets = {};
  rows.forEach(r => {
    const raw = r[groupBy];
    const key = (raw === undefined || raw === null || raw === "") ? "—" : String(raw);
    if (buckets[key] == null) buckets[key] = 0;
    if (metric === "count") buckets[key] += 1;
    else if (metric === "sum_total") buckets[key] += (r.total ?? r.subtotal ?? 0);
    else if (metric === "sum_qty") buckets[key] += (r.qty ?? 0);
    else if (metric === "sum_stockvalue") buckets[key] += (r.qty ?? 0) * (r.cost ?? 0);
    else if (metric === "sum_outstanding") buckets[key] += (r.outstanding ?? 0);
    else if (metric === "sum_creditLimit") buckets[key] += (r.creditLimit ?? 0);
  });
  return Object.entries(buckets).map(([key, value]) => ({ key, value })).sort((a, b) => b.value - a.value);
}
function ReportsTab({ quotations, invoices, serviceJobs, purchaseOrders, items, customers, savedReports, setSavedReports, currentUser, logAction, lang }) {
  const DATA = { quotations, invoices, serviceJobs, purchaseOrders, items, customers };
  const [source, setSource] = useState("quotations");
  const [groupBy, setGroupBy] = useState(REPORT_GROUP_FIELDS.quotations[0]);
  const [metric, setMetric] = useState(REPORT_METRICS.quotations[0]);
  const [reportName, setReportName] = useState("");

  function changeSource(next) {
    setSource(next);
    setGroupBy(REPORT_GROUP_FIELDS[next][0]);
    setMetric(REPORT_METRICS[next][0]);
  }
  const rows = DATA[source] || [];
  const results = useMemo(() => computeReport(rows, groupBy, metric), [rows, groupBy, metric]);
  const isCurrency = REPORT_CURRENCY_METRICS.includes(metric);
  const maxValue = Math.max(1, ...results.map(r => r.value));

  function saveReport() {
    if (!reportName.trim()) return;
    const report = { id: uid("RPT", savedReports, 3), name: reportName.trim(), source, groupBy, metric };
    setSavedReports(rs => [report, ...rs]);
    logAction(currentUser, `Saved report "${report.name}"`, "Reports");
    setReportName("");
  }
  function loadReport(r) { setSource(r.source); setGroupBy(r.groupBy); setMetric(r.metric); }
  function deleteReport(id) { setSavedReports(rs => rs.filter(r => r.id !== id)); }

  return <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
    <div className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", flexDirection: "column", gap: 14 }}>
      <h3 className="mis-eyebrow">{t(lang, "report.builder")}</h3>
      <div className="mis-grid-3">
        <Field label={t(lang, "report.source")}>
          <TSelect value={source} onChange={e => changeSource(e.target.value)}>
            {Object.keys(REPORT_GROUP_FIELDS).map(s => <option key={s} value={s}>{t(lang, "report.source." + s)}</option>)}
          </TSelect>
        </Field>
        <Field label={t(lang, "report.groupBy")}>
          <TSelect value={groupBy} onChange={e => setGroupBy(e.target.value)}>
            {REPORT_GROUP_FIELDS[source].map(f => <option key={f} value={f}>{t(lang, "report.field." + f)}</option>)}
          </TSelect>
        </Field>
        <Field label={t(lang, "report.metric")}>
          <TSelect value={metric} onChange={e => setMetric(e.target.value)}>
            {REPORT_METRICS[source].map(m => <option key={m} value={m}>{t(lang, "report.metric." + m)}</option>)}
          </TSelect>
        </Field>
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <TInput value={reportName} onChange={e => setReportName(e.target.value)} placeholder={t(lang, "report.namePlaceholder")} />
        <button type="button" className="mis-btn-ghost mis-focus" onClick={saveReport}><Plus size={14} /> {t(lang, "report.saveReport")}</button>
      </div>
    </div>
    {savedReports.length > 0 && <div className="mis-panel" style={{ borderRadius: 2, padding: 16 }}>
      <h3 className="mis-eyebrow" style={{ marginBottom: 14 }}>{t(lang, "report.savedReports")}</h3>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        {savedReports.map(r => <div key={r.id} className="mis-panel-alt" style={{ borderRadius: 999, padding: "6px 6px 6px 12px", display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}>
          <button type="button" className="mis-link-btn" onClick={() => loadReport(r)}>{r.name}</button>
          <button type="button" className="mis-btn-ghost mis-focus" style={{ padding: "2px 6px" }} onClick={() => deleteReport(r.id)}><X size={11} /></button>
        </div>)}
      </div>
    </div>}
    <div className="mis-panel" style={{ borderRadius: 2, padding: 16 }}>
      <h3 className="mis-eyebrow" style={{ marginBottom: 14 }}>{tf(lang, "report.resultsFor", { groupBy: t(lang, "report.field." + groupBy) })}</h3>
      {results.length === 0 && <div className="mis-empty">{t(lang, "report.noData")}</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {results.map(r => <div key={r.key}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}>
            <span style={{ color: "var(--text-primary)" }}>{r.key}</span>
            <span className="mis-mono" style={{ color: "var(--text-secondary)" }}>{isCurrency ? fmtGHS(r.value) : r.value}</span>
          </div>
          <div style={{ width: "100%", borderRadius: 999, height: 8, background: "var(--panel-alt)" }}>
            <div style={{ height: 8, borderRadius: 999, width: `${Math.round((r.value / maxValue) * 100)}%`, background: "var(--ore)" }} />
          </div>
        </div>)}
      </div>
    </div>
  </div>;
}

    if (invokeError || (data && data.error)) {
      setError((data && data.error) || invokeError.message);
      return;
    }
    await onCreated();
    onClose();
  }
  return <Modal title={t(lang, "ua.createUserAccountTitle")} onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>{t(lang, "common.cancel")}</button>
    <button type="button" className="mis-btn-primary mis-focus" disabled={busy} onClick={submit}><UserPlus size={14} /> {busy ? t(lang, "common.saving") : t(lang, "ua.createAccountBtn")}</button>
  </React.Fragment>}>

      {error && <p style={{ fontSize: 12, color: "var(--vital)" }}>{error}</p>}
      <Field label={t(lang, "ua.fullName")}><TInput required value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></Field>
      <div className="mis-grid-2">

// Price books: the Standard book is a pass-through to each item's own sell
// price (no entries to manage). Custom books hold per-item price overrides;
// a customer assigned to a custom book gets that book's price when present,
// falling back to Standard (i.e. item.sell) for any item without an entry.
function PriceBooksPanel({ priceBooks, setPriceBooks, priceBookEntries, setPriceBookEntries, items, currentUser, logAction, lang }) {
  const [selectedBookId, setSelectedBookId] = useState((priceBooks.find(b => !b.isStandard) || priceBooks[0] || {}).id || "");
  const [newBookName, setNewBookName] = useState("");
  const [entryForm, setEntryForm] = useState({ itemId: "", price: "" });
  const selectedBook = priceBooks.find(b => b.id === selectedBookId);
  const entries = priceBookEntries.filter(e => e.priceBookId === selectedBookId);
  function createBook() {
    if (!newBookName.trim()) return;
    const book = { id: uid("PB", priceBooks, 4), name: newBookName.trim(), isStandard: false };
    setPriceBooks(bs => [...bs, book]);
    logAction(currentUser, `Created price book "${book.name}"`, "Price Books");
    setNewBookName("");
    setSelectedBookId(book.id);
  }
  function setEntry() {
    const item = items.find(i => i.id === entryForm.itemId);
    if (!item || !entryForm.price) return;
    setPriceBookEntries(es => {
      const existing = es.find(e => e.priceBookId === selectedBookId && e.itemId === item.id);
      if (existing) return es.map(e => e === existing ? { ...e, price: Number(entryForm.price) } : e);
      return [{ id: uid("PBE", es, 4), priceBookId: selectedBookId, itemId: item.id, price: Number(entryForm.price) }, ...es];
    });
    logAction(currentUser, `Set ${item.name} to ${fmtGHS(entryForm.price)} in price book "${selectedBook.name}"`, "Price Books");
    setEntryForm({ itemId: "", price: "" });
  }
  function removeEntry(id) { setPriceBookEntries(es => es.filter(e => e.id !== id)); }
  return <div className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", flexDirection: "column", gap: 14 }}>
    <h3 className="mis-eyebrow">{t(lang, "pb.priceBooks")}</h3>
    <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{t(lang, "pb.priceBooksDesc")}</p>
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
      {priceBooks.map(b => <button key={b.id} type="button" className={b.id === selectedBookId ? "mis-btn-primary mis-focus" : "mis-btn-ghost mis-focus"} onClick={() => setSelectedBookId(b.id)}>{b.name}{b.isStandard ? ` (${t(lang, "pb.standard")})` : ""}</button>)}
    </div>
    <div style={{ display: "flex", gap: 8 }}>
      <TInput value={newBookName} onChange={e => setNewBookName(e.target.value)} placeholder={t(lang, "pb.newBookPlaceholder")} />
      <button type="button" className="mis-btn-ghost mis-focus" onClick={createBook}><Plus size={14} /> {t(lang, "pb.createBook")}</button>
    </div>
    {selectedBook && (selectedBook.isStandard ? <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{t(lang, "pb.standardHint")}</p> : <React.Fragment>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
        <Field label={t(lang, "pb.item")}>
          <TSelect value={entryForm.itemId} onChange={e => setEntryForm(f => ({ ...f, itemId: e.target.value }))} style={{ minWidth: 220 }}>
            <option value="">{t(lang, "lq.selectFromInventory")}</option>
            {items.map(it => <option key={it.id} value={it.id}>{it.name} — {t(lang, "pb.standardPrice")}: {fmtGHS(it.sell)}</option>)}
          </TSelect>
        </Field>
        <Field label={t(lang, "pb.overridePrice")}><TInput type="number" min="0" step="0.01" value={entryForm.price} onChange={e => setEntryForm(f => ({ ...f, price: e.target.value }))} style={{ width: 140 }} /></Field>
        <button type="button" className="mis-btn-primary mis-focus" onClick={setEntry}><Plus size={14} /> {t(lang, "pb.setPrice")}</button>
      </div>
      <DataTable columns={[
        { header: t(lang, "pb.item"), render: e => { const it = items.find(i => i.id === e.itemId); return <span style={{ color: "var(--text-primary)" }}>{it ? it.name : e.itemId}</span>; } },
        { header: t(lang, "pb.standardPrice"), render: e => { const it = items.find(i => i.id === e.itemId); return <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{fmtGHS(it ? it.sell : 0)}</span>; } },
        { header: t(lang, "pb.overridePrice"), render: e => <span className="mis-mono" style={{ color: "var(--safe)" }}>{fmtGHS(e.price)}</span> },
        { header: t(lang, "common.actions"), render: e => <button type="button" className="mis-link-btn" onClick={() => removeEntry(e.id)}>{t(lang, "pb.remove")}</button> }
      ]} rows={entries} rowKey={e => e.id} empty={t(lang, "pb.noOverridesYet")} />
    </React.Fragment>)}
  </div>;
}

// STAFF ACTIVITY SHEET — the full-screen "what has this person been up to"
// view. Two small hand-rolled SVG charts (this app has no charting library
// and none of these are complex enough to need one) plus the same detail
// list StaffActivityTab already renders, scoped to one person.

// Daily activity, last 14 days. A single hue (magnitude, not identity) so
// there's no categorical-color-safety question to validate — bar height is
// the only encoding. Thin bars, rounded data-ends, 2px gap between bars,
// per-bar hover tooltip.
function ActivityByDayChart({ entries, lang }) {
  const [hover, setHover] = useState(null);
  const days = 14;
  const todayMs = new Date(todayISO()).getTime();
  const buckets = Array.from({ length: days }, (_, i) => {
    const dateMs = todayMs - (days - 1 - i) * 86400000;
    const date = new Date(dateMs).toISOString().slice(0, 10);
    return { date, count: 0 };
  });
  entries.forEach(a => {
    const d = String(a.ts || "").slice(0, 10);
    const b = buckets.find(x => x.date === d);
    if (b) b.count++;
  });
  const max = Math.max(1, ...buckets.map(b => b.count));
  const w = 100, h = 44, gap = 0.6, barW = w / days - gap;
  return <div style={{ position: "relative" }}>
    <svg viewBox={`0 0 ${w} ${h + 14}`} width="100%" height={130} preserveAspectRatio="none" style={{ overflow: "visible" }}>
      <line x1="0" y1={h} x2={w} y2={h} stroke="var(--border)" strokeWidth="0.4" />
      {buckets.map((b, i) => {
        const barH = (b.count / max) * (h - 4);
        const x = i * (w / days) + gap / 2;
        const y = h - barH;
        const isHover = hover === i;
        return <g key={b.date}
          onMouseEnter={() => setHover(i)}
          onMouseLeave={() => setHover(hv => hv === i ? null : hv)}
          style={{ cursor: "default" }}>
          <rect x={x} y={0} width={barW} height={h} fill="transparent" />
          <rect x={x} y={y} width={barW} height={Math.max(barH, 1)} rx={Math.min(barW / 2, 1.4)}
            fill={isHover ? "var(--ore)" : "var(--ore)"} opacity={b.count === 0 ? 0.12 : (isHover ? 1 : 0.72)} />
          {(i === 0 || i === days - 1 || i % 7 === 0) && <text x={x + barW / 2} y={h + 9} fontSize="3" textAnchor="middle" fill="var(--text-tertiary)">
            {new Date(b.date).toLocaleDateString(undefined, { day: "2-digit", month: "2-digit" })}
          </text>}
        </g>;
      })}
    </svg>
    {hover !== null && <div style={{
      position: "absolute", pointerEvents: "none",
      left: `${(hover + 0.5) / days * 100}%`, top: 0, transform: "translate(-50%, -100%)",
      background: "var(--ink)", color: "#fff", fontSize: 11, padding: "4px 8px", borderRadius: 2, whiteSpace: "nowrap", zIndex: 5
    }}>
      <b>{buckets[hover].count}</b> {tf(lang, "sa.actionsOn", { date: fmtDateTime(buckets[hover].date).split(",")[0] })}
    </div>}
  </div>;
}

// By-module breakdown — horizontal bars, direct-labeled (module name +
// count sit next to every bar), one hue. Identity here is carried by the
// text label, never by color, so there's nothing to color-validate.
function ModuleBreakdownChart({ entries, lang }) {
  const counts = {};
  entries.forEach(a => { counts[a.module || "—"] = (counts[a.module || "—"] || 0) + 1; });
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...rows.map(r => r[1]));
  if (rows.length === 0) return <div className="mis-empty">{t(lang, "dash.noActivityYet")}</div>;
  return <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
    {rows.map(([module, count]) => <div key={module} style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <span style={{ fontSize: 12, color: "var(--text-secondary)", width: 120, flexShrink: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{module}</span>
      <div style={{ flex: 1, height: 8, borderRadius: 4, background: "var(--panel-alt)", overflow: "hidden" }}>
        <div style={{ width: `${(count / max) * 100}%`, height: "100%", borderRadius: 4, background: "var(--ore)" }} />
      </div>
      <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-primary)", width: 24, textAlign: "right", flexShrink: 0 }}>{count}</span>
    </div>)}
  </div>;
}

        </div>
        <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 2 }}>{a.module}</div>

          <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{c.note}</div>

function CompanyFinancials({ items, quotations, customers, lang }) {
  const stockValue = items.reduce((s, i) => s + i.qty * i.cost, 0);
  const weightedPipeline = quotations.filter(q => q.status !== "Rejected").reduce((sum, q) => sum + (q.total ?? q.subtotal ?? 0) * (FORECAST_WEIGHTS[q.status] ?? 0), 0);
  const totalOutstanding = customers.reduce((s, c) => s + (c.outstanding || 0), 0);
  const grossMargin = items.reduce((s, i) => s + i.qty * (i.sell - i.cost), 0);
  return <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
    <div className="mis-eyebrow">{t(lang, "fin.directorOnly")}</div>
    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16 }}>
      <StatCard label={t(lang, "fin.totalStockValue")} value={fmtGHS(stockValue)} sub={t(lang, "fin.allBranches")} icon={Package} tint="var(--ore)" soft="var(--ore-soft)" />
      <StatCard label={t(lang, "fin.weightedPipeline")} value={fmtGHS(weightedPipeline)} sub={t(lang, "fin.partsAndEquipment")} icon={ShoppingCart} tint="var(--info)" soft="var(--info-soft)" />
      <StatCard label={t(lang, "fin.customerOutstanding")} value={fmtGHS(totalOutstanding)} sub={t(lang, "fin.totalReceivables")} icon={AlertTriangle} tint="var(--vital)" soft="var(--vital-soft)" />
      <StatCard label={t(lang, "fin.estGrossMargin")} value={fmtGHS(grossMargin)} sub={t(lang, "fin.onCurrentStock")} icon={BarChart3} tint="var(--safe)" soft="var(--safe-soft)" />
    </div>
    <div className="mis-panel" style={{ borderRadius: 2, padding: 16 }}>
      <h3 className="mis-eyebrow" style={{ marginBottom: 14 }}>{t(lang, "fin.marginByPart")}</h3>
      <DataTable columns={[
        { header: t(lang, "inv.part"), render: it => <span style={{ color: "var(--text-primary)" }}>{it.name}</span> },
        { header: t(lang, "fin.costCol"), render: it => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{fmtGHS(it.cost)}</span> },
        { header: t(lang, "fin.sellCol"), render: it => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{fmtGHS(it.sell)}</span> },
        { header: t(lang, "fin.marginPerUnitCol"), render: it => <span className="mis-mono" style={{ fontSize: 12, color: "var(--safe)" }}>{fmtGHS(it.sell - it.cost)}</span> },
        { header: t(lang, "fin.onHandCol"), render: it => <span className="mis-mono">{it.qty}</span> },
        { header: t(lang, "fin.totalMarginCol"), render: it => <span className="mis-mono" style={{ color: "var(--ink)" }}>{fmtGHS(it.qty * (it.sell - it.cost))}</span> }
      ]} rows={items} rowKey={it => it.id} empty={t(lang, "inv.emptyFilter")} />
    </div>
  </div>;
}

function NotificationBell({ notifications, setNotifications, currentUser, lang }) {
  const [open, setOpen] = useState(false);
  const visible = notifications.filter(n => !n.forUser || n.forUser === currentUser);
  const unread = visible.filter(n => !n.read).length;
  function toggle() {
    setOpen(o => { const next = !o; if (next) setNotifications(ns => ns.map(n => (!n.forUser || n.forUser === currentUser) ? { ...n, read: true } : n)); return next; });
  }
  return <div style={{ position: "relative" }}>
    <button type="button" className="mis-btn-ghost mis-focus" style={{ padding: 8, position: "relative" }} onClick={toggle}>
      <Bell size={16} />
      {unread > 0 && <span className="mis-bell-dot" />}
    </button>
    {open && <div className="mis-panel" style={{ position: "absolute", right: 0, top: "calc(100% + 8px)", width: 320, borderRadius: 2, zIndex: 60, maxHeight: 360, overflowY: "auto" }}>
      <div style={{ padding: "10px 14px", borderBottom: "1px solid var(--border-soft)", fontSize: 11, color: "var(--text-tertiary)", textTransform: "uppercase" }}>{t(lang, "nb.notifications")}</div>
      {visible.length === 0 && <div className="mis-empty">{t(lang, "nb.nothingYet")}</div>}
      {visible.map(n => <div key={n.id} style={{ padding: "10px 14px", borderBottom: "1px solid var(--border-soft)" }}>
        <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{n.message}</div>
        <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 2 }}>{fmtDateTime(n.ts)}</div>
      </div>)}
    </div>}
  </div>;
}
function CommandPalette({ open, onClose, allowedNav, setNav, customers, items, quotations, invoices, lang }) {
  const [q, setQ] = useState("");
  const [activeIdx, setActiveIdx] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { if (open) { setQ(""); setActiveIdx(0); setTimeout(() => inputRef.current && inputRef.current.focus(), 20); } }, [open]);
  if (!open) return null;
  const needle = q.trim().toLowerCase();
  const navResults = allowedNav.filter(n => !needle || t(lang, "nav." + n.key).toLowerCase().includes(needle)).map(n => ({ kind: "nav", key: "nav-" + n.key, icon: n.icon, label: t(lang, "nav." + n.key), sub: t(lang, "cmdk.goToModule"), action: () => { setNav(n.key); onClose(); } }));
  const custResults = !needle ? [] : customers.filter(c => c.name.toLowerCase().includes(needle) || c.id.toLowerCase().includes(needle)).slice(0, 4).map(c => ({ kind: "customer", key: "c-" + c.id, icon: Users, label: c.name, sub: tf(lang, "cmdk.customerSub", { country: c.country }), action: () => { setNav("customers"); onClose(); } }));
  const itemResults = !needle ? [] : items.filter(i => i.name.toLowerCase().includes(needle) || i.id.toLowerCase().includes(needle)).slice(0, 4).map(i => ({ kind: "item", key: "i-" + i.id, icon: i.type === "equipment" ? Boxes : Package, label: i.name, sub: tf(lang, "cmdk.itemSub", { id: i.id, qty: i.qty }), action: () => { setNav(i.type === "equipment" ? "equipmentInventory" : "partsInventory"); onClose(); } }));
  const docResults = !needle ? [] : [...quotations, ...invoices].filter(d => d.id.toLowerCase().includes(needle)).slice(0, 4).map(d => ({ kind: "doc", key: "d-" + d.id, icon: FileText, label: d.id, sub: `${d.type} · ${d.status}`, action: () => { setNav("sales"); onClose(); } }));
  const results = [...navResults, ...custResults, ...itemResults, ...docResults].slice(0, 10);
  function onKeyDown(e) {
    if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx(i => Math.min(i + 1, results.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActiveIdx(i => Math.max(i - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); const r = results[activeIdx]; if (r) r.action(); }
    else if (e.key === "Escape") { onClose(); }
  }
  return <div className="mis-cmdk-overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="mis-cmdk" onKeyDown={onKeyDown}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderBottom: "1px solid var(--border-soft)" }}>
        <Search size={16} style={{ color: "var(--text-tertiary)" }} />
        <input ref={inputRef} value={q} onChange={e => { setQ(e.target.value); setActiveIdx(0); }} placeholder={t(lang, "cmdk.placeholder")} style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 14, color: "var(--ink)" }} />
        <span className="mis-kbd">ESC</span>
      </div>
      <div style={{ maxHeight: 360, overflowY: "auto", padding: "6px 0" }}>
        {results.length === 0 && <div className="mis-empty">{t(lang, "cmdk.noMatches")}</div>}
        {results.map((r, i) => { const Ic = r.icon; return <div key={r.key} className={"mis-cmdk-item" + (i === activeIdx ? " active" : "")} onMouseEnter={() => setActiveIdx(i)} onClick={r.action}>
          <Ic size={15} style={{ color: "var(--text-tertiary)", flexShrink: 0 }} />
          <span style={{ flex: 1 }}>{r.label}</span>
          <span style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{r.sub}</span>
        </div>; })}
      </div>
      <div style={{ display: "flex", gap: 10, padding: "8px 16px", borderTop: "1px solid var(--border-soft)", fontSize: 11, color: "var(--text-tertiary)" }}>
        <span><span className="mis-kbd">↑↓</span> {t(lang, "cmdk.navigate")}</span>
        <span><span className="mis-kbd">↵</span> {t(lang, "cmdk.select")}</span>
        <span style={{ marginLeft: "auto" }}><span className="mis-kbd">⌘K</span> {t(lang, "cmdk.toggleHint")}</span>
      </div>
    </div>
  </div>;
}

function Dashboard({ items, quotations, invoices, purchaseOrders, customers, serviceContracts, auditLog, realBranches, role, lang }) {
  const [dashboardBranchFilter, setDashboardBranchFilter] = useState("All");
  const dashboardItems = dashboardBranchFilter === "All" ? items : items.filter(i => i.branch === dashboardBranchFilter);
  const stockValue = dashboardItems.reduce((s, i) => s + i.qty * i.cost, 0);
  const lowStock = dashboardItems.filter(i => i.qty < i.reorder);
  const openQuotes = quotations.filter(q => q.status !== "Invoiced").length;
  const inTransitPOs = purchaseOrders.filter(p => p.status === "Ordered" || p.status === "In Transit").length;
  const recentActivity = auditLog.slice(0, 8);
  const canSeeContracts = ["director", "admin", "service", "finance"].includes(role);
  const expiringContracts = canSeeContracts ? (serviceContracts || []).filter(c => c.status !== "Cancelled" && isContractExpiringSoon(c)) : [];
  const fulfilledPct = Math.round(quotations.filter(q => q.status === "Invoiced").length / Math.max(quotations.length, 1) * 100);
  const healthyPct = Math.round((dashboardItems.length - lowStock.length) / Math.max(dashboardItems.length, 1) * 100);
  return <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{t(lang, "dash.focusOn")}</span>
      <TSelect value={dashboardBranchFilter} onChange={e => setDashboardBranchFilter(e.target.value)} style={{ width: 200 }}>
        <option value="All">{t(lang, "dash.allBranches")}</option>
        {realBranches.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}
      </TSelect>
    </div>
    <div className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", alignItems: "center", gap: 32, flexWrap: "wrap" }}>
      <RingStat pct={healthyPct} color="var(--teal)" label={t(lang, "dash.itemsAboveReorder")} sub={`${dashboardItems.length - lowStock.length} ${t(lang, "dash.of")} ${dashboardItems.length} ${t(lang, "dash.itemsHealthy")}`} big />
      <div style={{ width: 1, alignSelf: "stretch", background: "var(--border)" }} />
      <RingStat pct={fulfilledPct} color="var(--sky)" label={t(lang, "dash.quotationsInvoiced")} sub={`${quotations.filter(q => q.status === "Invoiced").length} ${t(lang, "dash.of")} ${quotations.length} ${t(lang, "dash.quotationsClosed")}`} />
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16 }}>
      <StatCard label={t(lang, "dash.stockValue")} value={fmtGHS(stockValue)} sub={dashboardBranchFilter === "All" ? t(lang, "dash.partsEquipAllBranches") : dashboardBranchFilter} icon={Package} tint="var(--ore)" soft="var(--ore-soft)" />
      <StatCard label={t(lang, "dash.belowReorderPoint")} value={lowStock.length} sub={t(lang, "dash.itemsNeedingReplenishment")} icon={AlertTriangle} tint="var(--vital)" soft="var(--vital-soft)" urgent={lowStock.length > 0} />
      <StatCard label={t(lang, "dash.openQuotations")} value={openQuotes} sub={t(lang, "dash.partsEquipService")} icon={ShoppingCart} tint="var(--caution)" soft="var(--caution-soft)" />
      <StatCard label={t(lang, "dash.posInProgress")} value={inTransitPOs} sub={t(lang, "dash.orderedOrInTransit")} icon={Truck} tint="var(--info)" soft="var(--info-soft)" />
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 16 }}>
      <div className="mis-panel" style={{ borderRadius: 2, padding: 16 }}>
        <h3 className="mis-eyebrow" style={{ marginBottom: 14 }}>{t(lang, "dash.itemsNearestDepletion")}</h3>
        <div style={{ display: "flex", flexDirection: "column" }}>
          {lowStock.slice(0, 8).map(it => <div key={it.id} className="mis-row" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 8px", borderBottom: "1px solid var(--border-soft)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <CoreSample layers={stockLayers(it)} size={30} />
              <div><div style={{ fontSize: 13, color: "var(--text-primary)" }}>{it.name}</div><div className="mis-mono" style={{ fontSize: 11, color: "var(--text-tertiary)", display: "flex", alignItems: "center", gap: 6 }}>{it.brand} · <BranchTag branch={it.branch} /></div></div>
            </div>
            <div style={{ textAlign: "right" }}><div className="mis-mono" style={{ fontSize: 13, color: "var(--vital)" }}>{it.qty} / {it.reorder}</div><div style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{t(lang, "dash.onHandReorder")}</div></div>
          </div>)}
          {lowStock.length === 0 && <p style={{ fontSize: 13, color: "var(--text-tertiary)" }}>{t(lang, "dash.allItemsAboveReorder")}</p>}
        </div>
      </div>
      <div className="mis-panel" style={{ borderRadius: 2, padding: 16 }}>
        <h3 className="mis-eyebrow" style={{ marginBottom: 14 }}>{t(lang, "dash.customerCreditRisk")}</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {customers.map(c => { const pct = Math.round(creditUtilization(c) * 100); const risky = isCreditRisk(c); return <div key={c.id}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4, color: risky ? "var(--vital)" : "var(--text-secondary)" }}><span>{c.name}</span><span className="mis-mono">{pct}%</span></div>
            <div style={{ width: "100%", height: 4, background: "var(--panel-alt)", border: "1px solid var(--border)" }}><div style={{ height: "100%", width: `${Math.min(pct, 100)}%`, background: risky ? "var(--vital)" : "var(--teal)" }} /></div>
          </div>; })}
        </div>
      </div>
    </div>
    {canSeeContracts && expiringContracts.length > 0 && <div className="mis-panel" style={{ borderRadius: 2, padding: 16, borderLeft: "3px solid var(--caution)" }}>
      <h3 className="mis-eyebrow" style={{ marginBottom: 4 }}>{t(lang, "dash.contractsExpiring")}</h3>

        <span style={{ color: "var(--text-primary)" }}>{c.id} · {cust ? cust.name : "—"} <span style={{ color: "var(--text-tertiary)" }}>({c.type})</span></span>
        <span className="mis-mono" style={{ color: "var(--caution)" }}>{c.endDate}</span>
      </div>; })}
    </div>}
    {["director", "admin", "finance"].includes(role) && <div className="mis-panel" style={{ borderRadius: 2, padding: 16 }}>
      <h3 className="mis-eyebrow" style={{ marginBottom: 14 }}>{t(lang, "dash.recentActivity")}</h3>

      </div>)}

}

function LoginScreen({ lang, setLang }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [resetSent, setResetSent] = useState(false);
  const [ghostTimes, setGhostTimes] = useState([]);
  const mosaicColors = ["var(--coral)", "var(--teal)", "var(--sky)", "var(--sky)", "var(--coral)", "var(--teal)", "var(--teal)", "var(--sky)", "var(--coral)"];

  // Two real recent sign-in timestamps (never names/emails — see
  // recent_signin_times() in 20260813000100_recent_signin_times.sql),
  // shown as the register's "already signed today" rows. Hardcoded to the
  // one real tenant for now — there's no subdomain-based tenant routing
  // yet to resolve a company before login (see docs/architecture.md).
  // Fails open to an empty (purely decorative) list on any error.
  useEffect(() => {
    let cancelled = false;
    window.sb.rpc("recent_signin_times", { p_company_slug: "setvaco", p_limit: 2 })
      .then(({ data, error }) => { if (!cancelled && !error && data) setGhostTimes(data.map(r => r.signed_in_at)); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  async function submit(e) {
    e.preventDefault();
    setBusy(true);
    setError("");
    const { error: signInError } = await window.sb.auth.signInWithPassword({ email: email.trim(), password });
    setBusy(false);
    if (signInError) setError(t(lang, "login.invalid"));
  }

  async function forgotPassword() {
    if (!email.trim()) { setError(t(lang, "login.email") + " ?"); return; }
    setBusy(true);
    // Without an explicit redirectTo, Supabase falls back to the project's
    // configured Auth "Site URL" — which doesn't necessarily match wherever
    // this page is actually being served from (e.g. a GitHub Pages PROJECT
    // site lives at <user>.github.io/<repo>/, not the account root). Always
    // point back at exactly this page's own URL instead of trusting that
    // fallback. Still requires this URL to be in Supabase's Redirect URLs
    // allowlist (Dashboard → Authentication → URL Configuration) — Supabase
    // silently falls back to the Site URL again otherwise.
    setError("");
    const { error: resetError } = await window.sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href.split("#")[0] });
    setBusy(false);
    // Previously this result was discarded entirely — a rejected request
    // (e.g. rate-limited) looked identical to a successful one, since
    // resetSent was set unconditionally either way.
    if (resetError) { setError(resetError.message); return; }
    setResetSent(true);
  }

  const todayLabel = new Date().toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
  const nowLabel = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const fmtGhostTime = iso => { try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) { return "—"; } };

  return <div className="mis-root mis-auth-shell">
    <Style />
    <div className="mis-auth-hero">
      <div className="mis-auth-hero-gear"><GearMark size={340} spin mosaic={false} /></div>
      <div className="mis-auth-mosaic">{mosaicColors.map((c, i) => <span key={i} style={{ background: c }} />)}</div>
      <div>
        <div className="mis-eyebrow" style={{ color: "rgba(255,255,255,0.6)", marginBottom: 14 }}>{t(lang, "login.eyebrow")}</div>
        <div className="mis-display" style={{ fontSize: 34, color: "#FFFFFF", lineHeight: 1.08 }}>SETVACO</div>
        <StrataRule className="mt-1.5" />
      </div>
      <p className="mis-auth-tagline">{t(lang, "login.tagline")}</p>
    </div>
    <div className="mis-register-wrap">
      <div className="mis-auth-lang">
        <div className="mis-panel-alt mis-focus" style={{ display: "flex", borderRadius: 4, border: "1px solid var(--border)", overflow: "hidden", fontSize: 12 }}>
          <button type="button" onClick={() => setLang("en")} style={{ border: "none", cursor: "pointer", padding: "7px 10px", background: lang === "en" ? "var(--brand)" : "transparent", color: lang === "en" ? "#FFFFFF" : "var(--text-secondary)", fontWeight: lang === "en" ? 600 : 400 }}>EN</button>
          <button type="button" onClick={() => setLang("fr")} style={{ border: "none", cursor: "pointer", padding: "7px 10px", background: lang === "fr" ? "var(--brand)" : "transparent", color: lang === "fr" ? "#FFFFFF" : "var(--text-secondary)", fontWeight: lang === "fr" ? 600 : 400 }}>FR</button>
        </div>
      </div>
      <div className="mis-register-page mis-view-enter">
        <div className="mis-register-margin" />
        <div className="mis-register-head">
          <span className="mis-display" style={{ fontSize: 18, color: "var(--brand)" }}>{t(lang, "login.registerTitle")}</span>
          <span className="mis-mono" style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{todayLabel}</span>
        </div>

        <div className="mis-ghost-cols">
          <span>{t(lang, "login.registerColStaff")}</span><span>{t(lang, "login.registerColTime")}</span><span>{t(lang, "login.registerColStatus")}</span>
        </div>
        {(ghostTimes.length ? ghostTimes.map(fmtGhostTime) : ["", ""]).map((tm, i) => <div className="mis-ghost-row" key={i}>
          <span>••••••••••••••</span><span>{tm || "•••••"}</span><span>{t(lang, "login.registerSignedIn")}</span>
        </div>)}

        {resetSent
          ? <p style={{ fontSize: 13, color: "var(--text-secondary)", marginTop: 20 }}>{t(lang, "login.resetSent")}</p>
          : <form onSubmit={submit} style={{ marginTop: 18 }}>
              <div className="mis-signin-field">
                <div className="mis-signin-label">{t(lang, "login.registerStaffEmail")}</div>
                <input className="mis-signin-input mis-focus" autoFocus type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@setvaco.com" required />
              </div>
              <div className="mis-signin-field">
                <div className="mis-signin-label">{t(lang, "login.registerSignature")} <span className="mis-time-chip">{t(lang, "login.registerTimeIn")} {nowLabel}</span></div>
                <input className="mis-signin-input mis-signin-signature mis-focus" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder={t(lang, "login.registerSignHere")} required />
              </div>
              {error && <p style={{ fontSize: 12, color: "var(--vital)", marginBottom: 14 }}>{error}</p>}
              <button type="submit" disabled={busy} className="mis-stamp-btn mis-focus">{busy ? t(lang, "login.loading") : t(lang, "login.registerSignIn")} ▸</button>
              <button type="button" className="mis-link-btn" style={{ display: "block", fontSize: 11.5, marginTop: 16, color: "var(--text-tertiary)" }} onClick={forgotPassword}>{t(lang, "login.registerForgotSignature")}</button>
            </form>}
      </div>
    </div>
  </div>;
}

// Shown when the URL carries a Supabase password-recovery link
// (#access_token=...&type=recovery — see the hash-parsing useEffect in
// SetvacoBusinessSystem). supabase.auth.updateUser() is the only place a
// plaintext password is ever handled, and it goes straight to Supabase Auth
// over HTTPS — nothing here stores or logs it.
function SetPasswordScreen({ lang, setLang, onDone }) {
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (password.length < 8) { setError(t(lang, "login.passwordTooShort")); return; }
    if (password !== confirm) { setError(t(lang, "login.passwordsDontMatch")); return; }
    setError("");
    setBusy(true);
    const { error: updateError } = await window.sb.auth.updateUser({ password });
    setBusy(false);
    if (updateError) { setError(updateError.message); return; }
    setDone(true);
    setTimeout(onDone, 1200);
  }

  return <AuthShell lang={lang} setLang={setLang}>
    <div className="mis-eyebrow" style={{ marginBottom: 6 }}>{t(lang, "login.setNewPassword")}</div>
    <div className="mis-display" style={{ fontSize: 20, color: "var(--ink)", marginBottom: 10 }}>{t(lang, "login.setNewPasswordHint")}</div>
    {done
      ? <p style={{ fontSize: 13, color: "var(--safe)" }}>{t(lang, "login.passwordSet")}</p>
      : <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14, marginTop: 12 }}>
          <Field label={t(lang, "login.newPassword")}><TInput autoFocus type="password" value={password} onChange={e => setPassword(e.target.value)} /></Field>
          <Field label={t(lang, "login.confirmPassword")}><TInput type="password" value={confirm} onChange={e => setConfirm(e.target.value)} /></Field>
          {error && <p style={{ fontSize: 12, color: "var(--vital)" }}>{error}</p>}
          <button type="submit" disabled={busy} className="mis-btn-primary mis-focus" style={{ justifyContent: "center", padding: "11px 16px" }}>{busy ? t(lang, "login.loading") : t(lang, "login.setPassword")}</button>
        </form>}
  </AuthShell>;
}

  const [loadError, setLoadError] = useState("");
  const [showAdd, setShowAdd] = useState(false);

  async function reload() {
    setLoading(true);

      const [details, unlinked] = await Promise.all([fetchEmployeeDetails(), fetchProfilesWithoutEmployeeDetails()]);
      setRows(details);
      setCandidates(unlinked);
    } catch (err) {
      setLoadError(err.message);

        { header: "Employment Type", render: r => <span style={{ fontSize: 12 }}>{r.employment_type}</span> },
        { header: "Hire Date", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{r.hire_date || "—"}</span> },

function AddEmployeeDetailsModal({ candidates, currentUser, logAction, pushNotification, onClose, onSaved }) {
  const [form, setForm] = useState({ profileId: "", department: "", jobTitle: "", employmentType: "Full-time", hireDate: "", dateOfBirth: "", phone: "", emergencyContactName: "", emergencyContactPhone: "" });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  async function submit(e) {
    e.preventDefault();
    if (!form.profileId || busy) return;
    setBusy(true);
    setError("");
    try {
      const { error: insertError } = await window.sb.from("employee_details").insert({
        profile_id: form.profileId,
        department: form.department || null,
        job_title: form.jobTitle || null,
        employment_type: form.employmentType,
        hire_date: form.hireDate || null,
        date_of_birth: form.dateOfBirth || null,
        phone: form.phone || null,
        emergency_contact_name: form.emergencyContactName || null,
        emergency_contact_phone: form.emergencyContactPhone || null,
      });
      if (insertError) throw insertError;
      const person = candidates.find(c => c.id === form.profileId);
      logAction(currentUser, `Added HR record for ${person ? person.name : "a staff member"}`, "HR");
      pushNotification("hr", `HR record added for ${person ? person.name : "a staff member"}`);
      onSaved();
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  }
  return <Modal title="Add Employee Details" onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>Cancel</button>
    <button type="button" disabled={busy || !form.profileId} className="mis-btn-primary mis-focus" onClick={submit}>{busy ? "Saving…" : "Save"}</button>
  </React.Fragment>}>
    <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {error && <p style={{ fontSize: 12, color: "var(--vital)" }}>{error}</p>}
      <Field label="Staff member">
        <TSelect required value={form.profileId} onChange={e => setForm(f => ({ ...f, profileId: e.target.value }))}>
          <option value="">—</option>
          {candidates.map(c => <option key={c.id} value={c.id}>{c.name} ({c.email})</option>)}
        </TSelect>
      </Field>
      {candidates.length === 0 && <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>Every current login already has an HR record.</p>}
      <div className="mis-grid-2">
        <Field label="Department"><TInput value={form.department} onChange={e => setForm(f => ({ ...f, department: e.target.value }))} /></Field>
        <Field label="Job Title"><TInput value={form.jobTitle} onChange={e => setForm(f => ({ ...f, jobTitle: e.target.value }))} /></Field>
      </div>
      <div className="mis-grid-2">
        <Field label="Employment Type"><TSelect value={form.employmentType} onChange={e => setForm(f => ({ ...f, employmentType: e.target.value }))}>
          <option>Full-time</option><option>Part-time</option><option>Contract</option>
        </TSelect></Field>
        <Field label="Hire Date"><TInput type="date" value={form.hireDate} onChange={e => setForm(f => ({ ...f, hireDate: e.target.value }))} /></Field>
      </div>
      <div className="mis-grid-2">
        <Field label="Date of Birth"><TInput type="date" value={form.dateOfBirth} onChange={e => setForm(f => ({ ...f, dateOfBirth: e.target.value }))} /></Field>
        <Field label="Phone"><TInput value={form.phone} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} /></Field>
      </div>
      <div className="mis-grid-2">
        <Field label="Emergency Contact Name"><TInput value={form.emergencyContactName} onChange={e => setForm(f => ({ ...f, emergencyContactName: e.target.value }))} /></Field>
        <Field label="Emergency Contact Phone"><TInput value={form.emergencyContactPhone} onChange={e => setForm(f => ({ ...f, emergencyContactPhone: e.target.value }))} /></Field>
      </div>
    </form>
  </Modal>;
}

// ---------------------------------------------------------------------------
// HR — Leave Requests. Self-service for everyone (file your own, see your
// own); admin/hr additionally see the whole company and can approve/reject
// — matches leave_requests' RLS exactly (leave_requests_select/_insert/
// _update in 20260812000200_hr_finance.sql).
// ---------------------------------------------------------------------------
function LeaveRequestsPanel({ profile, role, currentUser, logAction, pushNotification, lang }) {
  const canManage = ["admin", "hr"].includes(role);
  const [rows, setRows] = useState([]);
  const [leaveTypes, setLeaveTypes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [actionError, setActionError] = useState("");
  const [busyId, setBusyId] = useState(null);
  const [showFile, setShowFile] = useState(false);

  async function reload() {
    setLoading(true);
    setLoadError("");
    try {
      const [reqs, types] = await Promise.all([fetchLeaveRequests(), fetchLeaveTypes()]);
      setRows(reqs);
      setLeaveTypes(types);
    } catch (err) {
      setLoadError(err.message);
    } finally {
      setLoading(false);
    }
  }
  useEffect(() => { reload(); }, []);

  async function decide(row, status) {
    if (busyId) return;
    setBusyId(row.id);
    setActionError("");
    try {
      const { error } = await window.sb.from("leave_requests").update({ status, decided_by: profile.id, decided_at: new Date().toISOString() }).eq("id", row.id);
      if (error) throw error;
      await reload();
      logAction(currentUser, `${status} leave request for ${row.profiles ? row.profiles.name : "a staff member"}`, "HR");
    } catch (err) {
      setActionError(err.message);
    } finally {
      setBusyId(null);
    }
  }

  const visibleRows = canManage ? rows : rows.filter(r => r.employee_id === profile.id);
  const leaveTypeLabel = key => { const t = leaveTypes.find(x => x.key === key); return t ? t.label : key; };

  if (loading) return <div className="mis-empty">Loading leave requests…</div>;
  if (loadError) return <p style={{ fontSize: 12, color: "var(--vital)" }}>{loadError}</p>;

  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    {actionError && <p style={{ fontSize: 12, color: "var(--vital)" }}>{actionError}</p>}
    <div style={{ display: "flex", justifyContent: "flex-end" }}>
      <button type="button" className="mis-btn-primary mis-focus" onClick={() => setShowFile(true)}><Plus size={14} /> File Leave Request</button>
    </div>
    <DataTable
      columns={[
        { header: "Code", render: r => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{r.display_code}</span> },
        ...(canManage ? [{ header: "Employee", render: r => <span style={{ color: "var(--text-primary)" }}>{r.profiles ? r.profiles.name : "—"}</span> }] : []),
        { header: "Type", render: r => <span style={{ fontSize: 12 }}>{leaveTypeLabel(r.leave_type)}</span> },
        { header: "Dates", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{r.start_date} → {r.end_date}</span> },
        { header: "Reason", render: r => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{r.reason || "—"}</span> },
        { header: "Status", render: r => { const cs = statusColor(r.status); return <Badge color={cs[0]} soft={cs[1]}>{r.status}</Badge>; } },
        { header: "Actions", render: r => (canManage && r.status === "Pending") ? <div style={{ display: "flex", gap: 8 }}>
          <button type="button" disabled={!!busyId} className="mis-link-btn" onClick={() => decide(r, "Approved")}>Approve</button>
          <button type="button" disabled={!!busyId} className="mis-link-btn" onClick={() => decide(r, "Rejected")}>Reject</button>
        </div> : null },
      ]}
      rows={visibleRows}
      rowKey={r => r.id}
      empty="No leave requests yet."
    />
    {showFile && <FileLeaveRequestModal profile={profile} leaveTypes={leaveTypes} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} onClose={() => setShowFile(false)} onFiled={async () => { setShowFile(false); await reload(); }} />}
  </div>;
}

// HR — Attendance. Self-service clock in/out for everyone, matching
// attendance_records' RLS exactly (attendance_records_select/_insert/
// _update in 20260813170205_attendance.sql): an employee can always see
// and punch their own row; admin/hr additionally see and correct the
// whole company's roster.
// ---------------------------------------------------------------------------
function AttendancePanel({ profile, role, currentUser, logAction, lang }) {
  const canManage = ["admin", "hr"].includes(role);
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [busy, setBusy] = useState(false);
  const [actionError, setActionError] = useState("");

  async function reload() {
    setLoading(true);
    setLoadError("");
    try {
      setRows(await fetchAttendanceRecords());
    } catch (err) {
      setLoadError(err.message);
    } finally {
      setLoading(false);
    }
  }
  useEffect(() => { reload(); }, []);

  const today = todayISO();
  const todayRow = rows.find(r => r.employee_id === profile.id && r.work_date === today);

  async function clockIn() {
    if (busy) return;
    setBusy(true);
    setActionError("");
    try {
      const { error } = await window.sb.from("attendance_records").insert({ employee_id: profile.id, clock_in: new Date().toISOString() });
      if (error) throw error;
      await reload();
      logAction(currentUser, "Clocked in", "HR");
    } catch (err) {
      setActionError(err.message);
    } finally {
      setBusy(false);
    }
  }
  async function clockOut() {
    if (busy || !todayRow) return;
    setBusy(true);
    setActionError("");
    try {
      const { error } = await window.sb.from("attendance_records").update({ clock_out: new Date().toISOString() }).eq("id", todayRow.id);
      if (error) throw error;
      await reload();
      logAction(currentUser, "Clocked out", "HR");
    } catch (err) {
      setActionError(err.message);
    } finally {
      setBusy(false);
    }
  }

  const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "—";
  const fmtHours = r => {
    if (!r.clock_in || !r.clock_out) return "—";
    const hrs = (new Date(r.clock_out) - new Date(r.clock_in)) / 3600000;
    return hrs.toFixed(1) + "h";
  };
  const visibleRows = canManage ? rows : rows.filter(r => r.employee_id === profile.id);

  if (loading) return <div className="mis-empty">Loading attendance…</div>;
  if (loadError) return <p style={{ fontSize: 12, color: "var(--vital)" }}>{loadError}</p>;

  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    {actionError && <p style={{ fontSize: 12, color: "var(--vital)" }}>{actionError}</p>}
    <div className="mis-panel" style={{ borderRadius: 2, padding: 16, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
      <div>
        <h3 className="mis-eyebrow" style={{ marginBottom: 4 }}>Today</h3>
        <p className="mis-mono" style={{ fontSize: 13 }}>
          {todayRow ? <React.Fragment>In: {fmtTime(todayRow.clock_in)} {todayRow.clock_out ? <React.Fragment>· Out: {fmtTime(todayRow.clock_out)}</React.Fragment> : null}</React.Fragment> : "Not clocked in yet"}
        </p>
      </div>
      {!todayRow && <button type="button" disabled={busy} className="mis-btn-primary mis-focus" onClick={clockIn}><Clock size={14} /> Clock In</button>}
      {todayRow && !todayRow.clock_out && <button type="button" disabled={busy} className="mis-btn-primary mis-focus" onClick={clockOut}><Clock size={14} /> Clock Out</button>}
      {todayRow && todayRow.clock_out && <Badge color="var(--safe)" soft="var(--safe-soft)">Day complete</Badge>}
    </div>
    <div>
      <h3 className="mis-eyebrow" style={{ marginBottom: 12 }}>{canManage ? "Company Roster" : "Your Recent Days"}</h3>
      <DataTable
        columns={[
          ...(canManage ? [{ header: "Employee", render: r => <span style={{ color: "var(--text-primary)" }}>{r.profiles ? r.profiles.name : "—"}</span> }] : []),
          { header: "Date", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{r.work_date}</span> },
          { header: "Clock In", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{fmtTime(r.clock_in)}</span> },
          { header: "Clock Out", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{fmtTime(r.clock_out)}</span> },
          { header: "Hours", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{fmtHours(r)}</span> },
        ]}
        rows={visibleRows}
        rowKey={r => r.id}
        empty="No attendance records yet."
      />
    </div>
  </div>;
}

function SetCompensationModal({ profile, existing, currentUser, logAction, onClose, onSaved }) {

  const [error, setError] = useState("");

// HR — Training & Certifications. Self-service view, admin/hr-only write
// (verifying the physical certificate is an HR step), matching
// certifications' RLS exactly (certifications_select/_insert in
// 20260813193352_certifications_budgets.sql). "Expiring soon"/"Expired"
// status is computed here from expiry_date, not stored.
// ---------------------------------------------------------------------------
function certStatus(cert) {
  if (!cert.expiry_date) return { label: "No Expiry", color: "var(--text-tertiary)", soft: "var(--panel-alt)" };
  const days = (new Date(cert.expiry_date) - new Date(todayISO())) / 86400000;
  if (days < 0) return { label: "Expired", color: "var(--vital)", soft: "var(--vital-soft)" };
  if (days <= 30) return { label: "Expiring Soon", color: "var(--caution)", soft: "var(--caution-soft)" };
  return { label: "Valid", color: "var(--safe)", soft: "var(--safe-soft)" };
}

// ---------------------------------------------------------------------------
// Finance — Budgets. Admin/finance set a budget per expense category and
// period; "actual" spend is computed here from Approved/Paid expenses in
// that category and period, not stored — matching budgets' RLS exactly
// (budgets_select/_write in 20260813193352_certifications_budgets.sql).
// Scoped to Expense categories only — Purchasing isn't migrated to this
// schema yet (see docs/architecture.md), so a budget can't yet cover it.
// ---------------------------------------------------------------------------
function BudgetsPanel({ currentUser, logAction, lang }) {
  const [budgets, setBudgets] = useState([]);
  const [categories, setCategories] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [showAdd, setShowAdd] = useState(false);

  async function reload() {
    setLoading(true);
    setLoadError("");
    try {
      const [b, c, e] = await Promise.all([fetchBudgets(), fetchExpenseCategories(), fetchExpenses()]);
      setBudgets(b);
      setCategories(c);
      setExpenses(e);
    } catch (err) {
      setLoadError(err.message);
    } finally {
      setLoading(false);
    }
  }
  useEffect(() => { reload(); }, []);

  const categoryLabel = key => { const c = categories.find(x => x.key === key); return c ? c.label : key; };
  function actualFor(b) {
    return expenses
      .filter(e => e.category === b.category && ["Approved", "Paid"].includes(e.status) && e.expense_date >= b.period_start && e.expense_date <= b.period_end)
      .reduce((sum, e) => sum + Number(e.amount), 0);
  }

  if (loading) return <div className="mis-empty">Loading budgets…</div>;
  if (loadError) return <p style={{ fontSize: 12, color: "var(--vital)" }}>{loadError}</p>;

  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <div style={{ display: "flex", justifyContent: "flex-end" }}>
      <button type="button" className="mis-btn-primary mis-focus" onClick={() => setShowAdd(true)}><Plus size={14} /> Set Budget</button>
    </div>
    <DataTable
      columns={[
        { header: "Code", render: r => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{r.display_code}</span> },
        { header: "Category", render: r => <span style={{ color: "var(--text-primary)" }}>{categoryLabel(r.category)}</span> },
        { header: "Period", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{r.period_start} → {r.period_end}</span> },
        { header: "Budget", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{fmtGHS(r.amount)}</span> },
        { header: "Actual", render: r => { const a = actualFor(r); return <span className="mis-mono" style={{ fontSize: 12, color: a > r.amount ? "var(--vital)" : "var(--text-secondary)" }}>{fmtGHS(a)}</span>; } },
        { header: "Remaining", render: r => { const rem = r.amount - actualFor(r); return <span className="mis-mono" style={{ fontSize: 12, color: rem < 0 ? "var(--vital)" : "var(--safe)" }}>{fmtGHS(rem)}</span>; } },
      ]}
      rows={budgets}
      rowKey={r => r.id}
      empty="No budgets set yet."
    />
    {showAdd && <SetBudgetModal categories={categories} currentUser={currentUser} logAction={logAction} onClose={() => setShowAdd(false)} onAdded={async () => { setShowAdd(false); await reload(); }} />}
  </div>;
}

// policies on the `employee-documents` bucket (both in
// 20260813203106_employee_documents.sql) — a doc is only ever fetched via
// a short-lived signed URL, never a public link, since the bucket is

function EmployeeDocumentsPanel({ profile, role, currentUser, logAction, lang }) {
  const canManage = ["admin", "hr"].includes(role);
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);

  const [actionError, setActionError] = useState("");
  const [showUpload, setShowUpload] = useState(false);

  async function reload() {
    setLoading(true);
    setLoadError("");
    try {
      setRows(await fetchEmployeeDocuments());
    } catch (err) {
      setLoadError(err.message);
    } finally {
      setLoading(false);
    }
  }
  useEffect(() => { reload(); }, []);

  async function openDoc(doc) {
    setActionError("");
    const { data, error } = await window.sb.storage.from("employee-documents").createSignedUrl(doc.storage_path, 60);
    if (error) { setActionError(error.message); return; }
    window.open(data.signedUrl, "_blank", "noopener");

  const visibleRows = canManage ? rows : rows.filter(r => r.employee_id === profile.id);

        { header: "File", render: r => <button type="button" className="mis-link-btn" onClick={() => openDoc(r)}>{r.file_name}</button> },

function UploadDocumentModal({ profile, currentUser, logAction, onClose, onUploaded }) {
  const [profiles, setProfiles] = useState([]);
  const [employeeId, setEmployeeId] = useState("");
  const [docType, setDocType] = useState("Contract");
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  useEffect(() => { fetchProfiles().then(p => setProfiles(p.filter(x => x.status === "Active"))).catch(err => setError(err.message)); }, []);
  async function submit(e) {
    e.preventDefault();
    if (!employeeId || !file || busy) return;
    setBusy(true);
    setError("");
    try {
      const path = `${profile.company_id}/${employeeId}/${crypto.randomUUID()}-${file.name}`;
      const { error: uploadError } = await window.sb.storage.from("employee-documents").upload(path, file);
      if (uploadError) throw uploadError;
      const { error: insertError } = await window.sb.from("employee_documents").insert({
        employee_id: employeeId,
        doc_type: docType,
        file_name: file.name,
        storage_path: path,
        file_size: file.size,
      });
      if (insertError) throw insertError;
      logAction(currentUser, `Uploaded ${docType.toLowerCase()} document "${file.name}"`, "HR");
      onUploaded();
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  }
  return <Modal title="Upload Employee Document" onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>Cancel</button>
    <button type="button" disabled={busy} className="mis-btn-primary mis-focus" onClick={submit}>{busy ? "Uploading…" : "Upload"}</button>
  </React.Fragment>}>
    <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {error && <p style={{ fontSize: 12, color: "var(--vital)" }}>{error}</p>}
      <Field label="Employee">
        <TSelect required value={employeeId} onChange={e => setEmployeeId(e.target.value)}>
          <option value="">Select employee…</option>
          {profiles.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </TSelect>
      </Field>
      <Field label="Document Type">
        <TSelect value={docType} onChange={e => setDocType(e.target.value)}>
          {["Contract", "ID", "Certificate", "Payslip", "Other"].map(t => <option key={t} value={t}>{t}</option>)}
        </TSelect>
      </Field>
      <FileDrop label={file ? file.name : "Click or drag a file here"} onFile={setFile} hint="PDF, image, or document file" />
    </form>
  </Modal>;
}

// ---------------------------------------------------------------------------
function ExpensesPanel({ profile, role, currentUser, logAction, pushNotification, lang }) {
  const canManage = ["admin", "finance"].includes(role);
  const [rows, setRows] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [actionError, setActionError] = useState("");
  const [busyId, setBusyId] = useState(null);
  const [showSubmit, setShowSubmit] = useState(false);

  async function reload() {
    setLoading(true);
    setLoadError("");
    try {
      const [expenseRows, cats] = await Promise.all([fetchExpenses(), fetchExpenseCategories()]);
      setRows(expenseRows);
      setCategories(cats);
    } catch (err) {
      setLoadError(err.message);
    } finally {
      setLoading(false);
    }
  }
  useEffect(() => { reload(); }, []);

  async function decide(row, status) {
    if (busyId) return;
    setBusyId(row.id);
    setActionError("");
    try {
      const patch = { status };
      if (status === "Approved" || status === "Paid") { patch.approved_by = profile.id; patch.approved_at = new Date().toISOString(); }
      const { error } = await window.sb.from("expenses").update(patch).eq("id", row.id);
      if (error) throw error;
      await reload();
      logAction(currentUser, `${status} expense ${row.display_code}`, "Finance");
    } catch (err) {
      setActionError(err.message);
    } finally {
      setBusyId(null);
    }
  }

  const visibleRows = canManage ? rows : rows.filter(r => r.submitted_by === profile.id);
  const categoryLabel = key => { const c = categories.find(x => x.key === key); return c ? c.label : key; };

  if (loading) return <div className="mis-empty">Loading expenses…</div>;
  if (loadError) return <p style={{ fontSize: 12, color: "var(--vital)" }}>{loadError}</p>;

  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    {actionError && <p style={{ fontSize: 12, color: "var(--vital)" }}>{actionError}</p>}
    <div style={{ display: "flex", justifyContent: "flex-end" }}>
      <button type="button" className="mis-btn-primary mis-focus" onClick={() => setShowSubmit(true)}><Plus size={14} /> Submit Expense</button>
    </div>
    <DataTable
      columns={[
        { header: "Code", render: r => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{r.display_code}</span> },
        ...(canManage ? [{ header: "Submitted By", render: r => <span style={{ color: "var(--text-primary)" }}>{r.profiles ? r.profiles.name : "—"}</span> }] : []),
        { header: "Category", render: r => <span style={{ fontSize: 12 }}>{categoryLabel(r.category)}</span> },
        { header: "Description", render: r => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{r.description || "—"}</span> },
        { header: "Amount", render: r => <span className="mis-mono">{r.currency_code} {Number(r.amount).toLocaleString()}</span> },
        { header: "Date", render: r => <span className="mis-mono" style={{ fontSize: 12 }}>{r.expense_date}</span> },
        { header: "Status", render: r => { const cs = statusColor(r.status); return <Badge color={cs[0]} soft={cs[1]}>{r.status}</Badge>; } },
        { header: "Actions", render: r => (canManage && r.status === "Pending" && r.submitted_by !== profile.id) ? <div style={{ display: "flex", gap: 8 }}>
          <button type="button" disabled={!!busyId} className="mis-link-btn" onClick={() => decide(r, "Approved")}>Approve</button>
          <button type="button" disabled={!!busyId} className="mis-link-btn" onClick={() => decide(r, "Rejected")}>Reject</button>
        </div> : (canManage && r.status === "Approved" && r.submitted_by !== profile.id) ? <button type="button" disabled={!!busyId} className="mis-link-btn" onClick={() => decide(r, "Paid")}>Mark Paid</button> : null },
      ]}
      rows={visibleRows}
      rowKey={r => r.id}
      empty="No expenses yet."
    />
    {showSubmit && <SubmitExpenseModal profile={profile} categories={categories} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} onClose={() => setShowSubmit(false)} onSubmitted={async () => { setShowSubmit(false); await reload(); }} />}
  </div>;
}

function MeetingRoomPanel({ currentUser, logAction, lang }) {
  const [title, setTitle] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [activeMeeting, setActiveMeeting] = useState(null);

  async function startMeeting(e) {
    e.preventDefault();
    if (busy) return;
    setBusy(true);
    setError("");
    try {
      const { data, error: invokeError } = await window.sb.functions.invoke("create-meeting-room", { body: { title: title.trim() } });
      // supabase-js only rejects on network failure — a 503/502/500 from
      // the function still resolves here with `data` holding the error
      // body, so both paths need checking.
      if (invokeError) throw invokeError;
      if (!data || data.error) throw new Error((data && data.message) || (data && data.error) || "Could not start the meeting.");
      setActiveMeeting(data.meeting);
      logAction(currentUser, `Started a meeting${title.trim() ? `: ${title.trim()}` : ""}`, "Meeting Room");

      setError(err.message);
    } finally {
      setBusy(false);

        style={{ width: "100%", height: "70vh", border: "1px solid var(--border)" }}

  return <div className="mis-panel" style={{ padding: 24, maxWidth: 480 }}>

    <div className="mis-display" style={{ fontSize: 20, color: "var(--brand)", marginBottom: 18 }}>Start a Meeting</div>
    <form onSubmit={startMeeting} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Field label="Meeting Title (optional)"><TInput value={title} onChange={e => setTitle(e.target.value)} placeholder="Weekly stock review" /></Field>

      <button type="submit" disabled={busy} className="mis-btn-primary mis-focus" style={{ justifyContent: "center" }}>{busy ? "Starting…" : "Start Meeting"}</button>
    </form>
  </div>;
