// MAIN APP
// ---------------------------------------------------------------------------
function SetvacoBusinessSystem() {
  const persisted = loadPersisted();
  // Real Supabase Auth session + the matching `profiles` row (name/role/
  // company). supabase-js persists the session itself (its own localStorage
  // key) — nothing about "who's logged in" is tracked in our own state.
  const [authLoading, setAuthLoading] = useState(true);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [profileError, setProfileError] = useState("");
  // A Supabase password-recovery link lands here as #access_token=...&type=recovery.
  const [recoveryMode, setRecoveryMode] = useState(() => window.__RECOVERY_MODE__ || window.location.hash.includes("type=recovery"));

  useEffect(() => {
    window.sb.auth.getSession().then(({ data }) => { setSession(data.session); setAuthLoading(false); });
    const { data: sub } = window.sb.auth.onAuthStateChange((event, newSession) => {
      if (event === "PASSWORD_RECOVERY") setRecoveryMode(true);
      setSession(newSession);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    let cancelled = false;
    window.sb.from("profiles").select("*").eq("id", session.user.id).single().then(({ data, error }) => {
      if (cancelled) return;
      if (error) { setProfileError(error.message); return; }
      setProfile(data);
      setProfileError("");
    });
    return () => { cancelled = true; };
  }, [session]);

  function countryNameByCode(code) {
    const c = countries.find(x => x.code === code);
    return c ? c.name : (code || "");
  }

  async function reloadCustomers() {
    const rows = await fetchCustomers();
    setCustomers(rows.map(r => mapCustomerFromDb(r, countryNameByCode)));
  }
  async function reloadStock() {
    const roomRows = await fetchStockRooms();
    const mappedRooms = roomRows.map(mapStockRoomFromDb);
    setStockRooms(mappedRooms);
    const roomsById = {};
    mappedRooms.forEach(r => { roomsById[r.id] = r; });
    const itemRows = await fetchItems();
    setItems(itemRows.map(r => mapItemFromDb(r, roomsById)));
  }
  async function reloadSales() {
    const [quotationRows, invoiceRows] = await Promise.all([fetchQuotations(), fetchInvoices()]);
    const mappedQuotations = quotationRows.map(mapQuotationFromDb);
    const mappedInvoices = invoiceRows.map(mapInvoiceFromDb);
    setQuotations(mappedQuotations);
    setInvoices(mappedInvoices);
    return { quotations: mappedQuotations, invoices: mappedInvoices };
  }
  async function reloadUsers() {
    setUsers(await fetchProfiles());
  }

  // Loads real Customers/Stock Room/Sales/Users data once we know who's
  // signed in (RLS needs an authenticated session to return any rows at all).
  useEffect(() => {
    if (!profile) return;
    let cancelled = false;
    setDataLoading(true);
    setDataError("");
    Promise.all([fetchCountries(), fetchBranches(), fetchTaxProfiles()])
      .then(([countryRows, branchRows, taxProfileRows]) => {
        if (cancelled) return;
        setCountries(countryRows);
        setRealBranches(branchRows);
        setTaxProfiles(taxProfileRows);
        const nameByCode = code => { const c = countryRows.find(x => x.code === code); return c ? c.name : (code || ""); };
        return Promise.all([fetchCustomers(), fetchStockRooms(), fetchQuotations(), fetchInvoices(), fetchProfiles()]).then(([customerRows, roomRows, quotationRows, invoiceRows, profileRows]) => {
          if (cancelled) return;
          setCustomers(customerRows.map(r => mapCustomerFromDb(r, nameByCode)));
          setQuotations(quotationRows.map(mapQuotationFromDb));
          setInvoices(invoiceRows.map(mapInvoiceFromDb));
          setUsers(profileRows);
          const mappedRooms = roomRows.map(mapStockRoomFromDb);
          setStockRooms(mappedRooms);
          const roomsById = {};
          mappedRooms.forEach(r => { roomsById[r.id] = r; });
          return fetchItems().then(itemRows => {
            if (cancelled) return;
            setItems(itemRows.map(r => mapItemFromDb(r, roomsById)));
          });
        });
      })
      .catch(err => { if (!cancelled) setDataError(err.message); })
      .finally(() => { if (!cancelled) setDataLoading(false); });
    return () => { cancelled = true; };
  }, [profile]);

  const [nav, setNav] = useState("dashboard");
  const [lang, setLang] = useState(() => (persisted && persisted.lang) || "en");
  // Stock Room/Inventory and Customers load from the real database (see the
  // data-fetching useEffect below) — no local demo fallback for these three.
  const [stockRooms, setStockRooms] = useState([]);
  const [items, setItems] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [countries, setCountries] = useState([]);
  const [taxProfiles, setTaxProfiles] = useState([]);
  const [realBranches, setRealBranches] = useState([]);
  const [dataLoading, setDataLoading] = useState(true);
  const [dataError, setDataError] = useState("");
  // null = gating not active (feature not loaded yet, or the
  // tenant_features table doesn't exist on this database yet) — nav items
  // with a `feature` tag are treated as allowed rather than hidden, so this
  // stays backward-compatible with a database that predates the migration.
  const [companyFeatures, setCompanyFeatures] = useState(null);
  const [vendors, setVendors] = useState(() => (persisted && persisted.vendors) || initialVendors);
  // Quotations/invoices load from the real database (see the data-fetching
  // useEffect below) — no local demo fallback, same as customers/stock.
  const [quotations, setQuotations] = useState([]);
  const [invoices, setInvoices] = useState([]);
  const [purchaseOrders, setPurchaseOrders] = useState(() => (persisted && persisted.purchaseOrders) || initialPurchaseOrders);
  const [serviceJobs, setServiceJobs] = useState(() => (persisted && persisted.serviceJobs) || initialServiceJobs);
  const [assets, setAssets] = useState(() => (persisted && persisted.assets) || initialAssets);
  const [serviceContracts, setServiceContracts] = useState(() => (persisted && persisted.serviceContracts) || initialServiceContracts);
  const [savedReports, setSavedReports] = useState(() => (persisted && persisted.savedReports) || []);
  const [priceBooks, setPriceBooks] = useState(() => (persisted && persisted.priceBooks) || initialPriceBooks);
  const [priceBookEntries, setPriceBookEntries] = useState(() => (persisted && persisted.priceBookEntries) || initialPriceBookEntries);
  const [users, setUsers] = useState([]);
  const [auditLog, setAuditLog] = useState(() => (persisted && persisted.auditLog) || initialAuditLog);
  const [notifications, setNotifications] = useState(() => (persisted && persisted.notifications) || initialNotifications);
  const [approvalSettings, setApprovalSettings] = useState(() => (persisted && persisted.approvalSettings) || initialApprovalSettings);
  const [emailTemplates, setEmailTemplates] = useState(() => (persisted && persisted.emailTemplates) || initialEmailTemplates);
  const [toast, setToast] = useState(null);
  const [collapsed, setCollapsed] = useState(false);
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [expandedRooms, setExpandedRooms] = useState(() => new Set());

  useEffect(() => {
    if (!profile) { setCompanyFeatures(null); return; }
    let cancelled = false;
    fetchTenantFeatures()
      .then(keys => { if (!cancelled) setCompanyFeatures(keys); })
      .catch(() => { if (!cancelled) setCompanyFeatures(null); });
    return () => { cancelled = true; };
  }, [profile]);

  const role = profile ? profile.role : null;
  const currentUser = profile ? profile.name : null;
  const allowedNav = NAV.filter(n =>
    n.roles.includes(role) && (!n.feature || !companyFeatures || companyFeatures.includes(n.feature))
  );
  const allowedNavKeys = new Set(allowedNav.map(n => n.key));
  const allowedRooms = ROOMS
    .map(r => ({ ...r, stations: r.stations.filter(s => allowedNavKeys.has(s.key)) }))
    .filter(r => r.stations.length > 0);

  useEffect(() => { if (profile && !allowedNav.find(n => n.key === nav)) setNav(allowedNav[0] ? allowedNav[0].key : "dashboard"); /* eslint-disable-next-line */ }, [role, companyFeatures]);
  useEffect(() => {
    savePersisted({ stockRooms, items, vendors, customers, quotations, invoices, purchaseOrders, serviceJobs, assets, serviceContracts, savedReports, priceBooks, priceBookEntries, users, auditLog, notifications, approvalSettings, emailTemplates, lang });
  }, [stockRooms, items, vendors, customers, quotations, invoices, purchaseOrders, serviceJobs, assets, serviceContracts, savedReports, priceBooks, priceBookEntries, users, auditLog, notifications, approvalSettings, emailTemplates, lang]);
  // Auto-expand whichever room contains the current station, so landing on
  // (or switching to) a station via CommandPalette/deep link always shows
  // it in context rather than leaving its room collapsed.
  useEffect(() => {
    const room = ROOMS.find(r => r.stations.some(s => s.key === nav));
    if (room) setExpandedRooms(prev => new Set(prev).add(room.tag));
  }, [nav]);
  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setPaletteOpen(o => !o); }
      if (e.key === "Escape") setPaletteOpen(false);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  function showToast(msg) { setToast({ msg, id: Date.now() }); setTimeout(() => setToast(t => (t && t.msg === msg ? null : t)), 3200); }
  function logAction(user, action, mod) {
    setAuditLog(al => [{ id: uid("AL", al, 3), ts: nowISO(), user, action, module: mod, comments: [] }, ...al]);
    showToast(action);
  }
  function pushNotification(type, message, forUser) {
    setNotifications(ns => [{ id: uid("N", ns, 3), ts: nowISO(), type, message, read: false, forUser: forUser || null }, ...ns]);
  }
  function commentOnActivity(entryId, note) {
    if (!note || !note.trim()) return;
    let targetUser = "";
    setAuditLog(al => al.map(a => {
      if (a.id !== entryId) return a;
      targetUser = a.user;
      return { ...a, comments: [...(a.comments || []), { ts: nowISO(), note: note.trim(), by: currentUser }] };
    }));
    if (targetUser && targetUser !== currentUser) pushNotification("comment", note.trim(), targetUser);
  }
  function sendStaffMessage(toUserName, note) {
    if (!note || !note.trim()) return;
    pushNotification("message", note.trim(), toUserName);
    logAction(currentUser, `Sent a message to ${toUserName}`, "Staff Activity");
  }
  function resetDemoData() {
    if (!window.confirm("Reset all data back to the original demo dataset? This clears anything added in this browser.")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* storage unavailable */ }
    window.location.reload();
  }
  function logout() { window.sb.auth.signOut(); }

  if (recoveryMode) {
    return <SetPasswordScreen lang={lang} setLang={setLang} onDone={() => {
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
      setRecoveryMode(false);
    }} />;
  }
  if (authLoading) {
    return <AuthShell lang={lang} setLang={setLang}><p style={{ fontSize: 13, color: "var(--text-secondary)" }}>{t(lang, "login.loading")}</p></AuthShell>;
  }
  if (!session) {
    return <LoginScreen lang={lang} setLang={setLang} />;
  }
  if (!profile) {
    // Signed in with Supabase Auth but no matching `profiles` row (or RLS
    // denied it, e.g. a suspended account) — a real, informative dead end
    // rather than silently hanging on a blank screen.
    return <AuthShell lang={lang} setLang={setLang}>
      <p style={{ fontSize: 13, color: "var(--vital)", marginBottom: 12 }}>{profileError || t(lang, "login.invalid")}</p>
      <button type="button" className="mis-btn-ghost mis-focus" onClick={logout}>{t(lang, "login.backToSignIn")}</button>
    </AuthShell>;
  }

  const sidebarWidth = collapsed ? 76 : 236;
  return <div className="mis-root" style={{ minHeight: "700px", width: "100%", display: "flex" }}>
    <Style />
    <aside className="mis-sidebar" style={{ width: sidebarWidth, flexShrink: 0, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: collapsed ? "20px 0" : "20px 16px", justifyContent: collapsed ? "center" : "flex-start", borderBottom: "1px solid var(--brand-line)" }}>
        <div className="mis-seal" style={{ width: 40, height: 40, flexShrink: 0, borderRadius: 4 }}>
          <GearMark size={26} spin />
        </div>
        {!collapsed && <div>
          <div className="mis-display" style={{ fontSize: 16, color: "#FFFFFF", lineHeight: 1.1 }}>SETVACO</div>
          <div className="mis-mono" style={{ fontSize: 9.5, color: "rgba(255,255,255,0.55)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{t(lang, "app.drawingSetLive")}</div>
        </div>}
      </div>
      {!collapsed && <div className="mis-mono" style={{ padding: "12px 16px 4px", fontSize: 9.5, letterSpacing: "0.1em", textTransform: "uppercase", color: "rgba(255,255,255,0.4)" }}>{t(lang, "app.sheetIndex")}</div>}
      <nav className="mis-scroll" style={{ flex: 1, padding: "6px 0", overflowY: "auto" }}>
        {allowedRooms.map(room => {
          const single = room.stations.length === 1;
          const expanded = expandedRooms.has(room.tag);
          const roomActive = room.stations.some(s => s.key === nav);
          return <div key={room.tag} className="mis-room">
            <button type="button" title={collapsed ? room.name : undefined} className={"mis-room-head mis-focus" + (roomActive && single ? " active" : "")}
              onClick={() => single ? setNav(room.stations[0].key) : setExpandedRooms(prev => { const next = new Set(prev); next.has(room.tag) ? next.delete(room.tag) : next.add(room.tag); return next; })}>
              <span className="mis-room-tag">{room.tag}</span>
              {!collapsed && <React.Fragment>
                <span className="mis-room-name">{room.name}</span>
                {!single && <span className="mis-room-caret">{expanded ? "▾" : "▸"}</span>}
              </React.Fragment>}
            </button>
            {!collapsed && !single && expanded && <div className="mis-stations">
              {room.stations.map(s => { const active = nav === s.key; const label = t(lang, "nav." + s.key); return (
                <button key={s.key} type="button" className={"mis-station mis-focus" + (active ? " active" : "")} onClick={() => setNav(s.key)}>
                  <span className="mis-station-tag">{room.tag}-{String(room.stations.indexOf(s) + 1).padStart(2, "0")}</span> {label}
                </button>
              ); })}
            </div>}
          </div>;
        })}
      </nav>
      <div style={{ padding: collapsed ? "10px 0" : "10px 16px", display: "flex", justifyContent: collapsed ? "center" : "flex-end" }}>
        <button type="button" className="mis-focus" onClick={() => setCollapsed(c => !c)} style={{ background: "rgba(255,255,255,0.08)", border: "none", color: "rgba(255,255,255,0.65)", width: 26, height: 26, borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
          <ChevronDown size={14} style={{ transform: collapsed ? "rotate(-90deg)" : "rotate(90deg)", transition: "transform 0.2s ease" }} />
        </button>
      </div>
      {!collapsed && <div className="mis-mono" style={{ padding: "10px 16px 16px", fontSize: 10, color: "rgba(255,255,255,0.42)", borderTop: "1px solid var(--brand-line)" }}>
        {t(lang, "app.footer")}
        <div style={{ marginTop: 6 }}><button type="button" className="mis-link-btn" style={{ color: "rgba(255,255,255,0.55)" }} onClick={resetDemoData}>{t(lang, "app.resetDemo")}</button></div>
      </div>}
    </aside>
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, background: "var(--paper)" }}>
      {/* Title block — modeled on the stamp box in the corner of a real
          engineering drawing (sheet name / date / prepared-by / revision),
          showing real data instead of decoration. See docs/design-system.md. */}
      <header style={{ display: "flex", alignItems: "stretch", justifyContent: "space-between", borderBottom: "2px solid var(--brand)", background: "var(--paper)", flexWrap: "wrap" }}>
        <div style={{ padding: "16px 24px", minWidth: 200 }}>
          {(() => { const room = ROOMS.find(r => r.stations.some(s => s.key === nav)); const station = room && room.stations.find(s => s.key === nav);
            return <div className="mis-eyebrow" style={{ marginBottom: 4 }}>{room ? `${t(lang, "app.sheet")} ${room.tag}${room.stations.length > 1 ? "-" + String(room.stations.indexOf(station) + 1).padStart(2, "0") : ""} — ${room.name}` : t(lang, "app.internal")}</div>; })()}
          <h1 className="mis-display" style={{ fontSize: 24, color: "var(--brand)", lineHeight: 1 }}>{t(lang, "nav." + ((allowedNav.find(n => n.key === nav) || {}).key || "dashboard")).toUpperCase()}</h1>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", borderLeft: "1px solid var(--border)" }}>
          <div style={{ padding: "10px 16px", borderLeft: "1px solid var(--border)", display: "flex", flexDirection: "column", justifyContent: "center", gap: 2 }}>
            <span className="mis-mono" style={{ fontSize: 8.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--text-tertiary)" }}>{t(lang, "app.date")}</span>
            <span className="mis-mono" style={{ fontSize: 12, fontWeight: 500 }}>{todayISO()}</span>
          </div>
          <div style={{ padding: "10px 16px", borderLeft: "1px solid var(--border)", display: "flex", flexDirection: "column", justifyContent: "center", gap: 2 }}>
            <span className="mis-mono" style={{ fontSize: 8.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--text-tertiary)" }}>{t(lang, "app.preparedBy")}</span>
            <span className="mis-mono" style={{ fontSize: 12, fontWeight: 500 }}>{(currentUser || "").toUpperCase()}</span>
          </div>
          <div style={{ padding: "10px 16px", borderLeft: "1px solid var(--border)", display: "flex", flexDirection: "column", justifyContent: "center", gap: 2 }}>
            <span className="mis-mono" style={{ fontSize: 8.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--text-tertiary)" }}>{t(lang, "app.role")}</span>
            <span className="mis-mono" style={{ fontSize: 12, fontWeight: 500 }}>{t(lang, "role." + role).toUpperCase()}</span>
          </div>
          <div style={{ padding: "10px 16px", borderLeft: "1px solid var(--border)", display: "flex", flexDirection: "column", justifyContent: "center", gap: 2 }}>
            <span className="mis-mono" style={{ fontSize: 8.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--text-tertiary)" }}>{t(lang, "app.status")}</span>
            <span className="mis-mono" style={{ fontSize: 12, fontWeight: 500, color: "var(--teal)" }}>● {t(lang, "app.live")}</span>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 20px", borderLeft: "1px solid var(--border)" }}>
          <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setPaletteOpen(true)} style={{ color: "var(--text-tertiary)" }}>
            <Search size={14} /> {t(lang, "app.search")} <span className="mis-kbd" style={{ marginLeft: 6 }}>⌘K</span>
          </button>
          <NotificationBell notifications={notifications} setNotifications={setNotifications} currentUser={currentUser} lang={lang} />
          <div className="mis-panel-alt mis-focus" style={{ display: "flex", borderRadius: 4, border: "1px solid var(--border)", overflow: "hidden", fontSize: 12 }} title={t(lang, "app.language")}>
            <button type="button" onClick={() => setLang("en")} style={{ border: "none", cursor: "pointer", padding: "7px 10px", background: lang === "en" ? "var(--ore)" : "transparent", color: lang === "en" ? "#FFFFFF" : "var(--text-secondary)", fontWeight: lang === "en" ? 600 : 400 }}>EN</button>
            <button type="button" onClick={() => setLang("fr")} style={{ border: "none", cursor: "pointer", padding: "7px 10px", background: lang === "fr" ? "var(--ore)" : "transparent", color: lang === "fr" ? "#FFFFFF" : "var(--text-secondary)", fontWeight: lang === "fr" ? 600 : 400 }}>FR</button>
          </div>
          <Avatar name={currentUser} role={role} size={30} />
          <button type="button" className="mis-btn-ghost mis-focus" onClick={logout}>{t(lang, "login.logout")}</button>
        </div>
      </header>
      <main className="mis-scroll" style={{ flex: 1, overflow: "auto", padding: 24 }}>
        <div key={nav} className="mis-view-enter">
          {nav === "dashboard" && <Dashboard items={items} quotations={quotations} invoices={invoices} purchaseOrders={purchaseOrders} customers={customers} serviceContracts={serviceContracts} auditLog={auditLog} realBranches={realBranches} role={role} lang={lang} />}
          {nav === "partsInventory" && <InventoryPanel type="part" items={items} setItems={setItems} stockRooms={stockRooms} setStockRooms={setStockRooms} realBranches={realBranches} reloadStock={reloadStock} dataLoading={dataLoading} dataError={dataError} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} vendors={vendors} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} auditLog={auditLog} lang={lang} />}
          {nav === "equipmentInventory" && <InventoryPanel type="equipment" items={items} setItems={setItems} stockRooms={stockRooms} setStockRooms={setStockRooms} realBranches={realBranches} reloadStock={reloadStock} dataLoading={dataLoading} dataError={dataError} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} vendors={vendors} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} auditLog={auditLog} lang={lang} />}
          {nav === "salesoverview" && <SalesOverview quotations={quotations} invoices={invoices} serviceJobs={serviceJobs} customers={customers} items={items} purchaseOrders={purchaseOrders} role={role} lang={lang} />}
          {(nav === "partsales" || nav === "equipmentsales") && <SalesQuotations page={nav} role={role} currentUser={currentUser} customers={customers} items={items} taxProfiles={taxProfiles} reloadSales={reloadSales} reloadCustomers={reloadCustomers} reloadStock={reloadStock} quotations={quotations} setQuotations={setQuotations} invoices={invoices} approvalSettings={approvalSettings} users={users} logAction={logAction} pushNotification={pushNotification} emailTemplates={emailTemplates} lang={lang} />}
          {nav === "assets" && <AssetsTab role={role} currentUser={currentUser} assets={assets} setAssets={setAssets} customers={customers} items={items} serviceJobs={serviceJobs} logAction={logAction} lang={lang} />}
          {nav === "contracts" && <ContractsTab role={role} currentUser={currentUser} contracts={serviceContracts} setContracts={setServiceContracts} customers={customers} assets={assets} logAction={logAction} lang={lang} />}
          {nav === "reports" && <ReportsTab quotations={quotations} invoices={invoices} serviceJobs={serviceJobs} purchaseOrders={purchaseOrders} items={items} customers={customers} savedReports={savedReports} setSavedReports={setSavedReports} currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "servicejobs" && <ServiceJobsTab serviceJobs={serviceJobs} setServiceJobs={setServiceJobs} customers={customers} setCustomers={setCustomers} reloadCustomers={reloadCustomers} items={items} quotations={quotations} setQuotations={setQuotations} approvalSettings={approvalSettings} priceBooks={priceBooks} priceBookEntries={priceBookEntries} users={users} assets={assets} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} emailTemplates={emailTemplates} lang={lang} />}
          {nav === "purchasing" && <Purchasing role={role} currentUser={currentUser} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} vendors={vendors} setVendors={setVendors} items={items} setItems={setItems} customers={customers} logAction={logAction} pushNotification={pushNotification} lang={lang} />}
          {nav === "employees" && <EmployeesPanel currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} lang={lang} />}
          {nav === "attendance" && <AttendancePanel profile={profile} role={role} currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "leaverequests" && <LeaveRequestsPanel profile={profile} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} lang={lang} />}
          {nav === "payrollSetup" && <PayrollSetupPanel currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "payroll" && <PayrollPanel currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "performance" && <PerformancePanel profile={profile} role={role} currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "pettyCash" && <PettyCashPanel currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "certifications" && <CertificationsPanel profile={profile} role={role} currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "budgets" && <BudgetsPanel currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "recruitment" && <RecruitmentPanel currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "employeeDocuments" && <EmployeeDocumentsPanel profile={profile} role={role} currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "expenses" && <ExpensesPanel profile={profile} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} lang={lang} />}
          {nav === "customers" && <Customers role={role} currentUser={currentUser} customers={customers} setCustomers={setCustomers} countries={countries} reloadCustomers={reloadCustomers} dataLoading={dataLoading} dataError={dataError} quotations={quotations} invoices={invoices} auditLog={auditLog} priceBooks={priceBooks} logAction={logAction} lang={lang} />}
          {nav === "variance" && <VarianceAudit auditLog={auditLog} lang={lang} />}
          {nav === "staffActivity" && <StaffActivityTab users={users} auditLog={auditLog} currentUser={currentUser} onComment={commentOnActivity} onSendMessage={sendStaffMessage} lang={lang} />}
          {nav === "access" && <UsersAccess role={role} currentUser={currentUser} users={users} reloadUsers={reloadUsers} approvalSettings={approvalSettings} setApprovalSettings={setApprovalSettings} emailTemplates={emailTemplates} setEmailTemplates={setEmailTemplates} priceBooks={priceBooks} setPriceBooks={setPriceBooks} priceBookEntries={priceBookEntries} setPriceBookEntries={setPriceBookEntries} items={items} logAction={logAction} lang={lang} />}
          {nav === "financials" && <CompanyFinancials items={items} quotations={quotations} customers={customers} lang={lang} />}
          {nav === "meetingroom" && <MeetingRoomPanel currentUser={currentUser} logAction={logAction} lang={lang} />}
          {nav === "meetingscheduled" && <ComingSoonPanel title="Scheduled Meetings" note="Meeting scheduling is planned for a later phase — Start a Meeting works today for instant calls." />}
          {nav === "meetingrecordings" && <ComingSoonPanel title="Recordings & Transcripts" note="Recording (opt-in, clearly disclosed) and transcription are planned for later phases, once retention policy is defined." />}
        </div>
      </main>
    </div>
    {toast && <div key={toast.id} className="mis-panel mis-toast" style={{ position: "fixed", bottom: 24, right: 24, borderRadius: 2, fontSize: 13, overflow: "hidden", boxShadow: "0 16px 34px rgba(19,27,74,0.22)", color: "var(--text-primary)", maxWidth: 380, zIndex: 90 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px" }}>
        <div className="mis-pop-in" style={{ width: 24, height: 24, borderRadius: "50%", background: "var(--safe-soft)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <Check size={13} style={{ color: "var(--safe)" }} />
        </div>
        <span>{toast.msg}</span>
      </div>
      <div style={{ height: 3, background: "var(--panel-alt)" }}><div style={{ height: 3, background: "var(--safe)", animation: "mis-toast-bar 3.2s linear forwards" }} /></div>
    </div>}
    <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} allowedNav={allowedNav} setNav={setNav} customers={customers} items={items} quotations={quotations} invoices={invoices} lang={lang} />
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SetvacoBusinessSystem />);
</script>
<script>
(function() {
  // Change this before sharing a demo link. Visible in page source to
  // anyone who looks — a deterrent against casual stumbling, not real
  // access control. Real per-user auth is the login screen above this.
  var ACCESS_CODE = "Setvaco2026";
  var GATE_STRINGS = {
    en: {
      title: "SETVACO Business System", subtitle: "This is a private client demo. Enter the access code to continue.",
      placeholder: "Access code", enter: "Enter", error: "Incorrect access code.",
      heroEyebrow: "SETVACO · Business System",
      tagline: "Crushing & screening equipment, spare parts, and technical service — engineered for mining and quarry operations across West Africa.",
      boxEyebrow: "Private Access"
    },
    fr: {
      title: "Système d'entreprise SETVACO", subtitle: "Ceci est une démonstration client privée. Entrez le code d'accès pour continuer.",
      placeholder: "Code d'accès", enter: "Entrer", error: "Code d'accès incorrect.",
      heroEyebrow: "SETVACO · Système d'entreprise",
      tagline: "Équipements de concassage et de criblage, pièces détachées et service technique — conçus pour les opérations minières et de carrière en Afrique de l'Ouest.",
      boxEyebrow: "Accès privé"
    }
  };

  var overlay = document.getElementById("gate-overlay");
  var input = document.getElementById("gate-input");
  var submitBtn = document.getElementById("gate-submit");
  var errorEl = document.getElementById("gate-error");
  var titleEl = document.getElementById("gate-title");
  var subtitleEl = document.getElementById("gate-subtitle");
  var heroEyebrowEl = document.getElementById("gate-hero-eyebrow");
  var taglineEl = document.getElementById("gate-tagline");
  var boxEyebrowEl = document.getElementById("gate-box-eyebrow");
  var langEnBtn = document.getElementById("gate-lang-en");
  var langFrBtn = document.getElementById("gate-lang-fr");

  function detectLang() {
    try {
      var raw = localStorage.getItem("setvaco_system_state_v1");
      var parsed = raw ? JSON.parse(raw) : null;
      return (parsed && parsed.lang === "fr") ? "fr" : "en";
    } catch (e) { return "en"; }
  }

  function applyLang(lang) {
    var s = GATE_STRINGS[lang] || GATE_STRINGS.en;
    titleEl.textContent = s.title;
    subtitleEl.textContent = s.subtitle;
    input.placeholder = s.placeholder;
    submitBtn.textContent = s.enter;
    heroEyebrowEl.textContent = s.heroEyebrow;
    taglineEl.textContent = s.tagline;
    boxEyebrowEl.textContent = s.boxEyebrow;
    errorEl.textContent = "";
    langEnBtn.className = lang === "en" ? "active" : "";
    langFrBtn.className = lang === "fr" ? "active" : "";
    overlay.dataset.lang = lang;
  }

  function tryUnlock() {
    if (input.value === ACCESS_CODE) {
      // Deliberately not persisted (no sessionStorage/localStorage) — the
      // gate re-prompts on every page load/refresh, not just once per
      // browser session.
      overlay.style.display = "none";
    } else {
      errorEl.textContent = (GATE_STRINGS[overlay.dataset.lang] || GATE_STRINGS.en).error;
      input.value = "";
      input.focus();
    }
  }

  applyLang(detectLang());

  submitBtn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });
  langEnBtn.addEventListener("click", function() { applyLang("en"); input.focus(); });
  langFrBtn.addEventListener("click", function() { applyLang("fr"); input.focus(); });
})();
</script>
</body>
</html>
