function CreateUserModal({ users, setUsers, currentUser, logAction, onClose }) {
  const [form, setForm] = useState({ name: "", email: "", username: "", password: "", role: "sales" });
  function submit(e) {
    e.preventDefault();
    if (!form.name.trim() || !form.email.trim() || !form.username.trim()) return;
    const user = { id: uid("U", users, 2), name: form.name, email: form.email, username: form.username, role: form.role, status: "Active" };
    setUsers(us => [...us, user]);
    logAction(currentUser, `Created user account for ${user.name} (${ROLES[user.role].label})`, "Users & Access");
    onClose();
  }
  return <Modal title="Create user account" onClose={onClose} footer={<React.Fragment>
    <button type="button" className="mis-btn-ghost mis-focus" onClick={onClose}>Cancel</button>
    <button type="button" className="mis-btn-primary mis-focus" onClick={submit}><UserPlus size={14} /> Create account</button>
  </React.Fragment>}>
    <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Field label="Full name"><TInput required value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></Field>
      <div className="mis-grid-2">
        <Field label="Company email"><TInput type="email" required value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} placeholder="name@setvaco.com" /></Field>
        <Field label="Username"><TInput required value={form.username} onChange={e => setForm(f => ({ ...f, username: e.target.value }))} /></Field>
      </div>
      <div className="mis-grid-2">
        <Field label="Temporary password" hint="Demo only — no real authentication is implemented in this prototype"><TInput type="password" required value={form.password} onChange={e => setForm(f => ({ ...f, password: e.target.value }))} /></Field>
        <Field label="Access level / role"><TSelect value={form.role} onChange={e => setForm(f => ({ ...f, role: e.target.value }))}>{Object.entries(ROLES).map(([k, r]) => <option key={k} value={k}>{r.label}</option>)}</TSelect></Field>
      </div>
    </form>
  </Modal>;
}

function UsersAccess({ role, currentUser, users, setUsers, approvalSettings, setApprovalSettings, logAction }) {
  const isSuperUser = role === "admin";
  const [showCreate, setShowCreate] = useState(false);
  const [flaggedText, setFlaggedText] = useState(approvalSettings.flaggedCustomers.join(", "));
  function setUserRole(id, newRole) {
    const u = users.find(x => x.id === id);
    setUsers(us => us.map(x => x.id === id ? { ...x, role: newRole } : x));
    logAction(currentUser, `Changed access level for ${u ? u.name : id} to ${ROLES[newRole].label}`, "Users & Access");
  }
  function toggleStatus(id) {
    const u = users.find(x => x.id === id);
    const wasActive = u && u.status === "Active";
    setUsers(us => us.map(x => x.id === id ? { ...x, status: x.status === "Active" ? "Suspended" : "Active" } : x));
    logAction(currentUser, `${wasActive ? "Suspended" : "Reactivated"} account for ${u ? u.name : id}`, "Users & Access");
  }
  function updateThreshold(v) {
    setApprovalSettings(s => ({ ...s, valueThreshold: Number(v) || 0 }));
  }
  function commitFlagged() {
    const list = flaggedText.split(",").map(s => s.trim()).filter(Boolean);
    setApprovalSettings(s => ({ ...s, flaggedCustomers: list }));
    logAction(currentUser, `Updated approval rules — threshold ${fmtGHS(approvalSettings.valueThreshold)}, flagged: ${list.join(", ") || "none"}`, "Users & Access");
  }
  return <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
    {isSuperUser && <div className="mis-panel" style={{ borderRadius: 16, padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
      <h3 style={{ fontSize: 13, color: "var(--text-secondary)" }}>Approval Rules</h3>
      <p style={{ fontSize: 12, color: "var(--text-tertiary)" }}>Quotations above this value, or from a flagged customer, require management sign-off before they can be sent.</p>
      <div className="mis-grid-2">
        <Field label="Value threshold (GH₵)"><TInput type="number" min="0" value={approvalSettings.valueThreshold} onChange={e => updateThreshold(e.target.value)} onBlur={commitFlagged} /></Field>
        <Field label="Always-flagged customers (comma-separated)"><TInput value={flaggedText} onChange={e => setFlaggedText(e.target.value)} onBlur={commitFlagged} placeholder="e.g. Akwatia Gold Ltd" /></Field>
      </div>
      <button type="button" className="mis-btn-ghost mis-focus" style={{ alignSelf: "flex-start" }} onClick={commitFlagged}>Save approval rules</button>
    </div>}
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <h3 style={{ fontSize: 13, color: "var(--text-secondary)" }}>User accounts</h3>
        {isSuperUser && <button type="button" className="mis-btn-primary mis-focus" onClick={() => setShowCreate(true)}><UserPlus size={14} /> Create user</button>}
      </div>
      <DataTable columns={[
        { header: "Name", render: u => <div style={{ display: "flex", alignItems: "center", gap: 10 }}><Avatar name={u.name} role={u.role} size={28} /><span style={{ color: "var(--text-primary)" }}>{u.name}</span></div> },
        { header: "Company email", render: u => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-secondary)" }}>{u.email}</span> },
        { header: "Username", render: u => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-secondary)" }}>{u.username}</span> },
        { header: "Access level", render: u => isSuperUser ? <TSelect value={u.role} onChange={e => setUserRole(u.id, e.target.value)} style={{ width: 190 }}>{Object.entries(ROLES).map(([k, r]) => <option key={k} value={k}>{r.label}</option>)}</TSelect> : <RolePill role={u.role} /> },
        { header: "Active", render: u => isSuperUser ? <Toggle on={u.status === "Active"} onChange={() => toggleStatus(u.id)} /> : (() => { const cs = statusColor(u.status); return <Badge color={cs[0]} soft={cs[1]}>{u.status}</Badge>; })() }
      ]} rows={users} rowKey={u => u.id} empty="No users yet." />
    </div>
    <div>
      <h3 style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: 12 }}>Module access by role</h3>
      <div className="mis-panel mis-table-wrap" style={{ borderRadius: 16, overflow: "hidden" }}>
        <table className="mis-table">
          <thead><tr><th>Role</th>{NAV.map(n => <th key={n.key} style={{ textAlign: "center" }}>{n.label}</th>)}</tr></thead>
          <tbody>{Object.entries(ROLES).map(([key, r]) => <tr key={key} className="mis-row">
            <td style={{ color: "var(--text-primary)" }}>{r.label}</td>
            {NAV.map(n => <td key={n.key} style={{ textAlign: "center" }}>{n.roles.includes(key) ? <Check size={14} style={{ color: "var(--safe)", margin: "0 auto" }} /> : <span style={{ color: "var(--text-tertiary)" }}>—</span>}</td>)}
          </tr>)}</tbody>
        </table>
      </div>
    </div>
    {showCreate && <CreateUserModal users={users} setUsers={setUsers} currentUser={currentUser} logAction={logAction} onClose={() => setShowCreate(false)} />}
  </div>;
}

function VarianceAudit({ auditLog }) {
  const [sub, setSub] = useState("variance");
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    <Tabs tabs={[{ key: "variance", label: "Stock Variance" }, { key: "audit", label: "Audit Log" }]} active={sub} onChange={setSub} />
    {sub === "variance" && <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div className="mis-panel" style={{ borderRadius: 16, padding: 16, display: "flex", alignItems: "center", gap: 12 }}>
        <TrendingDown size={18} style={{ color: "var(--vital)" }} />
        <p style={{ fontSize: 13, color: "var(--text-secondary)" }}>Variance entries are raised when a branch stock count doesn't reconcile with sales, purchasing, and service-job transactions for that part.</p>
      </div>
      <DataTable columns={[
        { header: "ID", render: v => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{v.id}</span> },
        { header: "Part", render: v => <span style={{ color: "var(--text-primary)" }}>{v.item}</span> },
        { header: "Branch", render: v => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{v.branch}</span> },
        { header: "Expected", render: v => <span className="mis-mono">{v.expected}</span> },
        { header: "Counted", render: v => <span className="mis-mono">{v.counted}</span> },
        { header: "Delta", render: v => <span className="mis-mono" style={{ color: "var(--vital)", display: "flex", alignItems: "center", gap: 4 }}><ArrowDownRight size={12} />{v.delta}</span> },
        { header: "Severity", render: v => <Badge color={v.severity === "High" ? "var(--vital)" : v.severity === "Medium" ? "var(--caution)" : "var(--info)"} soft={v.severity === "High" ? "var(--vital-soft)" : v.severity === "Medium" ? "var(--caution-soft)" : "var(--info-soft)"}>{v.severity}</Badge> },
        { header: "Note", render: v => <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{v.note}</span> }
      ]} rows={varianceLog} rowKey={v => v.id} empty="No variance flags." />
    </div>}
    {sub === "audit" && <DataTable columns={[
      { header: "When", render: a => <span className="mis-mono" style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{fmtDateTime(a.ts)}</span> },
      { header: "User", render: a => <span style={{ color: "var(--text-primary)" }}>{a.user}</span> },
      { header: "Module", render: a => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{a.module}</span> },
      { header: "Action", render: a => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{a.action}</span> }
    ]} rows={auditLog} rowKey={a => a.id} empty="No activity recorded yet." />}
  </div>;
}

function NotificationBell({ notifications, setNotifications }) {
  const [open, setOpen] = useState(false);
  const unread = notifications.filter(n => !n.read).length;
  function toggle() {
    setOpen(o => { const next = !o; if (next) setNotifications(ns => ns.map(n => ({ ...n, read: true }))); return next; });
  }
  return <div style={{ position: "relative" }}>
    <button type="button" className="mis-btn-ghost mis-focus" style={{ padding: 8, position: "relative" }} onClick={toggle}>
      <Bell size={16} />
      {unread > 0 && <span className="mis-bell-dot" />}
    </button>
    {open && <div className="mis-panel" style={{ position: "absolute", right: 0, top: "calc(100% + 8px)", width: 320, borderRadius: 16, zIndex: 60, maxHeight: 360, overflowY: "auto" }}>
      <div style={{ padding: "10px 14px", borderBottom: "1px solid var(--border-soft)", fontSize: 11, color: "var(--text-tertiary)", textTransform: "uppercase" }}>Notifications</div>
      {notifications.length === 0 && <div className="mis-empty">Nothing yet.</div>}
      {notifications.map(n => <div key={n.id} style={{ padding: "10px 14px", borderBottom: "1px solid var(--border-soft)" }}>
        <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{n.message}</div>
        <div style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 2 }}>{fmtDateTime(n.ts)}</div>
      </div>)}
    </div>}
  </div>;
}
function CommandPalette({ open, onClose, allowedNav, setNav, customers, items, quotations, invoices }) {
  const [q, setQ] = useState("");
  const [activeIdx, setActiveIdx] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { if (open) { setQ(""); setActiveIdx(0); setTimeout(() => inputRef.current && inputRef.current.focus(), 20); } }, [open]);
  if (!open) return null;
  const needle = q.trim().toLowerCase();
  const navResults = allowedNav.filter(n => !needle || n.label.toLowerCase().includes(needle)).map(n => ({ kind: "nav", key: "nav-" + n.key, icon: n.icon, label: n.label, sub: "Go to module", action: () => { setNav(n.key); onClose(); } }));
  const custResults = !needle ? [] : customers.filter(c => c.name.toLowerCase().includes(needle) || c.id.toLowerCase().includes(needle)).slice(0, 4).map(c => ({ kind: "customer", key: "c-" + c.id, icon: Users, label: c.name, sub: `Customer · ${c.country}`, action: () => { setNav("customers"); onClose(); } }));
  const itemResults = !needle ? [] : items.filter(i => i.name.toLowerCase().includes(needle) || i.id.toLowerCase().includes(needle)).slice(0, 4).map(i => ({ kind: "item", key: "i-" + i.id, icon: i.type === "equipment" ? Boxes : Package, label: i.name, sub: `${i.id} · ${i.qty} on hand`, action: () => { setNav(i.type === "equipment" ? "equipmentInventory" : "partsInventory"); onClose(); } }));
  const docResults = !needle ? [] : [...quotations, ...invoices].filter(d => d.id.toLowerCase().includes(needle)).slice(0, 4).map(d => ({ kind: "doc", key: "d-" + d.id, icon: FileText, label: d.id, sub: `${d.type} · ${d.status}`, action: () => { setNav("sales"); onClose(); } }));
  const results = [...navResults, ...custResults, ...itemResults, ...docResults].slice(0, 10);
  function onKeyDown(e) {
    if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx(i => Math.min(i + 1, results.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActiveIdx(i => Math.max(i - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); const r = results[activeIdx]; if (r) r.action(); }
    else if (e.key === "Escape") { onClose(); }
  }
  return <div className="mis-cmdk-overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="mis-cmdk" onKeyDown={onKeyDown}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderBottom: "1px solid var(--border-soft)" }}>
        <Search size={16} style={{ color: "var(--text-tertiary)" }} />
        <input ref={inputRef} value={q} onChange={e => { setQ(e.target.value); setActiveIdx(0); }} placeholder="Jump to a module, customer, part, or order…" style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 14, color: "var(--ink)" }} />
        <span className="mis-kbd">ESC</span>
      </div>
      <div style={{ maxHeight: 360, overflowY: "auto", padding: "6px 0" }}>
        {results.length === 0 && <div className="mis-empty">No matches.</div>}
        {results.map((r, i) => { const Ic = r.icon; return <div key={r.key} className={"mis-cmdk-item" + (i === activeIdx ? " active" : "")} onMouseEnter={() => setActiveIdx(i)} onClick={r.action}>
          <Ic size={15} style={{ color: "var(--text-tertiary)", flexShrink: 0 }} />
          <span style={{ flex: 1 }}>{r.label}</span>
          <span style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{r.sub}</span>
        </div>; })}
      </div>
      <div style={{ display: "flex", gap: 10, padding: "8px 16px", borderTop: "1px solid var(--border-soft)", fontSize: 11, color: "var(--text-tertiary)" }}>
        <span><span className="mis-kbd">↑↓</span> navigate</span>
        <span><span className="mis-kbd">↵</span> select</span>
        <span style={{ marginLeft: "auto" }}><span className="mis-kbd">⌘K</span> toggle</span>
      </div>
    </div>
  </div>;
}

// DASHBOARD
// ---------------------------------------------------------------------------
function Dashboard({ items, quotations, invoices, purchaseOrders, customers, auditLog, role }) {
  const [dashboardBranchFilter, setDashboardBranchFilter] = useState("All");
  const dashboardItems = dashboardBranchFilter === "All" ? items : items.filter(i => i.branch === dashboardBranchFilter);
  const stockValue = dashboardItems.reduce((s, i) => s + i.qty * i.cost, 0);
  const lowStock = dashboardItems.filter(i => i.qty < i.reorder);
  const openQuotes = quotations.filter(q => q.status !== "Invoiced").length;
  const inTransitPOs = purchaseOrders.filter(p => p.status === "Ordered" || p.status === "In Transit").length;
  const recentActivity = auditLog.slice(0, 8);
  const fulfilledPct = Math.round(quotations.filter(q => q.status === "Invoiced").length / Math.max(quotations.length, 1) * 100);
  const healthyPct = Math.round((dashboardItems.length - lowStock.length) / Math.max(dashboardItems.length, 1) * 100);
  return <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>Focus on:</span>
      <TSelect value={dashboardBranchFilter} onChange={e => setDashboardBranchFilter(e.target.value)} style={{ width: 200 }}>
        <option value="All">All branches</option>
        {BRANCHES.map(b => <option key={b} value={b}>{b}</option>)}
      </TSelect>
    </div>
    <div className="mis-panel" style={{ borderRadius: 14, padding: 16, display: "flex", alignItems: "center", gap: 32, flexWrap: "wrap" }}>
      <RingStat pct={healthyPct} color="var(--teal)" label="Items above reorder level" sub={`${dashboardItems.length - lowStock.length} of ${dashboardItems.length} items healthy`} big />
      <div style={{ width: 1, alignSelf: "stretch", background: "var(--border)" }} />
      <RingStat pct={fulfilledPct} color="var(--sky)" label="Quotations invoiced" sub={`${quotations.filter(q => q.status === "Invoiced").length} of ${quotations.length} quotations closed`} />
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16 }}>
      <StatCard label="Stock Value" value={fmtGHS(stockValue)} sub={dashboardBranchFilter === "All" ? "Parts & equipment, all branches" : dashboardBranchFilter} icon={Package} tint="var(--ore)" soft="var(--ore-soft)" />
      <StatCard label="Below Reorder Point" value={lowStock.length} sub="Items needing replenishment" icon={AlertTriangle} tint="var(--vital)" soft="var(--vital-soft)" />
      <StatCard label="Open Quotations" value={openQuotes} sub="Parts, equipment & service" icon={ShoppingCart} tint="var(--caution)" soft="var(--caution-soft)" />
      <StatCard label="POs In Progress" value={inTransitPOs} sub="Ordered or in transit" icon={Truck} tint="var(--info)" soft="var(--info-soft)" />
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 16 }}>
      <div className="mis-panel" style={{ borderRadius: 16, padding: 16 }}>
        <h3 style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: 12 }}>Items nearest depletion</h3>
        <div style={{ display: "flex", flexDirection: "column" }}>
          {lowStock.slice(0, 8).map(it => <div key={it.id} className="mis-row" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 8px", borderBottom: "1px solid var(--border-soft)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <CoreSample layers={stockLayers(it)} size={30} />
              <div><div style={{ fontSize: 13, color: "var(--text-primary)" }}>{it.name}</div><div className="mis-mono" style={{ fontSize: 11, color: "var(--text-tertiary)", display: "flex", alignItems: "center", gap: 6 }}>{it.brand} · <BranchTag branch={it.branch} /></div></div>
            </div>
            <div style={{ textAlign: "right" }}><div className="mis-mono" style={{ fontSize: 13, color: "var(--vital)" }}>{it.qty} / {it.reorder}</div><div style={{ fontSize: 11, color: "var(--text-tertiary)" }}>on hand / reorder</div></div>
          </div>)}
          {lowStock.length === 0 && <p style={{ fontSize: 13, color: "var(--text-tertiary)" }}>All items above reorder level.</p>}
        </div>
      </div>
      <div className="mis-panel" style={{ borderRadius: 16, padding: 16 }}>
        <h3 style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: 12 }}>Customer credit risk</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {customers.map(c => { const pct = Math.round((c.outstanding / Math.max(c.creditLimit, 1)) * 100); const risky = pct > 75; return <div key={c.id}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4, color: risky ? "var(--vital)" : "var(--text-secondary)" }}><span>{c.name}</span><span className="mis-mono">{pct}%</span></div>
            <div style={{ width: "100%", borderRadius: 999, height: 6, background: "var(--panel-alt)" }}><div style={{ height: 6, borderRadius: 999, width: `${Math.min(pct, 100)}%`, background: risky ? "var(--vital)" : "var(--ore)" }} /></div>
          </div>; })}
        </div>
      </div>
    </div>
    {["admin", "finance"].includes(role) && <div className="mis-panel" style={{ borderRadius: 16, padding: 16 }}>
      <h3 style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: 12 }}>Recent activity</h3>
      {recentActivity.length === 0 && <div className="mis-empty">No activity recorded yet.</div>}
      {recentActivity.map(a => <div key={a.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid var(--border-soft)", fontSize: 12, gap: 12 }}>
        <span style={{ color: "var(--text-secondary)" }}>{a.action}</span>
        <span style={{ color: "var(--text-tertiary)", whiteSpace: "nowrap" }}>{a.user} · {fmtDateTime(a.ts)}</span>
      </div>)}
    </div>}
  </div>;
}

function SetvacoBusinessSystem() {
  const persisted = loadPersisted();
  const [role, setRole] = useState("admin");
  const [nav, setNav] = useState("dashboard");
  const [stockRooms, setStockRooms] = useState(() => (persisted && persisted.stockRooms) || initialStockRooms);
  const [items, setItems] = useState(() => (persisted && persisted.items) || [...initialParts, ...initialEquipment]);
  const [vendors, setVendors] = useState(() => (persisted && persisted.vendors) || initialVendors);
  const [customers, setCustomers] = useState(() => (persisted && persisted.customers) || initialCustomers);
  const [quotations, setQuotations] = useState(() => (persisted && persisted.quotations) || initialQuotations);
  const [invoices, setInvoices] = useState(() => (persisted && persisted.invoices) || initialInvoices);
  const [purchaseOrders, setPurchaseOrders] = useState(() => (persisted && persisted.purchaseOrders) || initialPurchaseOrders);
  const [serviceJobs, setServiceJobs] = useState(() => (persisted && persisted.serviceJobs) || initialServiceJobs);
  const [users, setUsers] = useState(() => (persisted && persisted.users) || initialUsers);
  const [auditLog, setAuditLog] = useState(() => (persisted && persisted.auditLog) || initialAuditLog);
  const [notifications, setNotifications] = useState(() => (persisted && persisted.notifications) || initialNotifications);
  const [approvalSettings, setApprovalSettings] = useState(() => (persisted && persisted.approvalSettings) || initialApprovalSettings);
  const [toast, setToast] = useState(null);
  const [collapsed, setCollapsed] = useState(false);
  const [paletteOpen, setPaletteOpen] = useState(false);
  const navRefs = useRef({});
  const [pill, setPill] = useState({ top: 0, height: 0, opacity: 0 });

  const currentUser = (CURRENT_USERS[role] || {}).name || "Unknown user";
  const allowedNav = NAV.filter(n => n.roles.includes(role));

  useEffect(() => { if (!allowedNav.find(n => n.key === nav)) setNav(allowedNav[0] ? allowedNav[0].key : "dashboard"); /* eslint-disable-next-line */ }, [role]);
  useEffect(() => {
    savePersisted({ stockRooms, items, vendors, customers, quotations, invoices, purchaseOrders, serviceJobs, users, auditLog, notifications, approvalSettings });
  }, [stockRooms, items, vendors, customers, quotations, invoices, purchaseOrders, serviceJobs, users, auditLog, notifications, approvalSettings]);
  useEffect(() => {
    const el = navRefs.current[nav];
    if (el) setPill({ top: el.offsetTop, height: el.offsetHeight, opacity: 1 });
  }, [nav, collapsed, allowedNav.length]);
  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setPaletteOpen(o => !o); }
      if (e.key === "Escape") setPaletteOpen(false);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  function showToast(msg) { setToast({ msg, id: Date.now() }); setTimeout(() => setToast(t => (t && t.msg === msg ? null : t)), 3200); }
  function logAction(user, action, mod) {
    setAuditLog(al => [{ id: uid("AL", al, 3), ts: nowISO(), user, action, module: mod }, ...al]);
    showToast(action);
  }
  function pushNotification(type, message) {
    setNotifications(ns => [{ id: uid("N", ns, 3), ts: nowISO(), type, message, read: false }, ...ns]);
  }
  function resetDemoData() {
    if (!window.confirm("Reset all data back to the original demo dataset? This clears anything added in this browser.")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* storage unavailable */ }
    window.location.reload();
  }

  const sidebarWidth = collapsed ? 76 : 236;
  return <div className="mis-root" style={{ minHeight: "700px", width: "100%", display: "flex" }}>
    <Style />
    <aside className="mis-sidebar" style={{ width: sidebarWidth, flexShrink: 0, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: collapsed ? "20px 0" : "20px 16px", justifyContent: collapsed ? "center" : "flex-start", borderBottom: "1px solid var(--brand-line)" }}>
        <div className="mis-seal" style={{ width: 44, height: 44, flexShrink: 0 }}>
          <GearMark size={28} spin />
        </div>
        {!collapsed && <div>
          <div className="mis-display" style={{ fontSize: 17, color: "#FFFFFF", lineHeight: 1.1 }}>SETVACO</div>
          <div className="mis-mono" style={{ fontSize: 10, color: "rgba(255,255,255,0.55)" }}>BUSINESS SYSTEM</div>
        </div>}
      </div>
      <nav style={{ flex: 1, padding: "10px 0", position: "relative" }}>
        <div className="mis-nav-pill" style={{ top: pill.top, height: pill.height, opacity: pill.opacity }} />
        {allowedNav.map(n => { const Ic = n.icon; const active = nav === n.key; return <button key={n.key} ref={el => { navRefs.current[n.key] = el; }} type="button" title={collapsed ? n.label : undefined} className={"mis-nav-item mis-focus" + (active ? " active" : "")} onClick={() => setNav(n.key)} style={{ display: "flex", alignItems: "center", gap: 12, justifyContent: collapsed ? "center" : "flex-start", padding: collapsed ? "10px 0" : "10px 16px", fontSize: 13, marginBottom: 2 }}>
          <Ic size={16} />{!collapsed && n.label}
        </button>; })}
      </nav>
      <div style={{ padding: collapsed ? "10px 0" : "10px 16px", display: "flex", justifyContent: collapsed ? "center" : "flex-end" }}>
        <button type="button" className="mis-focus" onClick={() => setCollapsed(c => !c)} style={{ background: "rgba(255,255,255,0.08)", border: "none", color: "rgba(255,255,255,0.65)", width: 26, height: 26, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
          <ChevronDown size={14} style={{ transform: collapsed ? "rotate(-90deg)" : "rotate(90deg)", transition: "transform 0.2s ease" }} />
        </button>
      </div>
      {!collapsed && <div className="mis-mono" style={{ padding: "10px 16px 16px", fontSize: 10, color: "rgba(255,255,255,0.42)", borderTop: "1px solid var(--brand-line)" }}>
        SETVACO HOLDING LTD · PROTOTYPE · DEMO DATA
        <div style={{ marginTop: 6 }}><button type="button" className="mis-link-btn" style={{ color: "rgba(255,255,255,0.55)" }} onClick={resetDemoData}>Reset demo data</button></div>
      </div>}
    </aside>
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, background: "var(--paper)" }}>
      <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 24px", borderBottom: "1px solid var(--border)", background: "var(--paper)", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div className="mis-eyebrow" style={{ marginBottom: 2 }}>SETVACO · INTERNAL</div>
          <h1 className="mis-display" style={{ fontSize: 24, color: "var(--ink)", lineHeight: 1 }}>{((allowedNav.find(n => n.key === nav) || {}).label || "Dashboard").toUpperCase()}</h1>
          <StrataRule className="mt-1.5" />
          <p style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 6 }}>Signed in as {currentUser} · {ROLES[role].label}</p>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setPaletteOpen(true)} style={{ color: "var(--text-tertiary)" }}>
            <Search size={14} /> Search or jump to… <span className="mis-kbd" style={{ marginLeft: 6 }}>⌘K</span>
          </button>
          <NotificationBell notifications={notifications} setNotifications={setNotifications} />
          <div style={{ position: "relative" }}>
            <select value={role} onChange={e => setRole(e.target.value)} className="mis-panel-alt mis-focus" style={{ fontSize: 13, borderRadius: 10, padding: "7px 26px 7px 12px", appearance: "none", color: "var(--text-primary)", border: "1px solid var(--border)" }}>
              {Object.entries(ROLES).map(([key, r]) => <option key={key} value={key}>{r.label}</option>)}
            </select>
            <ChevronDown size={14} style={{ position: "absolute", right: 8, top: 9, color: "var(--text-tertiary)", pointerEvents: "none" }} />
          </div>
        </div>
      </header>
      <main className="mis-scroll" style={{ flex: 1, overflow: "auto", padding: 24 }}>
        <div key={nav} className="mis-view-enter">
          {nav === "dashboard" && <Dashboard items={items} quotations={quotations} invoices={invoices} purchaseOrders={purchaseOrders} customers={customers} auditLog={auditLog} role={role} />}
          {nav === "partsInventory" && <InventoryPanel type="part" items={items} setItems={setItems} stockRooms={stockRooms} setStockRooms={setStockRooms} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} vendors={vendors} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} auditLog={auditLog} />}
          {nav === "equipmentInventory" && <InventoryPanel type="equipment" items={items} setItems={setItems} stockRooms={stockRooms} setStockRooms={setStockRooms} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} vendors={vendors} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} auditLog={auditLog} />}
          {nav === "salesoverview" && <SalesOverview quotations={quotations} invoices={invoices} serviceJobs={serviceJobs} customers={customers} items={items} purchaseOrders={purchaseOrders} role={role} />}
          {(nav === "partsales" || nav === "equipmentsales") && <SalesQuotations page={nav} role={role} currentUser={currentUser} customers={customers} setCustomers={setCustomers} items={items} setItems={setItems} quotations={quotations} setQuotations={setQuotations} invoices={invoices} setInvoices={setInvoices} approvalSettings={approvalSettings} users={users} logAction={logAction} pushNotification={pushNotification} />}
          {nav === "servicejobs" && <ServiceJobsTab serviceJobs={serviceJobs} setServiceJobs={setServiceJobs} customers={customers} setCustomers={setCustomers} items={items} quotations={quotations} setQuotations={setQuotations} approvalSettings={approvalSettings} users={users} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} />}
          {nav === "purchasing" && <Purchasing role={role} currentUser={currentUser} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} vendors={vendors} setVendors={setVendors} items={items} setItems={setItems} customers={customers} logAction={logAction} pushNotification={pushNotification} />}
          {nav === "customers" && <Customers role={role} currentUser={currentUser} customers={customers} setCustomers={setCustomers} quotations={quotations} invoices={invoices} auditLog={auditLog} logAction={logAction} />}
          {nav === "variance" && <VarianceAudit auditLog={auditLog} />}
          {nav === "access" && <UsersAccess role={role} currentUser={currentUser} users={users} setUsers={setUsers} approvalSettings={approvalSettings} setApprovalSettings={setApprovalSettings} logAction={logAction} />}
        </div>
      </main>
    </div>
    {toast && <div key={toast.id} className="mis-panel mis-toast" style={{ position: "fixed", bottom: 24, right: 24, borderRadius: 14, fontSize: 13, overflow: "hidden", boxShadow: "0 16px 34px rgba(19,27,74,0.22)", color: "var(--text-primary)", maxWidth: 380, zIndex: 90 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px" }}>
        <div className="mis-pop-in" style={{ width: 24, height: 24, borderRadius: "50%", background: "var(--safe-soft)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <Check size={13} style={{ color: "var(--safe)" }} />
        </div>
        <span>{toast.msg}</span>
      </div>
      <div style={{ height: 3, background: "var(--panel-alt)" }}><div style={{ height: 3, background: "var(--safe)", animation: "mis-toast-bar 3.2s linear forwards" }} /></div>
    </div>}
    <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} allowedNav={allowedNav} setNav={setNav} customers={customers} items={items} quotations={quotations} invoices={invoices} />
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SetvacoBusinessSystem />);
</script>
</body>
</html>
