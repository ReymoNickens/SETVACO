function Dashboard({ items, quotations, invoices, purchaseOrders, customers, auditLog, role, lang }) {
  const [dashboardBranchFilter, setDashboardBranchFilter] = useState("All");
  const dashboardItems = dashboardBranchFilter === "All" ? items : items.filter(i => i.branch === dashboardBranchFilter);
  const stockValue = dashboardItems.reduce((s, i) => s + i.qty * i.cost, 0);
  const lowStock = dashboardItems.filter(i => i.qty < i.reorder);
  const openQuotes = quotations.filter(q => q.status !== "Invoiced").length;
  const inTransitPOs = purchaseOrders.filter(p => p.status === "Ordered" || p.status === "In Transit").length;
  const recentActivity = auditLog.slice(0, 8);
  const fulfilledPct = Math.round(quotations.filter(q => q.status === "Invoiced").length / Math.max(quotations.length, 1) * 100);
  const healthyPct = Math.round((dashboardItems.length - lowStock.length) / Math.max(dashboardItems.length, 1) * 100);
  return <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>{t(lang, "dash.focusOn")}</span>
      <TSelect value={dashboardBranchFilter} onChange={e => setDashboardBranchFilter(e.target.value)} style={{ width: 200 }}>
        <option value="All">{t(lang, "dash.allBranches")}</option>
        {BRANCHES.map(b => <option key={b} value={b}>{b}</option>)}
      </TSelect>
    </div>
    <div className="mis-panel" style={{ borderRadius: 14, padding: 16, display: "flex", alignItems: "center", gap: 32, flexWrap: "wrap" }}>
      <RingStat pct={healthyPct} color="var(--teal)" label={t(lang, "dash.itemsAboveReorder")} sub={`${dashboardItems.length - lowStock.length} ${t(lang, "dash.of")} ${dashboardItems.length} ${t(lang, "dash.itemsHealthy")}`} big />
      <div style={{ width: 1, alignSelf: "stretch", background: "var(--border)" }} />
      <RingStat pct={fulfilledPct} color="var(--sky)" label={t(lang, "dash.quotationsInvoiced")} sub={`${quotations.filter(q => q.status === "Invoiced").length} ${t(lang, "dash.of")} ${quotations.length} ${t(lang, "dash.quotationsClosed")}`} />
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16 }}>
      <StatCard label={t(lang, "dash.stockValue")} value={fmtGHS(stockValue)} sub={dashboardBranchFilter === "All" ? t(lang, "dash.partsEquipAllBranches") : dashboardBranchFilter} icon={Package} tint="var(--ore)" soft="var(--ore-soft)" />
      <StatCard label={t(lang, "dash.belowReorderPoint")} value={lowStock.length} sub={t(lang, "dash.itemsNeedingReplenishment")} icon={AlertTriangle} tint="var(--vital)" soft="var(--vital-soft)" />
      <StatCard label={t(lang, "dash.openQuotations")} value={openQuotes} sub={t(lang, "dash.partsEquipService")} icon={ShoppingCart} tint="var(--caution)" soft="var(--caution-soft)" />
      <StatCard label={t(lang, "dash.posInProgress")} value={inTransitPOs} sub={t(lang, "dash.orderedOrInTransit")} icon={Truck} tint="var(--info)" soft="var(--info-soft)" />
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 16 }}>
      <div className="mis-panel" style={{ borderRadius: 16, padding: 16 }}>
        <h3 style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: 12 }}>{t(lang, "dash.itemsNearestDepletion")}</h3>
        <div style={{ display: "flex", flexDirection: "column" }}>
          {lowStock.slice(0, 8).map(it => <div key={it.id} className="mis-row" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 8px", borderBottom: "1px solid var(--border-soft)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <CoreSample layers={stockLayers(it)} size={30} />
              <div><div style={{ fontSize: 13, color: "var(--text-primary)" }}>{it.name}</div><div className="mis-mono" style={{ fontSize: 11, color: "var(--text-tertiary)", display: "flex", alignItems: "center", gap: 6 }}>{it.brand} · <BranchTag branch={it.branch} /></div></div>
            </div>
            <div style={{ textAlign: "right" }}><div className="mis-mono" style={{ fontSize: 13, color: "var(--vital)" }}>{it.qty} / {it.reorder}</div><div style={{ fontSize: 11, color: "var(--text-tertiary)" }}>{t(lang, "dash.onHandReorder")}</div></div>
          </div>)}
          {lowStock.length === 0 && <p style={{ fontSize: 13, color: "var(--text-tertiary)" }}>{t(lang, "dash.allItemsAboveReorder")}</p>}
        </div>
      </div>
      <div className="mis-panel" style={{ borderRadius: 16, padding: 16 }}>
        <h3 style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: 12 }}>{t(lang, "dash.customerCreditRisk")}</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {customers.map(c => { const pct = Math.round(creditUtilization(c) * 100); const risky = isCreditRisk(c); return <div key={c.id}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4, color: risky ? "var(--vital)" : "var(--text-secondary)" }}><span>{c.name}</span><span className="mis-mono">{pct}%</span></div>
            <div style={{ width: "100%", borderRadius: 999, height: 6, background: "var(--panel-alt)" }}><div style={{ height: 6, borderRadius: 999, width: `${Math.min(pct, 100)}%`, background: risky ? "var(--vital)" : "var(--ore)" }} /></div>
          </div>; })}
        </div>
      </div>
    </div>
    {["director", "admin", "finance"].includes(role) && <div className="mis-panel" style={{ borderRadius: 16, padding: 16 }}>
      <h3 style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: 12 }}>{t(lang, "dash.recentActivity")}</h3>
      {recentActivity.length === 0 && <div className="mis-empty">{t(lang, "dash.noActivityYet")}</div>}
      {recentActivity.map(a => <div key={a.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid var(--border-soft)", fontSize: 12, gap: 12 }}>
        <span style={{ color: "var(--text-secondary)" }}>{a.action}</span>
        <span style={{ color: "var(--text-tertiary)", whiteSpace: "nowrap" }}>{a.user} · {fmtDateTime(a.ts)}</span>
      </div>)}
    </div>}
  </div>;
}

// ---------------------------------------------------------------------------
// LOGIN — prototype-level gate: checks the typed username against the local
// demo user list (case-insensitive, must be Active) and a shared demo
// password. Not connected to a real backend — the Supabase Auth backend in
// supabase/ already exists and is the intended real login once the frontend
// takes the Vite+React build-step cutover documented in
// docs/architecture.md; this is a faster interim step that at least gates
// entry by a real user identity instead of a free role dropdown.
// ---------------------------------------------------------------------------
const DEMO_PASSWORD = "setvaco-demo";
function LoginScreen({ users, lang, setLang, onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(false);

  function submit(e) {
    e.preventDefault();
    const match = users.find(u => u.username.toLowerCase() === username.trim().toLowerCase() && u.status === "Active");
    if (!match || password !== DEMO_PASSWORD) { setError(true); return; }
    setError(false);
    onLogin(match.id);
  }

  const mosaicColors = ["var(--coral)", "var(--teal)", "var(--sky)", "var(--sky)", "var(--coral)", "var(--teal)", "var(--teal)", "var(--sky)", "var(--coral)"];

  return <div className="mis-root mis-auth-shell">
    <Style />
    <div className="mis-auth-hero">
      <div className="mis-auth-hero-gear"><GearMark size={340} spin mosaic={false} /></div>
      <div className="mis-auth-mosaic">{mosaicColors.map((c, i) => <span key={i} style={{ background: c }} />)}</div>
      <div>
        <div className="mis-eyebrow" style={{ color: "rgba(255,255,255,0.6)", marginBottom: 14 }}>{t(lang, "login.eyebrow")}</div>
        <div className="mis-display" style={{ fontSize: 34, color: "#FFFFFF", lineHeight: 1.08 }}>SETVACO</div>
        <StrataRule className="mt-1.5" />
      </div>
      <p className="mis-auth-tagline">{t(lang, "login.tagline")}</p>
    </div>
    <div className="mis-auth-form-wrap">
      <div className="mis-auth-lang">
        <div className="mis-panel-alt mis-focus" style={{ display: "flex", borderRadius: 10, border: "1px solid var(--border)", overflow: "hidden", fontSize: 12 }}>
          <button type="button" onClick={() => setLang("en")} style={{ border: "none", cursor: "pointer", padding: "7px 10px", background: lang === "en" ? "var(--ore)" : "transparent", color: lang === "en" ? "#FFFFFF" : "var(--text-secondary)", fontWeight: lang === "en" ? 600 : 400 }}>EN</button>
          <button type="button" onClick={() => setLang("fr")} style={{ border: "none", cursor: "pointer", padding: "7px 10px", background: lang === "fr" ? "var(--ore)" : "transparent", color: lang === "fr" ? "#FFFFFF" : "var(--text-secondary)", fontWeight: lang === "fr" ? 600 : 400 }}>FR</button>
        </div>
      </div>
      <div className="mis-auth-card mis-view-enter">
        <div className="mis-eyebrow" style={{ marginBottom: 6 }}>{t(lang, "login.title")}</div>
        <div className="mis-display" style={{ fontSize: 24, color: "var(--ink)", marginBottom: 22 }}>{t(lang, "login.subtitle")}</div>
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Field label={t(lang, "login.username")}><TInput autoFocus value={username} onChange={e => setUsername(e.target.value)} placeholder="e.g. kowusu" /></Field>
          <Field label={t(lang, "login.password")}><TInput type="password" value={password} onChange={e => setPassword(e.target.value)} /></Field>
          {error && <p style={{ fontSize: 12, color: "var(--vital)" }}>{t(lang, "login.invalid")}</p>}
          <button type="submit" className="mis-btn-primary mis-focus" style={{ justifyContent: "center", padding: "11px 16px" }}>{t(lang, "login.signIn")}</button>
        </form>
        <div className="mis-divider" style={{ margin: "22px 0 14px" }} />
        <div style={{ fontSize: 11, color: "var(--text-tertiary)" }}>
          <p style={{ marginBottom: 6 }}>{t(lang, "login.demoHint")}</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
            {users.filter(u => u.status === "Active").map(u => <span key={u.id} className="mis-mono">{u.username} — {t(lang, "role." + u.role)}</span>)}
          </div>
        </div>
      </div>
    </div>
  </div>;
}

// ---------------------------------------------------------------------------
// MAIN APP
// ---------------------------------------------------------------------------
function SetvacoBusinessSystem() {
  const persisted = loadPersisted();
  const [loggedInUserId, setLoggedInUserId] = useState(() => (persisted && persisted.loggedInUserId) || null);
  const [nav, setNav] = useState("dashboard");
  const [lang, setLang] = useState(() => (persisted && persisted.lang) || "en");
  const [stockRooms, setStockRooms] = useState(() => (persisted && persisted.stockRooms) || initialStockRooms);
  const [items, setItems] = useState(() => (persisted && persisted.items) || [...initialParts, ...initialEquipment]);
  const [vendors, setVendors] = useState(() => (persisted && persisted.vendors) || initialVendors);
  const [customers, setCustomers] = useState(() => (persisted && persisted.customers) || initialCustomers);
  const [quotations, setQuotations] = useState(() => (persisted && persisted.quotations) || initialQuotations);
  const [invoices, setInvoices] = useState(() => (persisted && persisted.invoices) || initialInvoices);
  const [purchaseOrders, setPurchaseOrders] = useState(() => (persisted && persisted.purchaseOrders) || initialPurchaseOrders);
  const [serviceJobs, setServiceJobs] = useState(() => (persisted && persisted.serviceJobs) || initialServiceJobs);
  const [users, setUsers] = useState(() => (persisted && persisted.users) || initialUsers);
  const [auditLog, setAuditLog] = useState(() => (persisted && persisted.auditLog) || initialAuditLog);
  const [notifications, setNotifications] = useState(() => (persisted && persisted.notifications) || initialNotifications);
  const [approvalSettings, setApprovalSettings] = useState(() => (persisted && persisted.approvalSettings) || initialApprovalSettings);
  const [emailTemplates, setEmailTemplates] = useState(() => (persisted && persisted.emailTemplates) || initialEmailTemplates);
  const [toast, setToast] = useState(null);
  const [collapsed, setCollapsed] = useState(false);
  const [paletteOpen, setPaletteOpen] = useState(false);
  const navRefs = useRef({});
  const [pill, setPill] = useState({ top: 0, height: 0, opacity: 0 });

  const loggedInUser = users.find(u => u.id === loggedInUserId && u.status === "Active") || null;
  const role = loggedInUser ? loggedInUser.role : null;
  const currentUser = loggedInUser ? loggedInUser.name : null;
  const allowedNav = NAV.filter(n => n.roles.includes(role));

  useEffect(() => { if (loggedInUser && !allowedNav.find(n => n.key === nav)) setNav(allowedNav[0] ? allowedNav[0].key : "dashboard"); /* eslint-disable-next-line */ }, [role]);
  useEffect(() => {
    savePersisted({ stockRooms, items, vendors, customers, quotations, invoices, purchaseOrders, serviceJobs, users, auditLog, notifications, approvalSettings, emailTemplates, lang, loggedInUserId });
  }, [stockRooms, items, vendors, customers, quotations, invoices, purchaseOrders, serviceJobs, users, auditLog, notifications, approvalSettings, emailTemplates, lang, loggedInUserId]);
  useEffect(() => {
    const el = navRefs.current[nav];
    if (el) setPill({ top: el.offsetTop, height: el.offsetHeight, opacity: 1 });
  }, [nav, collapsed, allowedNav.length]);
  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setPaletteOpen(o => !o); }
      if (e.key === "Escape") setPaletteOpen(false);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  function showToast(msg) { setToast({ msg, id: Date.now() }); setTimeout(() => setToast(t => (t && t.msg === msg ? null : t)), 3200); }
  function logAction(user, action, mod) {
    setAuditLog(al => [{ id: uid("AL", al, 3), ts: nowISO(), user, action, module: mod, comments: [] }, ...al]);
    showToast(action);
  }
  function pushNotification(type, message, forUser) {
    setNotifications(ns => [{ id: uid("N", ns, 3), ts: nowISO(), type, message, read: false, forUser: forUser || null }, ...ns]);
  }
  function commentOnActivity(entryId, note) {
    if (!note || !note.trim()) return;
    let targetUser = "";
    setAuditLog(al => al.map(a => {
      if (a.id !== entryId) return a;
      targetUser = a.user;
      return { ...a, comments: [...(a.comments || []), { ts: nowISO(), note: note.trim(), by: currentUser }] };
    }));
    if (targetUser && targetUser !== currentUser) pushNotification("comment", note.trim(), targetUser);
  }
  function sendStaffMessage(toUserName, note) {
    if (!note || !note.trim()) return;
    pushNotification("message", note.trim(), toUserName);
    logAction(currentUser, `Sent a message to ${toUserName}`, "Staff Activity");
  }
  function resetDemoData() {
    if (!window.confirm("Reset all data back to the original demo dataset? This clears anything added in this browser.")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* storage unavailable */ }
    window.location.reload();
  }
  function logout() { setLoggedInUserId(null); }

  if (!loggedInUser) {
    return <LoginScreen users={users} lang={lang} setLang={setLang} onLogin={setLoggedInUserId} />;
  }

  const sidebarWidth = collapsed ? 76 : 236;
  return <div className="mis-root" style={{ minHeight: "700px", width: "100%", display: "flex" }}>
    <Style />
    <aside className="mis-sidebar" style={{ width: sidebarWidth, flexShrink: 0, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: collapsed ? "20px 0" : "20px 16px", justifyContent: collapsed ? "center" : "flex-start", borderBottom: "1px solid var(--brand-line)" }}>
        <div className="mis-seal" style={{ width: 44, height: 44, flexShrink: 0 }}>
          <GearMark size={28} spin />
        </div>
        {!collapsed && <div>
          <div className="mis-display" style={{ fontSize: 17, color: "#FFFFFF", lineHeight: 1.1 }}>SETVACO</div>
          <div className="mis-mono" style={{ fontSize: 10, color: "rgba(255,255,255,0.55)" }}>{t(lang, "app.businessSystem")}</div>
        </div>}
      </div>
      <nav style={{ flex: 1, padding: "10px 0", position: "relative" }}>
        <div className="mis-nav-pill" style={{ top: pill.top, height: pill.height, opacity: pill.opacity }} />
        {allowedNav.map(n => { const Ic = n.icon; const active = nav === n.key; const label = t(lang, "nav." + n.key); return <button key={n.key} ref={el => { navRefs.current[n.key] = el; }} type="button" title={collapsed ? label : undefined} className={"mis-nav-item mis-focus" + (active ? " active" : "")} onClick={() => setNav(n.key)} style={{ display: "flex", alignItems: "center", gap: 12, justifyContent: collapsed ? "center" : "flex-start", padding: collapsed ? "10px 0" : "10px 16px", fontSize: 13, marginBottom: 2 }}>
          <Ic size={16} />{!collapsed && label}
        </button>; })}
      </nav>
      <div style={{ padding: collapsed ? "10px 0" : "10px 16px", display: "flex", justifyContent: collapsed ? "center" : "flex-end" }}>
        <button type="button" className="mis-focus" onClick={() => setCollapsed(c => !c)} style={{ background: "rgba(255,255,255,0.08)", border: "none", color: "rgba(255,255,255,0.65)", width: 26, height: 26, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
          <ChevronDown size={14} style={{ transform: collapsed ? "rotate(-90deg)" : "rotate(90deg)", transition: "transform 0.2s ease" }} />
        </button>
      </div>
      {!collapsed && <div className="mis-mono" style={{ padding: "10px 16px 16px", fontSize: 10, color: "rgba(255,255,255,0.42)", borderTop: "1px solid var(--brand-line)" }}>
        {t(lang, "app.footer")}
        <div style={{ marginTop: 6 }}><button type="button" className="mis-link-btn" style={{ color: "rgba(255,255,255,0.55)" }} onClick={resetDemoData}>{t(lang, "app.resetDemo")}</button></div>
      </div>}
    </aside>
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, background: "var(--paper)" }}>
      <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 24px", borderBottom: "1px solid var(--border)", background: "var(--paper)", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div className="mis-eyebrow" style={{ marginBottom: 2 }}>{t(lang, "app.internal")}</div>
          <h1 className="mis-display" style={{ fontSize: 24, color: "var(--ink)", lineHeight: 1 }}>{t(lang, "nav." + ((allowedNav.find(n => n.key === nav) || {}).key || "dashboard")).toUpperCase()}</h1>
          <StrataRule className="mt-1.5" />
          <p style={{ fontSize: 11, color: "var(--text-tertiary)", marginTop: 6 }}>{t(lang, "app.signedInAs")} {currentUser} · {t(lang, "role." + role)}</p>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button type="button" className="mis-btn-ghost mis-focus" onClick={() => setPaletteOpen(true)} style={{ color: "var(--text-tertiary)" }}>
            <Search size={14} /> {t(lang, "app.search")} <span className="mis-kbd" style={{ marginLeft: 6 }}>⌘K</span>
          </button>
          <NotificationBell notifications={notifications} setNotifications={setNotifications} currentUser={currentUser} lang={lang} />
          <div className="mis-panel-alt mis-focus" style={{ display: "flex", borderRadius: 10, border: "1px solid var(--border)", overflow: "hidden", fontSize: 12 }} title={t(lang, "app.language")}>
            <button type="button" onClick={() => setLang("en")} style={{ border: "none", cursor: "pointer", padding: "7px 10px", background: lang === "en" ? "var(--ore)" : "transparent", color: lang === "en" ? "#FFFFFF" : "var(--text-secondary)", fontWeight: lang === "en" ? 600 : 400 }}>EN</button>
            <button type="button" onClick={() => setLang("fr")} style={{ border: "none", cursor: "pointer", padding: "7px 10px", background: lang === "fr" ? "var(--ore)" : "transparent", color: lang === "fr" ? "#FFFFFF" : "var(--text-secondary)", fontWeight: lang === "fr" ? 600 : 400 }}>FR</button>
          </div>
          <Avatar name={currentUser} role={role} size={30} />
          <button type="button" className="mis-btn-ghost mis-focus" onClick={logout}>{t(lang, "login.logout")}</button>
        </div>
      </header>
      <main className="mis-scroll" style={{ flex: 1, overflow: "auto", padding: 24 }}>
        <div key={nav} className="mis-view-enter">
          {nav === "dashboard" && <Dashboard items={items} quotations={quotations} invoices={invoices} purchaseOrders={purchaseOrders} customers={customers} auditLog={auditLog} role={role} lang={lang} />}
          {nav === "partsInventory" && <InventoryPanel type="part" items={items} setItems={setItems} stockRooms={stockRooms} setStockRooms={setStockRooms} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} vendors={vendors} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} auditLog={auditLog} lang={lang} />}
          {nav === "equipmentInventory" && <InventoryPanel type="equipment" items={items} setItems={setItems} stockRooms={stockRooms} setStockRooms={setStockRooms} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} vendors={vendors} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} auditLog={auditLog} lang={lang} />}
          {nav === "salesoverview" && <SalesOverview quotations={quotations} invoices={invoices} serviceJobs={serviceJobs} customers={customers} items={items} purchaseOrders={purchaseOrders} role={role} lang={lang} />}
          {(nav === "partsales" || nav === "equipmentsales") && <SalesQuotations page={nav} role={role} currentUser={currentUser} customers={customers} setCustomers={setCustomers} items={items} setItems={setItems} quotations={quotations} setQuotations={setQuotations} invoices={invoices} setInvoices={setInvoices} approvalSettings={approvalSettings} users={users} logAction={logAction} pushNotification={pushNotification} emailTemplates={emailTemplates} lang={lang} />}
          {nav === "servicejobs" && <ServiceJobsTab serviceJobs={serviceJobs} setServiceJobs={setServiceJobs} customers={customers} setCustomers={setCustomers} items={items} quotations={quotations} setQuotations={setQuotations} approvalSettings={approvalSettings} users={users} role={role} currentUser={currentUser} logAction={logAction} pushNotification={pushNotification} emailTemplates={emailTemplates} lang={lang} />}
          {nav === "purchasing" && <Purchasing role={role} currentUser={currentUser} purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} vendors={vendors} setVendors={setVendors} items={items} setItems={setItems} customers={customers} logAction={logAction} pushNotification={pushNotification} lang={lang} />}
          {nav === "customers" && <Customers role={role} currentUser={currentUser} customers={customers} setCustomers={setCustomers} quotations={quotations} invoices={invoices} auditLog={auditLog} logAction={logAction} lang={lang} />}
          {nav === "variance" && <VarianceAudit auditLog={auditLog} lang={lang} />}
          {nav === "staffActivity" && <StaffActivityTab users={users} auditLog={auditLog} currentUser={currentUser} onComment={commentOnActivity} onSendMessage={sendStaffMessage} lang={lang} />}
          {nav === "access" && <UsersAccess role={role} currentUser={currentUser} users={users} setUsers={setUsers} approvalSettings={approvalSettings} setApprovalSettings={setApprovalSettings} emailTemplates={emailTemplates} setEmailTemplates={setEmailTemplates} logAction={logAction} lang={lang} />}
          {nav === "financials" && <CompanyFinancials items={items} quotations={quotations} customers={customers} lang={lang} />}
        </div>
      </main>
    </div>
    {toast && <div key={toast.id} className="mis-panel mis-toast" style={{ position: "fixed", bottom: 24, right: 24, borderRadius: 14, fontSize: 13, overflow: "hidden", boxShadow: "0 16px 34px rgba(19,27,74,0.22)", color: "var(--text-primary)", maxWidth: 380, zIndex: 90 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px" }}>
        <div className="mis-pop-in" style={{ width: 24, height: 24, borderRadius: "50%", background: "var(--safe-soft)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <Check size={13} style={{ color: "var(--safe)" }} />
        </div>
        <span>{toast.msg}</span>
      </div>
      <div style={{ height: 3, background: "var(--panel-alt)" }}><div style={{ height: 3, background: "var(--safe)", animation: "mis-toast-bar 3.2s linear forwards" }} /></div>
    </div>}
    <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} allowedNav={allowedNav} setNav={setNav} customers={customers} items={items} quotations={quotations} invoices={invoices} lang={lang} />
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SetvacoBusinessSystem />);
</script>
<script>
(function() {
  // Change this before sharing a demo link. Visible in page source to
  // anyone who looks — a deterrent against casual stumbling, not real
  // access control. Real per-user auth is the login screen above this.
  var ACCESS_CODE = "Setvaco2026";
  var GATE_STRINGS = {
    en: {
      title: "SETVACO Business System", subtitle: "This is a private client demo. Enter the access code to continue.",
      placeholder: "Access code", enter: "Enter", error: "Incorrect access code.",
      heroEyebrow: "SETVACO · Business System",
      tagline: "Crushing & screening equipment, spare parts, and technical service — engineered for mining and quarry operations across West Africa.",
      boxEyebrow: "Private Access"
    },
    fr: {
      title: "Système d'entreprise SETVACO", subtitle: "Ceci est une démonstration client privée. Entrez le code d'accès pour continuer.",
      placeholder: "Code d'accès", enter: "Entrer", error: "Code d'accès incorrect.",
      heroEyebrow: "SETVACO · Système d'entreprise",
      tagline: "Équipements de concassage et de criblage, pièces détachées et service technique — conçus pour les opérations minières et de carrière en Afrique de l'Ouest.",
      boxEyebrow: "Accès privé"
    }
  };

  var overlay = document.getElementById("gate-overlay");
  var input = document.getElementById("gate-input");
  var submitBtn = document.getElementById("gate-submit");
  var errorEl = document.getElementById("gate-error");
  var titleEl = document.getElementById("gate-title");
  var subtitleEl = document.getElementById("gate-subtitle");
  var heroEyebrowEl = document.getElementById("gate-hero-eyebrow");
  var taglineEl = document.getElementById("gate-tagline");
  var boxEyebrowEl = document.getElementById("gate-box-eyebrow");
  var langEnBtn = document.getElementById("gate-lang-en");
  var langFrBtn = document.getElementById("gate-lang-fr");

  function detectLang() {
    try {
      var raw = localStorage.getItem("setvaco_system_state_v1");
      var parsed = raw ? JSON.parse(raw) : null;
      return (parsed && parsed.lang === "fr") ? "fr" : "en";
    } catch (e) { return "en"; }
  }

  function applyLang(lang) {
    var s = GATE_STRINGS[lang] || GATE_STRINGS.en;
    titleEl.textContent = s.title;
    subtitleEl.textContent = s.subtitle;
    input.placeholder = s.placeholder;
    submitBtn.textContent = s.enter;
    heroEyebrowEl.textContent = s.heroEyebrow;
    taglineEl.textContent = s.tagline;
    boxEyebrowEl.textContent = s.boxEyebrow;
    errorEl.textContent = "";
    langEnBtn.className = lang === "en" ? "active" : "";
    langFrBtn.className = lang === "fr" ? "active" : "";
    overlay.dataset.lang = lang;
  }

  function tryUnlock() {
    if (input.value === ACCESS_CODE) {
      // Deliberately not persisted (no sessionStorage/localStorage) — the
      // gate re-prompts on every page load/refresh, not just once per
      // browser session.
      overlay.style.display = "none";
    } else {
      errorEl.textContent = (GATE_STRINGS[overlay.dataset.lang] || GATE_STRINGS.en).error;
      input.value = "";
      input.focus();
    }
  }

  applyLang(detectLang());

  submitBtn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function(e) { if (e.key === "Enter") tryUnlock(); });
  langEnBtn.addEventListener("click", function() { applyLang("en"); input.focus(); });
  langFrBtn.addEventListener("click", function() { applyLang("fr"); input.focus(); });
})();
</script>
</body>
</html>
